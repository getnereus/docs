    status: built
    message: "A {nereid:Nereid} from its image, pinned to the digest"
    accent: "pinned to the digest"
    terminal:
      steps:
        - comment: "Apply the reference Nereid to the reef release"
          run: "nereus nereid apply reference-release"
          options: ["--reef release", "--image localhost:5111/reference-release-controller:0.1.0"]
          output: |-
            ✓ core/nereids/reference-release created, Ready, pinned to sha256:ffb8e8957c6e: see 'nereus release --help'

            Next steps:

              nereus nereid list
    dependsOn: [reef-apply]
    notes: |-
      **The CLI reads the image's labels in the registry** (manifest and config, no layer): name, reef, required reefs, version. It checks the reef exists, writes the `Nereid` object pinned to the digest, and runs the image as its controller, which reports `Ready`. The tag is resolved once, so pushing it again never changes what runs.

      **A name argument wins over the label**, and `--reef` repeats. An image that declares no reef is refused unless `--reef` names one; a Nereid whose required reef has no Nereid is refused too ([Require a reef](../../guides/build/requires.md)).
