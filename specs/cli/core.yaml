  - name: mandate-create
    act: mandate
    topic: "mandate create"
    status: built
    issue: 1273
    message: "A GitHub App is a {mandate:Mandate} of the {nereid:github} Nereid"
    accent: "is a {mandate:Mandate}"
    terminal:
      steps:
        - comment: "The App's identity, bound to the reef"
          run: "nereus mandate create github"
          options: ["--reef authentication", "--nereid github", "--param appId=123456", "--param privateKey=github-app-key", "--param allow=nereus-system:*:contents=read", "--param allow=example:example/app:metadata=read", "--default"]
          output: |-
            ✓ core/mandates/github created (reef: authentication, nereid: github, default)
              clusterrole/controller-github configured (nereid github writes the status of mandate github)

            Next steps:

              nereus mandate list
    dependsOn: [nereid-apply]
    notes: |-
      **A Mandate binds a reef to the Nereid that fulfils it**, with its params (ADR 0011); `--default` makes it the reef's default, and the CLI lets the Nereid write its status (#406). Moved here from the authentication reef's deck (#482), where the App's private key was first stored as a plain secret, `github-app-key` ([nereus secrets create](reefs/secrets.html#create) with `--from-env GITHUB_APP_KEY`).

      **No `--vendor` and no `Application` kind** (owner, 2026-11-09): the model of ADR 0011 holds, and `github` appears only in `nereid apply` and `mandate create`, never in a reef's command. The Nereid is opt-in (`nereus nereid apply github --reef authentication --reef scm`), outside the `internal-developer-platform` profile. It reads the key through a `SecretBinding` in its own namespace (ADR 0023's pattern). A second App is a second Mandate, chosen with `--mandate`. **`allow` says who may ask it a token** (#1287): `<namespace>:<repository or *>:<permission>=<level>[,...]`, repeated (the CLI joins a repeated `--param` with `;`); with none, no token is minted (deny by default).
    pt:
      topic: "mandate create"
      message: "Um GitHub App é um {mandate:Mandate} do Nereid {nereid:github}"
      accent: "é um {mandate:Mandate}"
      notes: |-
        **Um Mandate liga um reef à Nereid que o cumpre**, com os seus params (ADR 0011); o `--default` o torna o padrão do reef, e o CLI deixa a Nereid escrever o seu status (#406). Movido para cá do deck do reef authentication (#482), onde a chave privada do App foi guardada antes como um secret simples, `github-app-key` ([nereus secrets create](reefs/secrets.html#create) com `--from-env GITHUB_APP_KEY`).

        **Sem `--vendor` e sem kind `Application`** (dono, 2026-11-09): o modelo do ADR 0011 vale, e `github` aparece só no `nereid apply` e no `mandate create`, nunca num comando de reef. O Nereid é opcional (`nereus nereid apply github --reef authentication --reef scm`), fora do profile `internal-developer-platform`. Ele lê a chave por um `SecretBinding` no seu próprio namespace (o padrão do ADR 0023). Um segundo App é um segundo Mandate, escolhido com `--mandate`. **O `allow` diz quem pode lhe pedir um token** (#1287): `<namespace>:<repositório ou *>:<permissão>=<nível>[,...]`, repetido (a CLI junta um `--param` repetido com `;`); sem nenhum, nenhum token é emitido (negado por padrão).

