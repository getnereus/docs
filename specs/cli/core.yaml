    dependsOn: [installation-show]
    notes: |-
      **Each change goes to the `Installation` object and to the settings file it came from.** An alias is free text of at most 63 characters; an override (`issuer.storage`, `state.storage` or `secrets.vault`) is checked against its resource's rules, and names a resource to create, never to rename: once the issuer is published, a new name is refused (spec 0005).
    pt:
      topic: "config installation set"
      message: "Mude o alias ou um naming override; nome e id ficam"
      accent: "nome e id ficam"
      notes: |-
        **Cada mudança vai para o objeto `Installation` e para o arquivo de configurações de onde ele veio.** Um alias é texto livre de até 63 caracteres; um override (`issuer.storage`, `state.storage` ou `secrets.vault`) é conferido contra as regras do seu recurso, e nomeia um recurso a criar, nunca a renomear: com o issuer publicado, um nome novo é recusado (spec 0005).

  - name: mcp-tool-list
    act: mcp
    topic: "mcp tool list"
    status: built
    message: "The tools the reefs offer at /mcp, each on or off"
    accent: "on or off"
    terminal:
      steps:
        - comment: "The tools you may call, the core's status first"
          run: "nereus mcp tool list"
          output: |-
            REEF           TOOL                 STATE
            core           status               on
            presentations  presentations_list   on
            presentations  presentations_share  off (write)
    notes: |-
      **Each reef declares its tools in its Nereid's contract, and the Nereus API serves them at `/mcp`** (ADR 0029). A row shows only a tool whose route you may call. `off (write)` is a tool whose route is a `POST`: it starts off until an admin enables it; `off (instance)` is one an admin turned off. Only the tools `on` reach claude.ai.
    pt:
      topic: "mcp tool list"
      message: "As ferramentas que os reefs oferecem em /mcp, cada uma ligada ou desligada"
      accent: "ligada ou desligada"
      notes: |-
        **Cada reef declara suas ferramentas no contrato da sua Nereid, e a API do Nereus as serve em `/mcp`** (ADR 0029). Uma linha mostra só uma ferramenta cuja rota você pode chamar. `off (write)` é uma ferramenta cuja rota é um `POST`: ela começa desligada até um admin habilitá-la; `off (instance)` é uma que um admin desligou. Só as ferramentas `on` chegam ao claude.ai.

  - name: mcp-tool-switch
    act: mcp
    topic: "mcp tool enable | disable"
    status: built
    message: "An admin chooses which tools the instance offers"
    accent: "which tools the instance offers"
    terminal:
      steps:
        - comment: "Stop offering one tool"
          run: "nereus mcp tool disable presentations_list"
          output: |-
            ✓ tool presentations_list disabled for the instance
        - comment: "Offer every tool of a reef; the name above still wins"
          run: "nereus mcp tool enable 'presentations_*'"
          output: |-
            ✓ tools presentations_* enabled for the instance
            ! presentations_list stays off: disabled by its own name, which beats a pattern
    dependsOn: [mcp-tool-list]
    notes: |-
      **The switch lives in the `Installation`'s `spec.mcp.tools`**, written by the Nereus API for a person in `nereus-admins`, so its log names who turned what on or off; anyone else gets the refusal naming the group. A rule is a tool name or `<reef>_*`; an exact name beats a pattern, and within one, disabled wins. A model never changes it: the API refuses the call when it comes through `/mcp`.
    pt:
      topic: "mcp tool enable | disable"
      message: "Um admin escolhe quais ferramentas a instância oferece"
      accent: "quais ferramentas a instância oferece"
      notes: |-
        **O switch fica no `spec.mcp.tools` do `Installation`**, gravado pela API do Nereus para uma pessoa em `nereus-admins`, então o log dela diz quem ligou ou desligou o quê; qualquer outra pessoa recebe a recusa que nomeia o grupo. Uma regra é um nome de ferramenta ou `<reef>_*`; um nome exato vence um padrão, e dentro de um, disabled vence. Um modelo nunca o muda: a API recusa a chamada quando ela vem por `/mcp`.
  - name: mcp-client-add
    act: mcp
    topic: "mcp client add | list | remove"
    status: built
    message: "The instance's /mcp in Claude Code, with one command"
    accent: "in Claude Code"
    terminal:
      steps:
        - comment: "Add the instance's MCP server to Claude Code"
          run: "nereus mcp client add claude-code"
          output: |-
            ✓ claude-code: MCP server nereus added (https://nereus.example.com/mcp, scope user, OAuth client claude-code)

            Next steps:

              claude    # then /mcp, and log in to nereus
        - comment: "The coding agents that have it"
          run: "nereus mcp client list"
          output: |-
            CLIENT       SERVER  URL                             SCOPE
            claude-code  nereus  https://nereus.example.com/mcp  user
    dependsOn: [mcp-tool-list]
    notes: |-
      **It runs the agent's own CLI** (`claude mcp add | get | remove`), never writes its settings and never copies your token: Claude Code logs in for `aud: nereus-mcp` itself (#1880). The OAuth client `claude-code` and its fixed callback port come from the instance's `/.well-known/nereus-configuration`, since Claude Code listens on `http://localhost:<port>/callback` and the realm accepts only that exact address.
    pt:
      topic: "mcp client add | list | remove"
      message: "O /mcp da instância no Claude Code, com um comando"
      accent: "no Claude Code"
      notes: |-
        **Ele roda o CLI do próprio agente** (`claude mcp add | get | remove`), nunca escreve as configurações dele e nunca copia o seu token: o Claude Code faz login para `aud: nereus-mcp` sozinho (#1880). O client OAuth `claude-code` e sua porta fixa de callback vêm do `/.well-known/nereus-configuration` da instância, já que o Claude Code escuta em `http://localhost:<porta>/callback` e o realm aceita só esse endereço exato.
  - name: mcp-local
    act: mcp
    topic: "mcp local add | list | enable | disable"
    status: built
    message: "The CLI as the agent's own MCP server, its tools in groups"
    accent: "in groups"
    terminal:
      steps:
        - comment: "Register the CLI in Claude Code once, with the room's hooks"
          run: "nereus mcp local add"
          output: |-
            ✓ nereus-local added to claude-code (user scope): MCP server `mcp local serve`, hooks PostToolUse, UserPromptSubmit

            Next steps:

              nereus mcp local enable rooms    # inside a Claude Code session, from the agent's Bash tool
        - comment: "Inside a session: its groups of tools"
          run: "nereus mcp local list"
          output: |-
            GROUP  STATE  TOOLS
            rooms  off    whoami, list_agents, post_room, read_room
        - comment: "Turn the room's tools on for this session"
          run: "nereus mcp local enable rooms"
          options: ["--agent speo"]
          output: |-
            ✓ rooms on: the session sees its tools now
        - comment: "And off"
          run: "nereus mcp local disable rooms"
          output: |-
            ✓ rooms off
    dependsOn: [mcp-client-add]
    notes: |-
      **Local, not the instance's `/mcp`** (#2101, ADR 0030): `add` registers this CLI in Claude Code's user scope as the server `nereus-local` (`claude mcp add`, once; `nereus` stays the instance's `/mcp`), and the hooks that run `nereus rooms pull`. Each session keeps its groups in `~/.local/state/nereus/sessions/<claude pid>.json`; the server, started by the same Claude Code, watches it and sends `notifications/tools/list_changed`, so the tools come and go with the session open. With `rooms` off, no tool, no heartbeat and no call to Triton; on, it is the bridge to Triton: the peer tools only, the person's token, the agent named in `Nereus-Agent`. To take the server out: `claude mcp remove nereus-local`.
    pt:
      topic: "mcp local add | list | enable | disable"
      message: "O CLI como o servidor MCP do próprio agente, suas ferramentas em grupos"
      accent: "em grupos"
      notes: |-
        **Local, não o `/mcp` da instância** (#2101, ADR 0030): o `add` registra este CLI no escopo de usuário do Claude Code como o servidor `nereus-local` (`claude mcp add`, uma vez; `nereus` segue sendo o `/mcp` da instância), e os hooks que rodam `nereus rooms pull`. Cada sessão guarda seus grupos em `~/.local/state/nereus/sessions/<pid do claude>.json`; o servidor, iniciado pelo mesmo Claude Code, observa o arquivo e manda `notifications/tools/list_changed`, então as ferramentas vêm e vão com a sessão aberta. Com `rooms` desligado, nenhuma ferramenta, nenhum heartbeat e nenhuma chamada ao Triton; ligado, ele é a ponte para o Triton: só as ferramentas de peer, o token da pessoa, o agente nomeado em `Nereus-Agent`. Para tirar o servidor: `claude mcp remove nereus-local`.
