        **Um argumento de nome ganha do label**, e o `--reef` se repete. Uma imagem que não declara reef é recusada, a não ser que o `--reef` nomeie um; uma Nereid cujo reef exigido não tem Nereid também é recusada ([Exigir um reef](../../guides/build/requires.md)).

