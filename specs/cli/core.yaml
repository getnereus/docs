              example        example/app  metadata=read
    dependsOn: [mandate-create]
    notes: |-
      **Every Mandate shows its reef, Nereid, params and status; the rest is what its Nereid wrote.** Moved here from the authentication reef's deck (#482).

      **There is no `verify` command:** the status is `Ready`, `NotRegistered` (no App yet: [app-register](reefs/authentication.html#app-register)), `NotInstalled` (with the install URL in its message), `InvalidCredentials`, `MissingParam` or `InvalidParam` (an `allow` entry that does not parse, #1287). Permissions start at `metadata` and `contents` read (owner, 2026-11-09). The App's one webhook takes its secret from the param `webhookSecret` and points at the scm reef's receiver (ADR 0024).
