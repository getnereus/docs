deck:
  name: core
  title: "The core of the CLI"
  subtitle: "The CLI's own commands: prepare a cluster, see how it is doing, and apply reefs, Nereids, Mandates and profiles"
  accent: "The CLI's own commands"
  pt:
    title: "O core do CLI"
    subtitle: "Os comandos do próprio CLI: preparar um cluster, ver como ele está, e aplicar reefs, Nereids, Mandates e profiles"
    accent: "Os comandos do próprio CLI"

acts:
  - name: opening
    title: "Opening"
    pt: {title: "Abertura"}
  - name: init
    title: "Init"
    question: "How does a cluster become a Nereus instance?"
    pt: {title: "Init", question: "Como um cluster vira uma instância do Nereus?"}
  - name: status
    title: "Status"
    question: "How is each reef doing?"
    pt: {title: "Status", question: "Como está cada reef?"}
  - name: doctor
    title: "Doctor"
    question: "Is this instance healthy?"
    pt: {title: "Doctor", question: "Esta instância está saudável?"}
  - name: reef
    title: "Reef"
    question: "How does a capability arrive?"
    pt: {title: "Reef", question: "Como uma capacidade chega?"}
  - name: nereid
    title: "Nereid"
    question: "Who looks after a reef?"
    pt: {title: "Nereid", question: "Quem cuida de um reef?"}
  - name: mandate
    title: "Mandate"
    question: "Which Nereid answers, and with which settings?"
    pt: {title: "Mandate", question: "Qual Nereid responde, e com quais configurações?"}
  - name: profile
    title: "Profile"
    question: "Which reefs and Nereids come together?"
    pt: {title: "Profile", question: "Quais reefs e Nereids vêm juntos?"}
  - name: config
    title: "Config"
    question: "Which settings does the platform keep?"
    pt: {title: "Config", question: "Quais configurações a plataforma guarda?"}
  - name: mcp
    title: "MCP"
    question: "Which tools does claude.ai get?"
    pt: {title: "MCP", question: "Quais ferramentas o claude.ai recebe?"}

slides:
  - name: cover
    act: opening
    cover: true
    message: "The core of the CLI"
    notes: |-
      **The source of truth for the CLI's own commands** (#477, #482 (port core into the CLI reference)): the commands of `cli/src/nereus/commands/` that are not a reef's. Every command here is built, and the outputs are what it prints, taken from the walkthrough pages, which record `make scene`'s output; a slide whose output comes from the code or from an offline run says so in its notes.

      **`nereus system`, the deprecated aliases of the first proof of concept (#409), stays out** (owner's decision): its commands are the ones of this deck under their old names.
    pt:
      message: "O core do CLI"
      notes: |-
        **A fonte da verdade dos comandos do próprio CLI** (#477, #482 (migrar o core para a referência do CLI)): os comandos de `cli/src/nereus/commands/` que não são de um reef. Todo comando aqui está pronto, e as saídas são o que ele imprime, tiradas das páginas do walkthrough, que gravam a saída do `make scene`; um slide cuja saída vem do código ou de uma execução offline diz isso nas suas notas.

        **O `nereus system`, os aliases obsoletos da primeira prova de conceito (#409), fica de fora** (decisão do dono): os seus comandos são os deste deck com os nomes antigos.

  - name: groups
    act: opening
    topic: "groups"
    message: "Eight groups, before any reef"
    accent: "before any reef"
    screen:
      - "**init:** prepares the cluster, core and a profile"
      - "**status:** one row per reef and its Nereid"
      - "**doctor:** one pass or fail per check"
      - "**reef:** a capability, its kinds and its command group"
      - "**nereid:** the controller that looks after a reef"
      - "**mandate:** binds a reef to a Nereid, with its params"
      - "**profile:** the reefs, Nereids and Mandates that come together"
      - "**config:** the SLO, the installation and your current owner"
    notes: |-
      **The verbs are kubectl's** (ADR 0013, command conventions): `create`, `apply`, `list`, `get` and `delete`, and every change takes `--dry-run`. A reef's own commands live in its deck ([The CLI](index.html)).
    pt:
      topic: "grupos"
      message: "Oito grupos, antes de qualquer reef"
      accent: "antes de qualquer reef"
      screen:
        - "**init:** prepara o cluster, o core e um profile"
        - "**status:** uma linha por reef e a sua Nereid"
        - "**doctor:** um pass ou fail por verificação"
        - "**reef:** uma capacidade, os seus kinds e o seu grupo de comandos"
        - "**nereid:** o controller que cuida de um reef"
        - "**mandate:** liga um reef a uma Nereid, com os seus params"
        - "**profile:** os reefs, Nereids e Mandates que vêm juntos"
        - "**config:** o SLO, a instalação e o seu owner atual"
      notes: |-
        **Os verbos são os do kubectl** (ADR 0013, convenções de comando): `create`, `apply`, `list`, `get` e `delete`, e toda mudança aceita `--dry-run`. Os comandos de um reef vivem no seu deck ([O CLI](index.html)).

  - name: init-generate-file
    act: init
    topic: "init --generate-file"
    status: built
    message: "The settings of init, written once to a file"
    accent: "written once"
    terminal:
      steps:
        - comment: "Write the settings, and create nothing"
          run: "nereus init"
          options: ["--create-cluster", "--name nereus-local", "--generate-file"]
          output: |-
            SETTING            VALUE         SOURCE
            target             k3d           default
            create_cluster     true          flag
            name               nereus-local  flag
            ingress_port       8080          default
            installation_name  nereus-local  cluster name
            profile            core          default
            ✓ settings written to ~/.config/nereus/init.yaml: edit it, then run 'nereus init'
    notes: |-
      **Two documents** (spec 0006): the `InitConfig`, how to build the platform from this machine, and the `Installation`, as it goes to the cluster. A plain `nereus init` reads the file; a flag wins over it, and an unknown key is an error.

      **The output is from an offline run** with a throwaway `XDG_CONFIG_HOME`, since no walkthrough page records it; the path is shown as it is under the default home.
    pt:
      topic: "init --generate-file"
      message: "As configurações do init, escritas uma vez num arquivo"
      accent: "escritas uma vez"
      notes: |-
        **Dois documentos** (spec 0006): o `InitConfig`, como construir a plataforma desta máquina, e a `Installation`, como ela vai para o cluster. Um `nereus init` simples lê o arquivo; uma flag ganha dele, e uma chave desconhecida é um erro.

        **A saída é de uma execução offline** com um `XDG_CONFIG_HOME` descartável, já que nenhuma página do walkthrough a grava; o caminho aparece como fica no home padrão.

  - name: init-dry-run
    act: init
    topic: "init --dry-run"
    status: built
    message: "See each setting and where it came from"
    accent: "where it came from"
    terminal:
      steps:
        - comment: "What init will use, and nothing is created"
          run: "nereus init"
          options: ["--dry-run"]
          output: |-
            SETTING            VALUE         SOURCE
            target             k3d           default
            create_cluster     true          ~/.config/nereus/init.yaml
            name               nereus-local  ~/.config/nereus/init.yaml
            ingress_port       8080          ~/.config/nereus/init.yaml
            installation_name  nereus-local  ~/.config/nereus/init.yaml
            profile            core          ~/.config/nereus/init.yaml
    dependsOn: [init-generate-file]
    notes: |-
      **`installation_name` is the name the installation gets on its first `init`**, with its id: the `metadata.name` of the file's `Installation`, else the cluster name (spec 0006). The dry run also prints the values it would pass to the chart `nereus`, with the two `helm` commands that make the same install by hand.
    pt:
      topic: "init --dry-run"
      message: "Veja cada configuração e de onde ela veio"
      accent: "de onde ela veio"
      notes: |-
        **O `installation_name` é o nome que a instalação recebe no seu primeiro `init`**, com o seu id: o `metadata.name` da `Installation` do arquivo, senão o nome do cluster (spec 0006). O dry run também imprime os values que passaria ao chart `nereus`, com os dois comandos `helm` que fazem a mesma instalação à mão.

  - name: init
    act: init
    topic: "init"
    status: built
    message: "Core in two Helm releases, each step with its time"
    accent: "each step with its time"
    terminal:
      steps:
        - comment: "Install or upgrade core, from the settings file"
          run: "nereus init"
          options: ["--yes"]
          output: |-
            SETTING            VALUE         SOURCE
            target             k3d           default
            create_cluster     true          ~/.config/nereus/init.yaml
            name               nereus-local  ~/.config/nereus/init.yaml
            ingress_port       8080          ~/.config/nereus/init.yaml
            installation_name  nereus-local  ~/.config/nereus/init.yaml
            profile            core          ~/.config/nereus/init.yaml
            ✓ prerequisites             0.0s  docker 29.9.1, k3d 5.9.0, helm 4.1.4
            ✓ registry localhost:5111   0.0s  reused
            ✓ cluster nereus-local      0.1s  reused
            ✓ kinds                     0.4s  release nereus-reefs revision 2
            ✓ images                    0.0s  1 image at 0.1.41.dev146 in localhost:5111
            ✓ nereus                    1.1s  release nereus revision 2, profile core
            ✓ installation              0.3s  kept nereus-local
              total                     1.8s  slo 4m, 0% green
            ✓ cluster ready in context k3d-nereus-local · config in ~/.config/nereus/config.yaml · values in ~/.config/nereus/values.yaml
    dependsOn: [init-dry-run]
    notes: |-
      **`init` checks Docker, k3d and Helm first**, then creates or reuses the local registry and the k3d cluster, and runs two `helm upgrade --install`s: `kinds` (the chart `nereus-reefs`) and `nereus` (the Nereus API and the profile core, with the tenancy reef). Between them, `images` checks that the registry holds every image the release names, and stops with `fix: make nereids` when one is missing, before anything changes (#2062). `installation` reads back the installation's identity.

      **Each step prints its time, and the total is measured against the SLO** (spec 0004): 8 minutes on k3d; this run on a reused cluster was after `nereus config slo set --local 4m` ([The time SLO](../../guides/operate/slo.md)). Missing it never stops `init`; `--check-slo` fails past the tolerance.
    pt:
      topic: "init"
      message: "O core em duas releases do Helm, cada passo com o seu tempo"
      accent: "cada passo com o seu tempo"
      notes: |-
        **O `init` confere o Docker, o k3d e o Helm primeiro**, depois cria ou reusa o registry local e o cluster k3d, e roda dois `helm upgrade --install`: `kinds` (o chart `nereus-reefs`) e `nereus` (a API do Nereus e o profile core, com o reef tenancy). Entre os dois, o `images` confere que o registry tem cada imagem que a release nomeia, e para com `fix: make nereids` quando falta uma, antes de mudar qualquer coisa (#2062). O `installation` lê de volta a identidade da instalação.

        **Cada passo imprime o seu tempo, e o total é medido contra o SLO** (spec 0004): 8 minutos no k3d; esta execução num cluster reusado veio depois de `nereus config slo set --local 4m` ([O SLO de tempo](../../guides/operate/slo.md)). Perder o SLO nunca para o `init`; o `--check-slo` falha passada a tolerância.

  - name: init-profile
    act: init
    topic: "init --profile"
    status: built
    message: "A profile after core, installed in the cluster by thetis"
    accent: "installed in the cluster"
    terminal:
      steps:
        - comment: "Core, then the profile internal-developer-platform"
          run: "nereus init"
          options: ["--profile internal-developer-platform", "--yes"]
          output: |-
            SETTING            VALUE                        SOURCE
            target             k3d                          default
            create_cluster     true                         ~/.config/nereus/init.yaml
            name               nereus-local                 ~/.config/nereus/init.yaml
            ingress_port       8080                         ~/.config/nereus/init.yaml
            installation_name  nereus-local                 ~/.config/nereus/init.yaml
            profile            internal-developer-platform  flag
            ✓ prerequisites             0.1s  docker 29.9.3, k3d 5.9.0, helm 4.1.4
            ✓ registry localhost:5111   0.0s  reused
            ✓ cluster nereus-local     16.8s  created
            ✓ kinds                     0.4s  release nereus-reefs revision 1
            ✓ nereus                    1.5s  release nereus revision 1, profile internal-developer-platform
            ✓ installation              0.2s  created nereus-local
            ✓ ready                    8m21s  12 Nereids ready, slowest keycloak 2m31s  slo 108% red
            ✓ public key                0.0s  rsa-4096, SHA256:EyQwfBvDGJkXxcWzg6k5YtiwqRPAHcsv4cvNcH3B0QM, version 1
              total                    8m40s  slo 8m, 108% red
            ✓ cluster ready in context k3d-nereus-local · config in ~/.config/nereus/config.yaml · values in ~/.config/nereus/values.yaml

            Next steps:

              nereus status

            ! init took 8m40s, over its time objective of 8m, within the 20% tolerance (9m36s); slowest steps: ready keycloak 2m31s, ready nereus-portal 2m15s, ready openbao 1m11s; shorten them, or raise the objective: nereus config slo set --local 9m
    dependsOn: [init]
    notes: |-
      **`init` runs no step of the profile itself** (ADR 0014, profiles): the value `profile` makes the chart `nereus` run thetis, the installer Nereid, which installs the profile's reefs, Nereids and Mandates in order. The step `ready` waits until each Nereid is Ready; `public key` prints the fingerprint of the secrets reef's key.

      **`--profile reference` installs each reef's reference Nereid** in place of the tools (#1421); no `--profile`, or `core`, installs core alone. An unknown profile is refused before anything changes. With sign-in on, log in right after: `nereus status`, `reef` and `nereid` read through the Nereus API ([nereus login](reefs/authentication.html#login)).
    pt:
      topic: "init --profile"
      message: "Um profile depois do core, instalado no cluster pelo thetis"
      accent: "instalado no cluster"
      notes: |-
        **O `init` não roda nenhum passo do profile** (ADR 0014, profiles): o value `profile` faz o chart `nereus` rodar o thetis, a Nereid instaladora, que instala os reefs, as Nereids e os Mandates do profile em ordem. O passo `ready` espera cada Nereid ficar Ready; o `public key` imprime o fingerprint da chave do reef secrets.

        **O `--profile reference` instala a Nereid de referência de cada reef** no lugar das ferramentas (#1421); sem `--profile`, ou com `core`, instala só o core. Um profile desconhecido é recusado antes de qualquer mudança. Com login ligado, entre logo depois: `nereus status`, `reef` e `nereid` leem pela API do Nereus ([nereus login](reefs/authentication.html#login)).

  - name: init-target
    act: init
    topic: "init --target"
    status: built
    message: "An undercloud on k3d, and the plan for the cloud"
    accent: "the plan for the cloud"
    terminal:
      steps:
        - comment: "The settings file names the cloud azure and the installation tailwind"
          run: "nereus init"
          options: ["--dry-run", "--yes"]
          output: |-
            ✓ undercloud tailwind-undercloud on k3d    0s
            ✓ installation tailwind, new               0s
            ✓ Reef cloud, Nereid azure    0s

            Plan for Azure · northeurope · 9 requests · not run (--dry-run)
              1  create   resource group        tailwind-platform
              2  create   storage account       issuers0b7e4c1a93d24f6e
              3  create   container             oidc
              4  access   Storage Blob Data Contributor on issuers0b7e4c1a93d24f6e to you
              5  publish  issuer documents (3)
              6  create   managed identity      tailwind-cloud-provisioner
              7  create   federated credential  tailwind-undercloud-azure
              tagged with the installation and who asked
              --show-requests for the why, URLs and tags

            Nothing ran in Azure. To run it:
            $ nereus init --yes --approve-access
    dependsOn: [init]
    notes: |-
      **`--target <name>` creates the installation's undercloud, `<installation>-undercloud`, with the `cloud` reef**; `<name>` is that reef's Nereid, here `azure`, and everything Azure is asked goes through its plans, never a call of the CLI (spec 0005). The issuer is computed from the installation's id before the cluster exists, so the cloud can trust its tokens. `--target azure --installation-name tailwind` gives the same without a settings file.

      **What changed on the machine, the plan for the cloud, the command to run next** (#379): nothing ran in Azure, but the undercloud, the installation and the `cloud` reef exist. `--show-requests` adds each request's why, method, URL and tags. The output is what `init` prints in its tests (`cli/tests/test_undercloud.py`), against fakes and recorded Azure answers ([Prepare the undercloud](../../guides/operate/undercloud.md)).
    pt:
      topic: "init --target"
      message: "Um undercloud no k3d, e o plano para a nuvem"
      accent: "o plano para a nuvem"
      notes: |-
        **O `--target <nome>` cria o undercloud da instalação, `<instalação>-undercloud`, com o reef `cloud`**; `<nome>` é a Nereid desse reef, aqui a `azure`, e tudo o que se pede à Azure passa pelos planos dela, nunca por uma chamada do CLI (spec 0005). O issuer é calculado a partir do id da instalação antes de o cluster existir, para que a nuvem possa confiar nos seus tokens. O `--target azure --installation-name tailwind` dá o mesmo sem arquivo de configurações.

        **O que mudou na máquina, o plano para a nuvem, o comando a rodar em seguida** (#379): nada rodou na Azure, mas o undercloud, a instalação e o reef `cloud` existem. O `--show-requests` acrescenta o porquê, o método, a URL e as tags de cada requisição. A saída é a que o `init` imprime nos seus testes (`cli/tests/test_undercloud.py`), contra fakes e respostas gravadas da Azure ([Preparar o undercloud](../../guides/operate/undercloud.md)).

  - name: init-approve-access
    act: init
    topic: "init --approve-access"
    status: built
    message: "The plan approved, each line with its time"
    accent: "approved"
    terminal:
      steps:
        - comment: "Approve the whole run, undercloud included"
          run: "nereus init"
          options: ["--approve-access"]
          output: |-
            ✓ undercloud tailwind-undercloud on k3d    0s
            ✓ installation tailwind, new               0s
            ✓ Reef cloud, Nereid azure    0s

            Plan for Azure · northeurope · 9 requests · approved (--approve-access)
              log: ~/.local/state/nereus/logs/20261019T221500Z-init.log
            ✓ 1  create   resource group        tailwind-platform                             0s
            ✓ 2  create   storage account       issuers0b7e4c1a93d24f6e                       0s
            ✓ 3  create   container             oidc                                          0s
            ✓ 4  access   Storage Blob Data Contributor on issuers0b7e4c1a93d24f6e to you     0s
            ✓ 5  publish  issuer documents (3)                                                0s
            ✓ 6  create   managed identity      tailwind-cloud-provisioner                    0s
            ✓ 7  create   federated credential  tailwind-undercloud-azure                     0s
              tagged with the installation and who asked
              --show-requests for the why, URLs and tags

            ✓ azure exchanged its token as tailwind-cloud-provisioner

            Next, a reef that uses the cloud:
            $ nereus reef apply secrets --from-file ./reefs/secrets/
    dependsOn: [init-target]
    notes: |-
      **Without `--approve-access`, `init` asks `Approve 9 requests? [y/N]` under the plan**, and a non-interactive run stops before the first request. Once approved, each line shows its progress, then the proof that the cloud trusts the undercloud: the `azure` Nereid exchanging its token. A request Azure refuses marks its line `✗` and says what an administrator has to run.

      **A run that sends requests writes a log** under `~/.local/state/nereus/logs/`, readable by you alone: the plan, each request's method and URL, each answer's status and time; never a token, header or body. Recorded against fakes, as the slide before.
    pt:
      topic: "init --approve-access"
      message: "O plano aprovado, cada linha com o seu tempo"
      accent: "aprovado"
      notes: |-
        **Sem o `--approve-access`, o `init` pergunta `Approve 9 requests? [y/N]` abaixo do plano**, e uma execução não interativa para antes da primeira requisição. Depois de aprovado, cada linha mostra o seu progresso, e então a prova de que a nuvem confia no undercloud: a Nereid `azure` trocando o seu token. Uma requisição que a Azure recusa marca a sua linha com `✗` e diz o que um administrador precisa rodar.

        **Uma execução que envia requisições grava um log** em `~/.local/state/nereus/logs/`, legível só por você: o plano, o método e a URL de cada requisição, o status e o tempo de cada resposta; nunca um token, um header ou um corpo. Gravado contra fakes, como o slide anterior.

  - name: status
    act: status
    topic: "status"
    status: built
    message: "One row per reef and Nereid, core first"
    accent: "core first"
    terminal:
      steps:
        - comment: "How each reef is doing, through the Nereus API"
          run: "nereus status"
          output: |-
            REEF            NEREID    VERSION  STATUS         AGE
            authentication  keycloak  0.1.0    Ready          2m
            core            built-in  0.1.0    Ready          4m
            release         flux      0.1.0    Ready          3m
            secrets         openbao   0.1.0    Ready          4m
            tenancy         -         -        Ready          4m

            Registry  localhost:5111
    notes: |-
      **`Registry` is where images are pushed**, as the cluster declares it in the ConfigMap `kube-public/local-registry-hosting` (#855). `NotConformant` is computed by the CLI (spec 0003): a reef that exposes no kind has no `Ready` Nereid, unless it has none by design; the tenancy reef needs no Nereid and reads `Ready`.

      **`--output json` (or `yaml`) is the stable contract** of the Nereus API's `GET /v1/status` and of its `/mcp` `status` tool: `{"installation", "registry", "items": [{"reef", "nereid", "version", "status", "reason", "createdAt"}]}`. With sign-in on, it needs `nereus login`.
    pt:
      topic: "status"
      message: "Uma linha por reef e Nereid, o core primeiro"
      accent: "o core primeiro"
      notes: |-
        **O `Registry` é para onde as imagens são enviadas**, como o cluster o declara no ConfigMap `kube-public/local-registry-hosting` (#855). O `NotConformant` é calculado pelo CLI (spec 0003): um reef que não expõe kind não tem Nereid `Ready`, a não ser que não tenha nenhuma por design; o reef tenancy não precisa de Nereid e aparece `Ready`.

        **O `--output json` (ou `yaml`) é o contrato estável** do `GET /v1/status` da API do Nereus e da ferramenta `status` do seu `/mcp`: `{"installation", "registry", "items": [{"reef", "nereid", "version", "status", "reason", "createdAt"}]}`. Com login ligado, ele precisa do `nereus login`.

  - name: doctor
    act: doctor
    topic: "doctor"
    status: built
    message: "One pass or fail per check, with the command that helps"
    accent: "the command that helps"
    terminal:
      steps:
        - comment: "Ten checks; one that did not run says so"
          run: "nereus doctor"
          output: |-
            CHECK       RESULT   DETAIL
            api         fail     no Nereus instance: the CLI does not know its address
            capacity    skipped  needs api
            workloads   skipped  needs api
            nereids     skipped  needs api
            store       skipped  needs api
            secrets     skipped  needs api
            issuer      skipped  needs api
            registry    skipped  needs api
            cli         pass     nereus and nrs on PATH
            completion  pass     nereus and nrs in ~/.bash_completions
            k3d         pass     no load balancer, every port on the loopback

            ✗ 1 of 11 checks failed, 7 skipped

            Next steps:

              nereus login https://<the instance's address>
    notes: |-
      **The Nereus API is the one door, and it cannot lie** (#799, ADR 0018): the cluster's checks run in the API, whose ServiceAccount only reads (`GET /v1/doctor`); the command adds only what the API cannot see, this machine's CLI, its completion and its k3d clusters, which warn on a load balancer (nginx) or a port off the loopback (#2152). Only `pass` counts as passing, and no secret's value is read. `--skip <check>` leaves one out.

      **The output is from an offline run with no instance** (a throwaway config and no kubeconfig), since no walkthrough page records it: on a running instance every check runs, and a person outside `nereus-admins` sees the rest without detail.
    pt:
      topic: "doctor"
      message: "Um pass ou fail por verificação, com o comando que ajuda"
      accent: "o comando que ajuda"
      notes: |-
        **A API do Nereus é a única porta, e ela não mente** (#799, ADR 0018): as verificações do cluster rodam na API, cuja ServiceAccount só lê (`GET /v1/doctor`); o comando acrescenta só o que a API não vê, o CLI desta máquina, o seu completion e os seus clusters k3d, que avisam quando há um load balancer (nginx) ou uma porta fora do loopback (#2152). Só `pass` conta como aprovado, e nenhum valor de secret é lido. O `--skip <check>` deixa uma de fora.

        **A saída é de uma execução offline sem instância** (uma config descartável e sem kubeconfig), já que nenhuma página do walkthrough a grava: numa instância rodando, toda verificação roda, e uma pessoa fora de `nereus-admins` vê o resto sem detalhe.

