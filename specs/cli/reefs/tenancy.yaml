deck:
  name: tenancy
  title: "The tenancy reef"
  subtitle: "Every command of the tenancy reef: whose a thing is, as a tree of Organizations and Projects"
  accent: "whose a thing is"
  pt:
    title: "O reef tenancy"
    subtitle: "Todos os comandos do reef tenancy: de quem é cada coisa, numa árvore de Organizations e Projects"
    accent: "de quem é cada coisa"

acts:
  - name: opening
    title: "Opening"
    pt: {title: "Abertura"}
  - name: setup
    title: "Setup"
    question: "Where do the tenancy kinds come from?"
    pt: {title: "Preparação", question: "De onde vêm os kinds de tenancy?"}
  - name: tree
    title: "The tree"
    question: "How does a Project find its place under an Organization?"
    pt: {title: "A árvore", question: "Como um Project encontra o seu lugar sob uma Organization?"}
  - name: owner
    title: "The owner"
    question: "How does everything else say whose it is?"
    pt: {title: "O owner", question: "Como todo o resto diz de quem é?"}

slides:
  - name: cover
    act: opening
    cover: true
    message: "The tenancy reef"
    notes: |-
      **The source of truth for the commands of the tenancy reef** (#477, #569 (the tenancy reef in the CLI reference)). Every command here is an idea: none is built yet. The reef comes from ADR 0015 (tenancy: a tenancy reef whose kinds come from each instance, with one fixed shape), and #573 builds it.

      **Nereus is born multi-tenant** (#21, Organization and nested Projects): an Organization is the boundary of people, permissions and isolation, a Project sits under an Organization or under another Project, and whatever needs to say whose a thing is points to that tree.
    pt:
      message: "O reef tenancy"
      notes: |-
        **A fonte da verdade dos comandos do reef tenancy** (#477, #569 (o reef tenancy na referência do CLI)). Todo comando aqui é uma ideia: nenhum está pronto ainda. O reef vem do ADR 0015 (tenancy: um reef tenancy cujos kinds vêm de cada instância, com uma forma fixa), e o #573 o constrói.

        **O Nereus nasce multi-tenant** (#21, Organization e Projects aninhados): uma Organization é a fronteira de pessoas, permissões e isolamento, um Project fica sob uma Organization ou sob outro Project, e tudo o que precisa dizer de quem é uma coisa aponta para essa árvore.

  - name: kinds
    act: opening
    topic: "kinds"
    message: "The kinds come from each instance, the shape is fixed"
    accent: "the shape is fixed"
    screen:
      - "**A node:** every kind of `tenancy.getnereus.dev/v1alpha1` has an optional `spec.parent: {kind, name}`; one with no parent is a root"
      - "**The boundary:** one kind carries `tenancy.getnereus.dev/boundary: \"true\"`; here, `Organization`"
    notes: |-
      **This instance applies `Organization` and `Project`; another instance may apply its own kinds** (departments and squads, say) from its own `reefs/tenancy/`, and its catalog still works, because the contract is the shape of every kind of the group, not the kind names (ADR 0015).

      **A Project is not a namespace:** it is cluster-scoped, nests, and runs in several environments at once (Triton on the kept k3d cluster and on a `pr-<n>` vcluster is one Project in two namespaces). The first version has no tenancy Nereid: the API keeps the tree, as it keeps the `core` kinds.
    pt:
      topic: "kinds"
      message: "Os kinds vêm de cada instância, a forma é fixa"
      accent: "a forma é fixa"
      screen:
        - "**Um nó:** todo kind de `tenancy.getnereus.dev/v1alpha1` tem um `spec.parent: {kind, name}` opcional; um sem parent é uma raiz"
        - "**A fronteira:** um kind leva `tenancy.getnereus.dev/boundary: \"true\"`; aqui, `Organization`"
      notes: |-
        **Esta instância aplica `Organization` e `Project`; outra instância pode aplicar os seus próprios kinds** (departamentos e squads, por exemplo) a partir do seu próprio `reefs/tenancy/`, e o seu catálogo continua funcionando, porque o contrato é a forma de todo kind do grupo, não os nomes dos kinds (ADR 0015).

        **Um Project não é um namespace:** ele é cluster-scoped, se aninha, e roda em vários ambientes ao mesmo tempo (o Triton no cluster k3d mantido e num vcluster `pr-<n>` é um Project em dois namespaces). A primeira versão não tem Nereid de tenancy: a API guarda a árvore, como guarda os kinds do `core`.

  - name: reef-apply
    act: setup
    topic: "reef apply"
    status: built
    message: "The {reef:tenancy} reef, with the kinds of this instance"
    accent: "of this instance"
    terminal:
      steps:
        - comment: "The CRDs of this instance, from its reefs/tenancy/"
          run: "nereus reef apply tenancy"
          options: ["--from-file reefs/tenancy/"]
          output: |-
            ✓ core/reefs/tenancy created (tenancy.getnereus.dev/v1alpha1: organizations, projects)

            Next steps:

              nereus tenancy organization create <organization>
    notes: |-
      **The output lists the kinds the reef created, in the plural, after its group** (owner, 2026-10-30, ADR 0015), a line every reef's `nereus reef apply` grows: here they are this instance's, read from the CRDs in `reefs/tenancy/`, so another instance would read `departments, squads`.

      **No Nereid and no Mandate follow:** the API keeps the tree itself in the first version. A tenancy Nereid comes when the tree is synced with another system (OpenFGA tuples, Keycloak groups).

      **`nereus tenancy` appears once the reef is applied** (#647): the CLI builds the group from its commands cache, which `reef apply` refreshes, so a cluster without the reef has no `tenancy` command, and every profile's `nereus init` applies it.
    pt:
      topic: "reef apply"
      message: "O reef {reef:tenancy}, com os kinds desta instância"
      accent: "desta instância"
      notes: |-
        **A saída lista os kinds que o reef criou, no plural, depois do seu grupo** (owner, 2026-10-30, ADR 0015), uma linha que o `nereus reef apply` de todo reef ganha: aqui eles são os desta instância, lidos dos CRDs em `reefs/tenancy/`, então outra instância leria `departments, squads`.

        **Nenhuma Nereid e nenhum Mandate vêm depois:** a API guarda a própria árvore na primeira versão. Uma Nereid de tenancy vem quando a árvore for sincronizada com outro sistema (tuplas do OpenFGA, grupos do Keycloak).

        **O `nereus tenancy` aparece quando o reef é aplicado** (#647): o CLI constrói o grupo a partir do seu cache de comandos, que o `reef apply` atualiza, então um cluster sem o reef não tem comando `tenancy`, e o `nereus init` de todo perfil o aplica.

  - name: status
    act: setup
    topic: "status"
    status: built
    message: "No Nereid by design: the {reef:tenancy} reef is Ready with none"
    accent: "Ready with none"
    terminal:
      steps:
        - comment: "Right after a plain init: core, and the tenancy reef every profile applies"
          run: "nereus status"
          output: |-
            REEF     NEREID      VERSION  STATUS  AGE
            core     nereus-api  0.1.0    Ready   2m
            tenancy  -           -        Ready   2m
    notes: |-
      **A reef that needs no Nereid reads `Ready`, not `Waiting`** (#651): every CRD in `reefs/tenancy/` carries the annotation `core.getnereus.dev/nereid: "none"`, so `nereus status` knows the API keeps the reef's objects, as it keeps core's (ADR 0015). A reef that waits for a Nereid it has not got yet still reads `Waiting`.

      **`nereus status --output json` says why** in the row's `reason`: "The tenancy reef needs no Nereid: the API keeps its objects." The annotation goes on every CRD of a reef or on none; a reef with some CRDs annotated and others not is refused by `nereus reef apply`.
    pt:
      topic: "status"
      message: "Nenhuma Nereid por design: o reef {reef:tenancy} fica Ready sem nenhuma"
      accent: "Ready sem nenhuma"
      notes: |-
        **Um reef que não precisa de Nereid aparece `Ready`, não `Waiting`** (#651): todo CRD em `reefs/tenancy/` leva a annotation `core.getnereus.dev/nereid: "none"`, então o `nereus status` sabe que a API guarda os objetos do reef, como guarda os do core (ADR 0015). Um reef que espera uma Nereid que ainda não tem continua `Waiting`.

        **O `nereus status --output json` diz por quê** no `reason` da linha: "The tenancy reef needs no Nereid: the API keeps its objects." A annotation vai em todo CRD de um reef ou em nenhum; um reef com alguns CRDs anotados e outros não é recusado pelo `nereus reef apply`.

  - name: organization-create
    act: tree
    topic: "organization create"
    status: built
    message: "Another boundary: an Organization, the root of its tree"
    accent: "the root of its tree"
    terminal:
      steps:
        - comment: "The kind with the boundary annotation takes no parent"
          run: "nereus tenancy organization create example"
          output: |-
            ✓ tenancy/organizations/example created

            Next steps:

              nereus tenancy organization list
    dependsOn: [reef-apply]
    notes: |-
      **`nereus init` already wrote Nereus's own tree** (#647): its step `tenancy tree` applies `tenancy/` right after the reef, so a fresh cluster starts with the Organization `getnereus` and its Projects ([apply](#apply)). `organization create` adds another one, here `example`.

      **The command is built from the reef's schema** (ADR 0013, command conventions): `nereus tenancy <kind> <verb> <name>`, kinds singular, each kind with `create`, `list`, `get` and `delete`, built from the cluster's CRDs (a flag per string field of `spec`, such as `--repository`), `apply` for the whole group, and `--dry-run` on every command that changes something: its lines end in `(dry run)`.
    pt:
      topic: "organization create"
      message: "Outra fronteira: uma Organization, a raiz da sua árvore"
      accent: "a raiz da sua árvore"
      notes: |-
        **O `nereus init` já escreveu a própria árvore do Nereus** (#647): o seu passo `tenancy tree` aplica `tenancy/` logo depois do reef, então um cluster novo começa com a Organization `getnereus` e os seus Projects ([apply](#apply)). O `organization create` adiciona outra, aqui `example`.

        **O comando é construído a partir do schema do reef** (ADR 0013, convenções de comando): `nereus tenancy <kind> <verb> <name>`, kinds no singular, cada kind com `create`, `list`, `get` e `delete`, construídos a partir dos CRDs do cluster (uma flag por campo string do `spec`, como `--repository`), `apply` para o grupo inteiro, e `--dry-run` em todo comando que muda algo: as suas linhas terminam em `(dry run)`.

  - name: project-create
    act: tree
    topic: "project create"
    status: built
    message: "A Project under the Organization, the path from the root"
    accent: "the path from the root"
    terminal:
      steps:
        - comment: "A repository, under the Organization"
          run: "nereus tenancy project create shop"
          options: ["--parent organization/example", "--repository https://github.com/example/shop"]
          output: |-
            ✓ tenancy/organizations/example/projects/shop created

            Next steps:

              nereus tenancy project list
    dependsOn: [organization-create]
    notes: |-
      **The output line names the Project by its full path, parents before children** (ADR 0013), as Azure's resource ids do: the CLI climbs `spec.parent` to the root to write it.

      **`--parent <kind>/<name>` takes a kind of the group, in the singular**, and the CLI refuses a parent that does not exist; `--repository` is a field of this instance's `Project`.
    pt:
      topic: "project create"
      message: "Um Project sob a Organization, o caminho desde a raiz"
      accent: "o caminho desde a raiz"
      notes: |-
        **A linha de saída nomeia o Project pelo seu caminho completo, pais antes dos filhos** (ADR 0013), como os resource ids do Azure fazem: o CLI sobe o `spec.parent` até a raiz para escrevê-la.

        **`--parent <kind>/<name>` recebe um kind do grupo, no singular**, e o CLI recusa um parent que não existe; `--repository` é um campo do `Project` desta instância.

  - name: project-nested
    act: tree
    topic: "project create"
    status: built
    message: "A Project under another Project"
    accent: "another Project"
    terminal:
      steps:
        - comment: "A part of the shop, inside it"
          run: "nereus tenancy project create checkout"
          options: ["--parent project/shop"]
          output: |-
            ✓ tenancy/organizations/example/projects/shop/projects/checkout created

            Next steps:

              nereus tenancy project list
        - comment: "A parent that does not exist changes nothing"
          run: "nereus tenancy project create orphan"
          options: ["--parent project/missing"]
          output: |-
            ✗ tenancy/projects/orphan: parent project/missing does not exist. To fix it, run:
              nereus tenancy project list
              Nothing was changed.
    dependsOn: [project-create]
    notes: |-
      **Nested Projects take the place of Backstage's Domain and subdomain**, and a leaf Project plays the part of its System, so there is no `System` kind (owner, 2026-10-29, #21).

      **The CLI checks that the parent exists** (#647), since the API cannot: the admission policy refuses a node that is its own parent and a parent of a kind outside the reef (#646), and a climb stops after 32 levels, so a loop never hangs it.
    pt:
      topic: "project create"
      message: "Um Project sob outro Project"
      accent: "outro Project"
      notes: |-
        **Projects aninhados tomam o lugar do Domain e do subdomain do Backstage**, e um Project folha faz o papel do seu System, então não há kind `System` (owner, 2026-10-29, #21).

        **O CLI confere que o parent existe** (#647), já que a API não consegue: a admission policy recusa um nó que é o próprio parent e um parent de um kind fora do reef (#646), e uma subida para depois de 32 níveis, então um ciclo nunca a trava.

  - name: project-list
    act: tree
    topic: "project list"
    status: built
    message: "Each Project with its parent, the path only in get"
    accent: "the path only in get"
    terminal:
      steps:
        - comment: "One row per Project, in the tree's order"
          run: "nereus tenancy project list"
          output: |-
            ORGANIZATION  PROJECT         REPOSITORY
            example       shop            https://github.com/example/shop
            example       shop/checkout   -
            getnereus     nereus          https://github.com/getnereus/nereus
            getnereus     nereus/core     -
            getnereus     nereus/docs     -
            getnereus     nereus/nereids  -
            getnereus     nereus/triton   -
    dependsOn: [project-nested]
    notes: |-
      **The columns are the Project, its parent as `Kind/name` and the kind's string fields** (#569's recommendation), here its repository: a full path would make the table as wide as the tree is deep. The rows go in the tree's order, parents before children and siblings by name.
    pt:
      topic: "project list"
      message: "Cada Project com o seu parent, o caminho só no get"
      accent: "o caminho só no get"
      notes: |-
        **As colunas são o Project, o seu parent como `Kind/name` e os campos string do kind** (a recomendação do #569), aqui o seu repositório: um caminho completo deixaria a tabela tão larga quanto a árvore é funda. As linhas vêm na ordem da árvore, pais antes dos filhos e irmãos por nome.

  - name: project-get
    act: tree
    topic: "project get"
    status: built
    message: "One Project in full: its path and its boundary"
    accent: "its boundary"
    terminal:
      steps:
        - comment: "The path climbs spec.parent to the root"
          run: "nereus tenancy project get checkout"
          output: |-
            Name:        checkout
            Kind:        Project
            Path:        tenancy/organizations/example/projects/shop/projects/checkout
            Parent:      project/shop
            Boundary:    organization/example
            Repository:  -
    dependsOn: [project-nested]
    notes: |-
      **The boundary is the first node up the tree, the node itself included, whose kind carries the boundary annotation**, found without knowing the kind names, as `catalog check` finds it (ADR 0015).
    pt:
      topic: "project get"
      message: "Um Project por inteiro: o seu caminho e a sua fronteira"
      accent: "a sua fronteira"
      notes: |-
        **A fronteira é o primeiro nó subindo a árvore, o próprio nó incluído, cujo kind leva a annotation de fronteira**, encontrado sem conhecer os nomes dos kinds, como o `catalog check` o encontra (ADR 0015).

  - name: apply
    act: tree
    topic: "apply"
    status: built
    message: "Nereus's own tree, from files, parents before children"
    accent: "Nereus's own tree"
    terminal:
      steps:
        - comment: "The Organization and the Projects of this repository, in tenancy/: init wrote them"
          run: "nereus tenancy apply"
          options: ["--from-file tenancy/"]
          output: |-
            tenancy/organizations/getnereus unchanged
            tenancy/organizations/getnereus/projects/nereus unchanged
            tenancy/organizations/getnereus/projects/nereus/projects/core unchanged
            tenancy/organizations/getnereus/projects/nereus/projects/docs unchanged
            tenancy/organizations/getnereus/projects/nereus/projects/nereids unchanged
            tenancy/organizations/getnereus/projects/nereus/projects/triton unchanged

            Next steps:

              nereus tenancy --help
    dependsOn: [reef-apply]
    notes: |-
      **`apply` takes files or folders of `.yaml`, of any kind of the group, and applies parents before children** whatever the order of the files (ADR 0013), refusing a missing parent or a loop before it writes anything. `apply` belongs to the group, not to a kind (no `project apply`): the files name their kinds, and each line ends in `created`, `configured` or `unchanged`.

      **The first entries are Nereus itself** (ADR 0015, dogfooding): the Organization `getnereus`, the Project `nereus`, and `core`, `nereids`, `triton` and `docs` under it. `nereus init` applies them in its step `tenancy tree` (`6 created`), so the same files again read `unchanged`.
    pt:
      topic: "apply"
      message: "A própria árvore do Nereus, de arquivos, pais antes dos filhos"
      accent: "A própria árvore do Nereus"
      notes: |-
        **O `apply` recebe arquivos ou pastas de `.yaml`, de qualquer kind do grupo, e aplica os pais antes dos filhos** seja qual for a ordem dos arquivos (ADR 0013), recusando um parent que falta ou um ciclo antes de escrever qualquer coisa. O `apply` é do grupo, não de um kind (não há `project apply`): os arquivos nomeiam os seus kinds, e cada linha termina em `created`, `configured` ou `unchanged`.

        **As primeiras entradas são o próprio Nereus** (ADR 0015, dogfooding): a Organization `getnereus`, o Project `nereus`, e `core`, `nereids`, `triton` e `docs` sob ele. O `nereus init` as aplica no seu passo `tenancy tree` (`6 created`), então os mesmos arquivos de novo leem `unchanged`.

  - name: delete
    act: tree
    topic: "delete"
    status: built
    message: "A node with children waits for them"
    accent: "waits for them"
    terminal:
      steps:
        - comment: "A Project with a child is refused"
          run: "nereus tenancy project delete shop"
          output: |-
            ✗ tenancy/organizations/example/projects/shop has 1 child (checkout): delete it first, or it with it:
              nereus tenancy project delete shop --cascade --dry-run
              Nothing was changed.
    dependsOn: [project-nested]
    notes: |-
      **A node with children is refused** (#647): deleting it alone would leave its children pointing at nothing. The message says what holds it and what to do (ADR 0012, error messages). A node never moves: `spec.parent` cannot change once set (#646), so there is no "move them first". A leaf is deleted with one `✓ ... deleted` line.

      **A node named as `owner` by something will be refused too** (#934, a tenancy node that a catalog entry names as owner cannot be deleted): deleting it would leave the catalog and the environments pointing at nothing.
    pt:
      topic: "delete"
      message: "Um nó com filhos espera por eles"
      accent: "espera por eles"
      notes: |-
        **Um nó com filhos é recusado** (#647): apagá-lo sozinho deixaria os seus filhos apontando para nada. A mensagem diz o que o segura e o que fazer (ADR 0012, mensagens de erro). Um nó nunca se move: o `spec.parent` não muda depois de definido (#646), então não há "mova-os antes". Uma folha é apagada com uma linha `✓ ... deleted`.

        **Um nó nomeado como `owner` por alguma coisa também será recusado** (#934, um nó da tenancy que uma entrada do catálogo nomeia como owner não pode ser apagado): apagá-lo deixaria o catálogo e os ambientes apontando para nada.

  - name: delete-cascade
    act: tree
    topic: "delete --cascade"
    status: built
    message: "A node and everything under it, deepest first"
    accent: "deepest first"
    terminal:
      steps:
        - comment: "First what it would delete"
          run: "nereus tenancy project delete shop"
          options: ["--cascade", "--dry-run"]
          output: |-
            tenancy/organizations/example/projects/shop/projects/checkout deleted (dry run)
            tenancy/organizations/example/projects/shop deleted (dry run)
        - comment: "Then for real"
          run: "nereus tenancy project delete shop"
          options: ["--cascade"]
          output: |-
            ✓ tenancy/organizations/example/projects/shop/projects/checkout deleted
            ✓ tenancy/organizations/example/projects/shop deleted

            Next steps:

              nereus tenancy project list
    dependsOn: [delete]
    notes: |-
      **`--cascade` deletes everything under the node, deepest first, then the node**, one line each (#647); with `--dry-run` it changes nothing and says what it would delete, so the refusal's next step is safe to run.
    pt:
      topic: "delete --cascade"
      message: "Um nó e tudo o que está sob ele, do mais fundo primeiro"
      accent: "do mais fundo primeiro"
      notes: |-
        **`--cascade` apaga tudo o que está sob o nó, do mais fundo primeiro, depois o nó**, uma linha cada (#647); com `--dry-run` ele não muda nada e diz o que apagaria, então o próximo passo da recusa é seguro de rodar.

  - name: owner-field
    act: owner
    topic: "owner"
    message: "Whatever points to the tree names its owner by kind and name"
    accent: "by kind and name"
    screen:
      - "**The field:** `owner: {kind, name}`, a kind of the tenancy group, never an apiVersion and never a namespace"
      - "**Who names it:** the catalog's Workloads and Packages, an Environment, a resource Instance, a Mandate's `match`"
    notes: |-
      **One reference for every reef** (ADR 0015): it replaces the `spec.project` of the first proposal, and a new reef that needs to say whose a thing is reuses it without learning a kind name. On the command line it is `--organization <name>` or `--project <name>` (the ORGANIZATION and PROJECT columns of every list; `--owner <kind>/<name>` still works, hidden), as `nereus environment create a --project nereus` already takes ([the environment reef](environment.html#create)).
    pt:
      topic: "owner"
      message: "Tudo o que aponta para a árvore nomeia o seu owner por kind e nome"
      accent: "por kind e nome"
      screen:
        - "**O campo:** `owner: {kind, name}`, um kind do grupo tenancy, nunca uma apiVersion e nunca um namespace"
        - "**Quem o nomeia:** os Workloads e Packages do catálogo, um Environment, uma Instance de recurso, o `match` de um Mandate"
      notes: |-
        **Uma referência para todo reef** (ADR 0015): ela substitui o `spec.project` da primeira proposta, e um reef novo que precisa dizer de quem é uma coisa a reusa sem aprender um nome de kind. Na linha de comando ela é `--organization <name>` ou `--project <name>` (as colunas ORGANIZATION e PROJECT de toda lista; `--owner <kind>/<name>` ainda funciona, oculto), como o `nereus environment create a --project nereus` já aceita ([o reef environment](environment.html#create)).

  - name: config-owner
    act: owner
    topic: "config set owner"
    status: built
    issue: 902
    message: "The current owner in the CLI's config, so --owner is optional"
    accent: "--owner is optional"
    terminal:
      steps:
        - comment: "The node the next commands are for"
          run: "nereus config set owner project/triton"
          output: |-
            ✓ config: owner = project/triton
        - comment: "No --owner: the output names the one used"
          run: "nereus catalog workload create api"
          options: ["--type service", "--audience programs"]
          output: |-
            ✓ catalog/workloads/api created (owner: project/triton, type: service)
    dependsOn: [project-nested]
    notes: |-
      **The flag wins over the config, and the output line names the owner used** (owner's ask, 2026-10-30, ADR 0016), as `kubectl config set-context --current --namespace` and `gcloud config set project` do.

      **It came with #902 (the catalog reef's kinds and commands), where `--owner` is first needed**, and is a core command: its reference is [`nereus config set`](../core.html#config-set) in the core deck (#482), next to the rest of `nereus config`; it is shown here for the tenancy it uses, and the catalog reef's deck (#570) links to this slide.
    pt:
      topic: "config set owner"
      message: "O owner atual na config do CLI, para o --owner ser opcional"
      accent: "--owner ser opcional"
      notes: |-
        **A flag ganha da config, e a linha de saída nomeia o owner usado** (pedido do owner, 2026-10-30, ADR 0016), como o `kubectl config set-context --current --namespace` e o `gcloud config set project` fazem.

        **Ele chegou com o #902 (os kinds e os comandos do reef catalog), onde o `--owner` é preciso pela primeira vez**, e é um comando do core: a sua referência é o [`nereus config set`](../core.html#config-set) no deck do core (#482), ao lado do resto do `nereus config`; ele aparece aqui pela tenancy que usa, e o deck do reef catalog (#570) aponta para este slide.
