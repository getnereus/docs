deck:
  name: authorization
  title: "The authorization reef"
  subtitle: "Every command of the first slice: Users, teams, roles and bindings, and who may do what"
  accent: "who may do what"
  pt:
    title: "O reef authorization"
    subtitle: "Todos os comandos da primeira fatia: Users, times, papéis e bindings, e quem pode fazer o quê"
    accent: "quem pode fazer o quê"

acts:
  - name: opening
    title: "Opening"
    pt: {title: "Abertura"}
  - name: setup
    title: "Setup"
    question: "Where does the answer come from?"
    pt: {title: "Preparação", question: "De onde vem a resposta?"}
  - name: people
    title: "People"
    question: "Who is on the platform, and with whom?"
    pt: {title: "Pessoas", question: "Quem está na plataforma, e com quem?"}
  - name: roles
    title: "Roles"
    question: "What can a role do?"
    pt: {title: "Papéis", question: "O que um papel pode fazer?"}
  - name: bindings
    title: "Bindings"
    question: "Who receives a role, and where?"
    pt: {title: "Bindings", question: "Quem recebe um papel, e onde?"}
  - name: asking
    title: "Asking"
    question: "May I?"
    pt: {title: "Perguntando", question: "Eu posso?"}
  - name: enforcement
    title: "Enforcement"
    question: "What happens when the answer is no?"
    pt: {title: "Na prática", question: "O que acontece quando a resposta é não?"}
  - name: gates
    title: "Gates"
    question: "May I ask?"
    pt: {title: "Gates", question: "Posso pedir?"}
  - name: closing
    title: "Closing"
    pt: {title: "Fechamento"}

references:
  - name: openfga
    title: "OpenFGA"
    author: "The OpenFGA Authors, a CNCF project"
    url: "https://openfga.dev/"
    about: "An open source authorization engine based on relationships, inspired by Google's Zanzibar: a model of types and relations, tuples that say who relates to what, and a check that answers yes or no."
    forUs: "The Nereid of this reef: it keeps the tuples the roles, bindings and teams turn into, and answers every check the Nereus API asks."
    pt:
      title: "OpenFGA"
      author: "Os autores do OpenFGA, um projeto da CNCF"
      about: "Um motor de autorização de código aberto baseado em relações, inspirado no Zanzibar do Google: um modelo de tipos e relações, tuplas que dizem quem se relaciona com o quê, e uma verificação que responde sim ou não."
      forUs: "A Nereid deste reef: guarda as tuplas em que os papéis, bindings e times se transformam, e responde a toda verificação que a Nereus API pergunta."
  - name: kubernetes-rbac
    title: "Using RBAC Authorization"
    author: "The Kubernetes Authors"
    url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"
    about: "Kubernetes' role-based access control: a Role lists rules (API groups, resources, verbs) and a RoleBinding grants it to subjects."
    forUs: "The shape of a role's rule here, in the CLI's own words: reef, kinds, verbs."
    pt:
      title: "Usando a autorização RBAC"
      author: "Os autores do Kubernetes"
      about: "O controle de acesso baseado em papéis do Kubernetes: um Role lista regras (grupos de API, recursos, verbos) e um RoleBinding o concede a sujeitos."
      forUs: "A forma da regra de um papel aqui, nas palavras do próprio CLI: reef, kinds, verbos."
  - name: thinking-in-platforms
    title: "Thinking in Platforms"
    author: "Kaspar von Grünberg and Luca Galante"
    year: "2026"
    url: "https://internaldeveloperplatform.org/community/books/"
    about: "Platform engineering as the operating model for work in the AI era."
    forUs: "The order of the checks: identity, team membership and resource quotas are resolved before any path is invoked."
    pt:
      title: "Thinking in Platforms"
      author: "Kaspar von Grünberg e Luca Galante"
      about: "Engenharia de plataforma como o modelo operacional do trabalho na era da IA."
      forUs: "A ordem das verificações: identidade, participação em times e cotas de recursos são resolvidas antes de qualquer caminho ser invocado."

slides:
  - name: cover
    act: opening
    cover: true
    message: "The authorization reef"
    notes: |-
      **The commands of the first slice of authorization, built** (#897, Refine the authorization reef; journey #1644). The deck was the contract the slice was built from, and its outputs are what the final scene printed; only `member delete` with a `Position` stays planned (#1307).

      **The story crosses three homes.** A User belongs to core (ADR 0006, the person is a User of core), a team and its members to the `teams` reef (#1307, The teams reef), a role and a binding to this reef. The team commands live in the teams deck (docs/specs/cli/reefs/teams.html), built with #1646 (the teams reef); the User commands move to the core deck when they are built, and are here so the story reads in one place.

      **The model was decided in #1306** (How teams, roles and Users relate), on the tenancy tree of ADR 0015 (tenancy: Organization and Project), with the commands of ADR 0013 (command conventions).
    pt:
      message: "O reef authorization"
      notes: |-
        **Os comandos da primeira fatia de autorização, prontos** (#897, Refine the authorization reef; jornada #1644). O deck foi o contrato a partir do qual a fatia foi construída, e as suas saídas são o que a cena final imprimiu; só o `member delete` com uma `Position` continua planejado (#1307).

        **A história atravessa três casas.** Um User pertence ao core (ADR 0006, a pessoa é um User do core), um time e os seus membros ao reef `teams` (#1307, The teams reef), um papel e um binding a este reef. Os comandos de time ficam no deck teams (docs/specs/cli/reefs/teams.html), construído com a #1646 (o reef teams); os comandos de User vão para o deck do core quando forem construídos, e estão aqui para a história ser lida em um só lugar.

        **O modelo foi decidido na #1306** (How teams, roles and Users relate), sobre a árvore de tenancy do ADR 0015 (tenancy: Organization e Project), com os comandos do ADR 0013 (convenções de comando).

  - name: concepts
    act: opening
    topic: "concepts"
    message: "Three concepts, one list of members"
    accent: "one list of members"
    screen:
      - "**User:** the person, one in core, whatever the login"
      - "**Team:** who works together, each member with an optional position"
      - "**Role and binding:** what a team, a position or a User may do on a node of the tenancy tree"
      - "**Access comes from the team:** joining grants it, leaving removes it"
    notes: |-
      **Three concepts kept apart** (#1306, How teams, roles and Users relate): a User answers who the person is, a team answers who they work with and in which position, a role answers what they may do.

      **There is no second list of groups to keep in sync.** A binding gives a role to a team, to one position of a team or, as an exception, to a single User. An identity provider's groups are an output, never the source.

      **A position is a name on the member in this slice** (`tech-lead`, `architect`). The `Position` kind with its skills and places comes with #1307 (The teams reef), and the same name then points to it.
    pt:
      topic: "conceitos"
      message: "Três conceitos, uma só lista de membros"
      accent: "uma só lista de membros"
      screen:
        - "**User:** a pessoa, uma só no core, qualquer que seja o login"
        - "**Time:** quem trabalha junto, cada membro com uma posição opcional"
        - "**Papel e binding:** o que um time, uma posição ou um User pode fazer em um nó da árvore de tenancy"
        - "**O acesso vem do time:** entrar concede, sair remove"
      notes: |-
        **Três conceitos mantidos separados** (#1306, How teams, roles and Users relate): um User responde quem é a pessoa, um time responde com quem ela trabalha e em qual posição, um papel responde o que ela pode fazer.

        **Não existe uma segunda lista de grupos para manter em sincronia.** Um binding dá um papel a um time, a uma posição de um time ou, como exceção, a um único User. Os grupos de um provedor de identidade são uma saída, nunca a fonte.

        **Uma posição é um nome no membro nesta fatia** (`tech-lead`, `architect`). O kind `Position`, com as suas skills e vagas, vem com a #1307 (The teams reef), e o mesmo nome passa a apontar para ele.

  - name: order
    act: opening
    topic: "the order"
    message: "Who, may they, is there room: in this order"
    accent: "in this order"
    screen:
      - "**Who:** {reef:authentication} turns the token into a User"
      - "**May they:** {reef:authorization} answers for a verb, a kind and a node"
      - "**Is there room:** quota, a later slice"
    refs: [thinking-in-platforms]
    notes: |-
      **The Nereus API resolves the three before any Nereid acts**, deterministically and in this order. The idea comes from the book _Thinking in Platforms_: identity, team membership and resource quotas are resolved before any path is invoked.

      **The subject of every check is the User's id**, never a `sub` of an identity provider (ADR 0006, the person is a User of core). A token whose identity is linked to no User has no permission: having a login is not having permission.

      **Quota is out of this slice.** Teams sit on a node of the tenancy tree, so a quota has where to attach later.
    pt:
      topic: "a ordem"
      message: "Quem, pode, e há espaço: nesta ordem"
      accent: "nesta ordem"
      screen:
        - "**Quem:** {reef:authentication} transforma o token em um User"
        - "**Pode:** {reef:authorization} responde para um verbo, um kind e um nó"
        - "**Há espaço:** cota, uma fatia posterior"
      notes: |-
        **A Nereus API resolve os três antes de qualquer Nereid agir**, de forma determinística e nesta ordem. A ideia vem do livro _Thinking in Platforms_: identidade, participação em times e cotas de recursos são resolvidas antes de qualquer caminho ser invocado.

        **O sujeito de toda verificação é o id do User**, nunca um `sub` de um provedor de identidade (ADR 0006, a pessoa é um User do core). Um token cuja identidade não está ligada a nenhum User não tem permissão: ter login não é ter permissão.

        **Cota está fora desta fatia.** Os times ficam em um nó da árvore de tenancy, então uma cota tem onde se prender depois.

  - name: reef-apply
    act: setup
    topic: "reef apply"
    status: built
    issue: 897
    message: "The {reef:authorization} reef brings roles and bindings"
    accent: "roles and bindings"
    terminal:
      steps:
        - comment: "The kinds of the reef"
          run: "nereus reef apply authorization"
          output: |-
            ✓ core/reefs/authorization created (authorization.getnereus.dev/v1alpha1: bindings, roles)

            Next steps:

              nereus nereid apply openfga --reef authorization
    notes: |-
      **Two kinds, `Role` and `Binding`, and neither names OpenFGA** (#1306, How teams, roles and Users relate): the API never names a Nereid, so another tool can answer the same question later.

      **Until a Nereid answers for this reef, nothing changes:** every write stays with the `nereus-admins` group, as today. Permissions start when authorization is installed.
    pt:
      topic: "reef apply"
      message: "O reef {reef:authorization} traz papéis e bindings"
      accent: "papéis e bindings"
      notes: |-
        **Dois kinds, `Role` e `Binding`, e nenhum cita o OpenFGA** (#1306, How teams, roles and Users relate): a API nunca cita uma Nereid, então outra ferramenta pode responder à mesma pergunta depois.

        **Até uma Nereid responder por este reef, nada muda:** toda escrita continua com o grupo `nereus-admins`, como hoje. As permissões começam quando a autorização é instalada.

  - name: nereid-apply
    act: setup
    topic: "nereid apply"
    status: built
    issue: 897
    message: "{nereid:openfga} answers who may do what"
    accent: "who may do what"
    terminal:
      steps:
        - comment: "The profile installs the Nereid and its default Mandate (an excerpt)"
          run: "nereus profile apply internal-developer-platform"
          output: |-
            ✓ networkpolicy openfga                      0.0s  networkpolicies/openfga applied (only nereus-api and vmagent-nereus reach openfga)
            ✓ nereid openfga                            1m19s  core/nereids/openfga created, Ready
            ✓ mandate openfga                            7.0s  core/mandates/openfga created (reef: authorization, nereid: openfga, default)
    dependsOn: [reef-apply]
    refs: [openfga]
    notes: |-
      **The Nereid installs OpenFGA from its official Helm chart**, through the release reef, with its data in a Postgres database asked through the `Database` kind: the same path the keycloak Nereid takes.

      **The objects of Nereus are the source of truth.** Users, teams, members, roles and bindings are written as tuples by the Nereid, which reconciles them; losing OpenFGA's data loses nothing, the Nereid writes it again.

      **The model is one fixed `.fga` file**, versioned with the Nereid and tested with OpenFGA's own model tests. A new role becomes tuples, never a new model.
    pt:
      topic: "nereid apply"
      message: "{nereid:openfga} responde quem pode fazer o quê"
      accent: "quem pode fazer o quê"
      notes: |-
        **A Nereid instala o OpenFGA a partir do seu chart Helm oficial**, pelo reef release, com os dados em um banco Postgres pedido pelo kind `Database`: o mesmo caminho que a Nereid keycloak segue.

        **Os objetos do Nereus são a fonte da verdade.** Users, times, membros, papéis e bindings são escritos como tuplas pela Nereid, que os reconcilia; perder os dados do OpenFGA não perde nada, a Nereid os escreve de novo.

        **O modelo é um arquivo `.fga` fixo**, versionado com a Nereid e testado com os testes de modelo do próprio OpenFGA. Um papel novo vira tuplas, nunca um modelo novo.

  - name: user-create
    act: people
    topic: "user create"
    status: built
    issue: 897
    message: "A person is one User, whatever the login"
    accent: "one User"
    terminal:
      steps:
        - comment: "The tech lead"
          run: "nereus user create ana"
          options: ["--email ana@example.com"]
          output: |-
            ✓ core/users/ana created
        - comment: "A developer"
          run: "nereus user create bruno"
          options: ["--email bruno@example.com"]
          output: |-
            ✓ core/users/bruno created

            Next steps:

              nereus teams create <team> --project <project>
    notes: |-
      **`User` is a kind of core** (ADR 0006, the person is a User of core): the platform gives it its id, and it holds a list of identities, one per identity provider the person signs in with. This command moves to the core deck when it is built.

      **The first sign-in links the identity:** the token's verified e-mail matches the User's, and its issuer and `sub` join the User's identities. Linking a second identity to the same User asks for an e-mail code (ADR 0006) and is out of this slice; the list is already there for it.

      **A User alone may do nothing:** no team, no role.
    pt:
      topic: "user create"
      message: "Uma pessoa é um só User, qualquer que seja o login"
      accent: "um só User"
      notes: |-
        **`User` é um kind do core** (ADR 0006, a pessoa é um User do core): a plataforma dá o seu id, e ele guarda uma lista de identidades, uma por provedor de identidade com que a pessoa entra. Este comando vai para o deck do core quando for construído.

        **O primeiro login liga a identidade:** o e-mail verificado do token casa com o do User, e o seu issuer e `sub` entram nas identidades do User. Ligar uma segunda identidade ao mesmo User pede um código por e-mail (ADR 0006) e está fora desta fatia; a lista já existe para isso.

        **Um User sozinho não pode nada:** nenhum time, nenhum papel.

  - name: user-list
    act: people
    topic: "user list"
    status: built
    issue: 897
    message: "Every User, and how many identities each has"
    accent: "how many identities"
    terminal:
      steps:
        - comment: "The people of this instance"
          run: "nereus user list"
          output: |-
            NAME   EMAIL              IDENTITIES  AGE
            ana    ana@example.com    1           2m
            bruno  bruno@example.com  0           1m
    dependsOn: [user-create]
    notes: |-
      **`IDENTITIES` counts the logins linked to the User.** Ana has signed in once; Bruno has not yet, so his User waits for its first identity.

      **Lists are alphabetical** and take `--sort-by` and `--output` (ADR 0013, command conventions).
    pt:
      topic: "user list"
      message: "Todo User, e quantas identidades cada um tem"
      accent: "quantas identidades"
      notes: |-
        **`IDENTITIES` conta os logins ligados ao User.** A Ana já entrou uma vez; o Bruno ainda não, então o User dele espera a primeira identidade.

        **As listas são alfabéticas** e aceitam `--sort-by` e `--output` (ADR 0013, convenções de comando).

  - name: role-list
    act: roles
    topic: "role list"
    status: built
    issue: 897
    message: "One built-in role, four examples to edit"
    accent: "four examples"
    terminal:
      steps:
        - comment: "The roles of this instance"
          run: "nereus authorization role list"
          output: |-
            NAME           RULES                    BUILT IN
            administrator  *:*:*                    yes
            developer      *:*:list,get and 3 more  -
            requester      *:*:list,get and 1 more  -
            team-lead      *:*:list,get and 5 more  -
            viewer         *:*:list,get             -
    dependsOn: [nereid-apply]
    notes: |-
      **`administrator` is the only built-in role**, applied with the reef (`nereus reef apply authorization`), with every verb on every kind of every reef, present and future (#1306, How teams, roles and Users relate).

      **`viewer`, `developer`, `requester` and `team-lead` are examples in `reefs/authorization/samples/`,** applied with `nereus authorization role apply --path`, each a YAML file to edit or to copy: a viewer reads everything, a developer also writes builds, deliveries and releases, a team lead also creates environments and manages the team's members. A requester reads everything and only asks for environments (`request`), which a Gate holds.
    pt:
      topic: "role list"
      message: "Um papel embutido, quatro exemplos para editar"
      accent: "quatro exemplos"
      notes: |-
        **`administrator` é o único papel embutido**, aplicado com o reef (`nereus reef apply authorization`), com todo verbo em todo kind de todo reef, presente e futuro (#1306, How teams, roles and Users relate).

        **`viewer`, `developer`, `requester` e `team-lead` são exemplos em `reefs/authorization/samples/`,** aplicados com `nereus authorization role apply --path`, cada um um arquivo YAML para editar ou copiar: um viewer lê tudo, um developer também escreve builds, deliveries e releases, um team lead também cria ambientes e gerencia os membros do time, um requester lê tudo e só pede ambientes (`request`), que um Gate segura.

  - name: role-get
    act: roles
    topic: "role get"
    status: built
    issue: 897
    message: "A role is a list of rules: reef, kinds, verbs"
    accent: "reef, kinds, verbs"
    terminal:
      steps:
        - comment: "What a team lead may do"
          run: "nereus authorization role get team-lead"
          output: |-
            team-lead: 6 rules
            REEF         KINDS         VERBS
            *            *             list,get
            build        builds        create,apply,delete
            delivery     deliveries    create,apply,delete
            environment  environments  create,delete
            release      releases      create,apply,delete
            teams        members       create,delete
    dependsOn: [role-list]
    refs: [kubernetes-rbac]
    notes: |-
      **A rule reads `<reef>:<kinds>:<verbs>`**, in the words the CLI already uses (ADR 0013, command conventions), as a Kubernetes Role lists API groups, resources and verbs. A `*` covers every reef, kind or verb, including the ones installed later.

      **The last two rules are what sets the team lead apart from a developer:** creating and deleting environments, and managing the members of the team.
    pt:
      topic: "role get"
      message: "Um papel é uma lista de regras: reef, kinds, verbos"
      accent: "reef, kinds, verbos"
      notes: |-
        **Uma regra se lê `<reef>:<kinds>:<verbos>`**, nas palavras que o CLI já usa (ADR 0013, convenções de comando), como um Role do Kubernetes lista grupos de API, recursos e verbos. Um `*` cobre todo reef, kind ou verbo, inclusive os instalados depois.

        **As duas regras que separam o team lead de um developer:** criar e apagar ambientes, e gerenciar os membros do time.

  - name: role-create
    act: roles
    topic: "role create"
    status: built
    issue: 897
    message: "A new role takes the words the CLI already uses"
    accent: "the words the CLI already uses"
    terminal:
      steps:
        - comment: "A role of this instance's own"
          run: "nereus authorization role create release-manager"
          options: ["--rule release:releases:create,apply,delete"]
          output: |-
            ✓ authorization/roles/release-manager created

            Next steps:

              nereus authorization binding create <name> --role release-manager --team <team> --project <project>
    dependsOn: [role-get]
    notes: |-
      **Roles are registered, never a fixed list** (#1306, How teams, roles and Users relate). `--rule` repeats, one rule each; `apply --from-file` takes the same role as YAML.

      **Who may create a role or a binding is itself a rule,** on `authorization:roles,bindings`.
    pt:
      topic: "role create"
      message: "Um papel novo usa as palavras que o CLI já usa"
      accent: "as palavras que o CLI já usa"
      notes: |-
        **Papéis são registrados, nunca uma lista fixa** (#1306, How teams, roles and Users relate). `--rule` se repete, uma regra por vez; `apply --from-file` recebe o mesmo papel em YAML.

        **Quem pode criar um papel ou um binding é em si uma regra,** sobre `authorization:roles,bindings`.

  - name: role-delete
    act: roles
    topic: "role delete"
    status: built
    issue: 897
    message: "The administrator role cannot be deleted"
    accent: "cannot be deleted"
    terminal:
      steps:
        - comment: "No one locks the instance out"
          run: "nereus authorization role delete administrator"
          output: |-
            ✗ authorization/roles/administrator is built in: it cannot be changed or deleted. To see who holds it, run:
              nereus authorization binding list --role administrator
              Nothing was changed.
    dependsOn: [role-list]
    notes: |-
      **A built-in role is neither narrowed nor deleted,** so no one locks the instance out (#1306, How teams, roles and Users relate). The message says what happened and what to run next (ADR 0012, error messages).

      **A role that a binding uses is refused too,** until its bindings are deleted.
    pt:
      topic: "role delete"
      message: "O papel administrator não pode ser apagado"
      accent: "não pode ser apagado"
      notes: |-
        **Um papel embutido não é restringido nem apagado,** então ninguém tranca a instância por fora (#1306, How teams, roles and Users relate). A mensagem diz o que aconteceu e o que rodar em seguida (ADR 0012, mensagens de erro).

        **Um papel que um binding usa também é recusado,** até os seus bindings serem apagados.

  - name: binding-team
    act: bindings
    topic: "binding create"
    status: built
    issue: 897
    message: "A binding gives a role to a team on a node"
    accent: "to a team on a node"
    terminal:
      steps:
        - comment: "Everyone in the team is a developer of the Project"
          run: "nereus authorization binding create payments-developers"
          options: ["--role developer", "--team payments", "--project payments"]
          output: |-
            ✓ authorization/bindings/payments-developers created

            Next steps:

              nereus authorization binding list --project payments
    dependsOn: [role-list]
    notes: |-
      **Three parts: a role, a subject and a node.** The subject is a team, a position of a team, or one User (`--user`, the exception). The node is an Organization or a Project of the tenancy tree, and the permission flows down the tree, never up (ADR 0015, tenancy: Organization and Project).

      **Without `--owner`, the binding holds for the whole instance.**
    pt:
      topic: "binding create"
      message: "Um binding dá um papel a um time em um nó"
      accent: "a um time em um nó"
      notes: |-
        **Três partes: um papel, um sujeito e um nó.** O sujeito é um time, uma posição de um time, ou um User (`--user`, a exceção). O nó é uma Organization ou um Project da árvore de tenancy, e a permissão desce a árvore, nunca sobe (ADR 0015, tenancy: Organization e Project).

        **Sem `--owner`, o binding vale para a instância inteira.**

  - name: binding-position
    act: bindings
    topic: "binding create"
    status: built
    issue: 897
    message: "A position narrows the binding to the tech lead"
    accent: "narrows the binding"
    terminal:
      steps:
        - comment: "Only who holds the position"
          run: "nereus authorization binding create payments-leads"
          options: ["--role team-lead", "--team payments", "--position tech-lead", "--project payments"]
          output: |-
            ✓ authorization/bindings/payments-leads created

            Next steps:

              nereus authorization binding list --project payments
    dependsOn: [binding-team]
    notes: |-
      **`--position` gives the role only to the members of the team who hold that position.** When another person takes the position, the access moves with it, and no binding changes.

      **This is how a tech lead or an architect gets more than the rest of the team** without a second team and without a binding per person.
    pt:
      topic: "binding create"
      message: "Uma posição restringe o binding ao tech lead"
      accent: "restringe o binding"
      notes: |-
