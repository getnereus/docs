            emergency-exit  warn    nereus-admins passed through the emergency exit 199 times since the API started, the last less than a minute ago by admin: give the administrators their own User and a binding of administrator
    dependsOn: [enforce-denied]
    notes: |-
      **Fail closed, reads included:** with no answer, the Nereus API refuses, so an outage is never a way to read what one could not. `nereus whoami`, `nereus status` and `nereus doctor` stay open, so a person can see what is down.

      **The `nereus-admins` group is the emergency exit:** it does not depend on the Nereid, it is the same rule that holds before authorization is installed, and `nereus doctor` warns when it is used. The instance's root User (#1306, How teams, roles and Users relate) takes its place in a later slice.
