  - name: approval-approve
    act: gates
    topic: "approval approve"
    status: built
    issue: 2212
    message: "Approving lifts the hold, and the Nereid provisions"
    accent: "lifts the hold"
    terminal:
      steps:
        - comment: "Ana, of the tech lead team, decides"
          run: "nereus authorization approval approve staging-create-7f3a"
          options: ["--reason \"sprint demo\""]
