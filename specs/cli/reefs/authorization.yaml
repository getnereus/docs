  - name: gate-create
    act: gates
    topic: "gate create"
    status: built
    issue: 2210
    message: "A Gate says which requests wait, and for whom"
    accent: "wait, and for whom"
    terminal:
      steps:
        - comment: "Requests to create an Environment in payments wait for an approver"
          run: "nereus authorization gate create payments-environments"
          options:
            - "--reef environment"
            - "--kinds environments"
            - "--verbs create"
            - "--project payments"
          output: |-
            ✓ authorization/gates/payments-environments created

            Next steps:

              nereus authorization gate list
        - comment: "And the gates in force"
          run: "nereus authorization gate list"
          output: |-
            NAME                   REEF         KINDS         VERBS   ORGANIZATION  PROJECT   APPROVERS  EXPIRES
            payments-environments  environment  environments  create  example       payments  -          7d
    dependsOn: [fail-closed]
    notes: |-
      **A hard gate refuses, a soft gate holds** (ADR 0031): without a right to the verb the answer is a 403, as today; a person who may only `request` it creates the object, and it waits for an approver.

      **A Gate belongs to a node of the tenancy tree,** as a Binding does, and holds for that node and the nodes under it. It names a reef, its kinds and the verbs (`create` only, for now); the approvers, once #2220 serves them, are the subjects a Binding takes (until then whoever may `create` the kind at the node approves). A `request` with no Gate to match is refused, since nobody would decide it.

      **A new kind gets approvals by a Gate alone:** no reef writes its own flow.
    pt:
      topic: "gate create"
      message: "Um Gate diz quais pedidos esperam, e por quem"
      accent: "esperam, e por quem"
      notes: |-
        **Um hard gate recusa, um soft gate segura** (ADR 0031): sem o direito ao verbo a resposta é um 403, como hoje; quem só pode fazer `request` cria o objeto, e ele espera por um aprovador.

        **Um Gate pertence a um nó da árvore de tenancy,** como um Binding, e vale para esse nó e os nós abaixo dele. Ele nomeia um reef, os seus kinds e os verbos (só `create`, por enquanto); os aprovadores, quando a #2220 os servir, são os sujeitos que um Binding aceita (até lá, aprova quem pode `create` o kind no nó). Um `request` sem Gate que o cubra é recusado, já que ninguém o decidiria.

        **Um kind novo ganha aprovações só com um Gate:** nenhum reef escreve o seu próprio fluxo.

  - name: create-held
    act: gates
    topic: "create, held"
    status: planned
    issue: 2119
    message: "The object exists at once, and stands Pending"
    accent: "stands Pending"
    terminal:
      steps:
        - comment: "A dry run says whose approval it would wait for, and writes nothing"
          run: "nereus environment create staging"
          options: ["--project payments", "--dry-run"]
          output: |-
            would wait for approval: authorization/gates/payments-environments, approvers team/payments/tech-lead
            environment/environments/staging would be created (mandate: vcluster, nereid: vcluster).
            Nothing changed (--dry-run).
        - comment: "Bruno may ask, not create"
          run: "nereus environment create staging"
          options: ["--project payments"]
          output: |-
            ✓ environment/environments/staging created, waiting for approval (authorization/approvals/staging-create-7f3a; approvers: team/payments/tech-lead)

            Next steps:

              nereus environment get staging --watch
        - comment: "And he can see it wait"
          run: "nereus environment get staging"
          output: |-
            NAME      PHASE     READY   REASON            AGE
            staging   Pending   False   WaitingApproval   2m
    dependsOn: [gate-create]
    notes: |-
      **The hold is one annotation** on the object, set by the Nereus API when it writes it and lifted only by the API when the Approval is approved. While it is on, a Nereid never acts on the object and an `apply` is refused (409); a `delete` by the requester withdraws the request.

      **Who writes what (ADR 0005):** the API writes the object's `spec` and the hold; the gate Nereid writes its `status` (`Pending`, `Ready=False`, reason `WaitingApproval`); once the hold is lifted, the kind's own Nereid takes the `status` back.
    pt:
      topic: "create, retido"
      message: "O objeto existe de imediato, e fica Pending"
      accent: "fica Pending"
      notes: |-
        **O hold é uma anotação** no objeto, posta pela Nereus API ao escrevê-lo e retirada só pela API quando a Approval é aprovada. Enquanto ela está lá, uma Nereid nunca age sobre o objeto e um `apply` é recusado (409); um `delete` de quem pediu retira o pedido.

        **Quem escreve o quê (ADR 0005):** a API escreve o `spec` do objeto e o hold; a Nereid do gate escreve o seu `status` (`Pending`, `Ready=False`, motivo `WaitingApproval`); com o hold retirado, a Nereid do próprio kind retoma o `status`.

