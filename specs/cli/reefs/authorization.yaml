    dependsOn: [approval-list]
    notes: |-
      **`approve` is a command of the `approval` kind,** an amendment to ADR 0013: it records one decision in `decisions[]` (a list, so a quorum fits later). The API asks the approver the check of a creation, `create` on the held kind at the target's node, so whoever may create it there, or at a node above, may approve.

      **After the decision** the API lifts the hold, the kind's own Nereid reconciles as usual, and the gate Nereid follows `Ready` into the Approval's `Provisioned` condition, which the notifications read.
    pt:
      topic: "approval approve"
      message: "Aprovar retira o hold, e a Nereid provisiona"
      accent: "retira o hold"
      notes: |-
        **`approve` é um comando do kind `approval`,** uma emenda à ADR 0013: grava uma decisão em `decisions[]` (uma lista, para caber um quórum depois). A API pergunta ao aprovador a checagem de uma criação, `create` no kind retido no nó do alvo, então aprova quem pode criá-lo ali, ou num nó acima.

        **Depois da decisão** a API retira o hold, a Nereid do próprio kind reconcilia como de costume, e a Nereid do gate acompanha o `Ready` até a condição `Provisioned` da Approval, que as notificações leem.

