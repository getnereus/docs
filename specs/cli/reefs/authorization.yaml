      notes: |-
        **O objeto fica, marcado `Rejected`:** a Nereid do gate escreve `phase: Rejected`, `Ready=False`, motivo `Rejected`, e a fase fica até o `delete` (ADR 0026). O hold nunca é retirado, então nada é provisionado. Um pedido expirado termina igual, com o motivo `Expired`.

