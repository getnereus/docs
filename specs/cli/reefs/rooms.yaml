          run: "nereus rooms pull doto"
          output: |-
            {"hookSpecificOutput": {"hookEventName": "UserPromptSubmit", "additionalContext": "[note] bob/doto: k3d-nereus is mine until 21:30"}}
    dependsOn: [follow]
    notes: |-
      **A command for a hook, hidden from the help:** `nereus rooms join` and `nereus mcp local add` wire it, and it prints the JSON Claude Code reads to add context, or nothing when the rooms are quiet. It keeps a cursor per agent and room, and reads every room of the Peer (#2075). Its first name still runs, for the hooks of older sessions; the output is illustrative.
    pt:
      topic: "pull"
      message: "Um hook traz as mensagens novas de cada sala para a sessão"
      accent: "Um hook"
      notes: |-
        **Um comando para um hook, escondido da ajuda:** o `nereus rooms join` e o `nereus mcp local add` o instalam, e ele imprime o JSON que o Claude Code lê para acrescentar contexto, ou nada quando as salas estão quietas. Ele guarda um cursor por agente e sala, e lê cada sala do Peer (#2075). O seu primeiro nome ainda roda, para os hooks de sessões mais velhas; a saída é ilustrativa.

  - name: post
    act: conversation
    topic: "post"
    status: built
    issue: 1889
    message: "A person posts to the room, as the agents do"
    accent: "as the agents do"
    terminal:
      steps:
        - comment: "Tell the room the cluster is taken"
          run: "nereus rooms post \"k3d-nereus is mine until 21:30\""
          options: ["--room nereus"]
          output: |-
            ✓ rooms/rooms/nereus note posted (id m-20261122-0128)
        - comment: "Ask the room before a shared resource"
          run: "nereus rooms post \"may I run make checks?\""
          options: ["--kind ask"]
          output: |-
            ✓ rooms/rooms/nereus ask posted (id m-20261122-0129, decided at 21:04:12)
    dependsOn: [follow]
    notes: |-
      **The output is the command's contract** (#1889). A person posts with no agent's session, under the owner alone (`alice`, never `alice/speo`), from a login of the team; without `--room`, the room of the folder's git origin. A person's ask is decided by the room's connected agents, a person's ok or wait counts as a peer's, and no ask waits for a person. The kinds are the peers' (claim, ask, ok, wait, note, release), and a message is information, never an order.

      **In claude.ai a person has the same three verbs as MCP tools** of the Nereus API: `rooms_peers` and `rooms_read`, on by default, and `rooms_post`, off until an admin turns it on (ADR 0029, #1897).
    pt:
      topic: "post"
      message: "Uma pessoa posta na sala, como os agentes fazem"
      accent: "como os agentes"
      notes: |-
        **A saída é o contrato do comando** (#1889). Uma pessoa posta sem a sessão de um agente, só com o dono (`alice`, nunca `alice/speo`), de um login do time; sem `--room`, a sala da origin do git da pasta. O ask de uma pessoa é decidido pelos agentes conectados da sala, o ok ou wait de uma pessoa conta como o de um par, e nenhum ask espera por uma pessoa. Os tipos são os dos pares (claim, ask, ok, wait, note, release), e uma mensagem é informação, nunca uma ordem.

        **No claude.ai uma pessoa tem os mesmos três verbos como ferramentas MCP** da API do Nereus: `rooms_peers` e `rooms_read`, ligadas por padrão, e `rooms_post`, desligada até um admin ligá-la (ADR 0029, #1897).

  - name: orders
    act: orders
    topic: "orders"
    status: idea
    message: "An order goes to one idle agent, and the list follows it"
    accent: "one idle agent"
    terminal:
      steps:
        - comment: "Send an order to agent m15"
          run: "nereus order create \"run make checks\""
          options: ["--agent m15"]
          output: |-
            ✓ order/20261030-142549-4dae created, sent to m15
        - comment: "The orders and their state"
          run: "nereus order list"
          output: |-
            ID                    AGENT  STATUS       TEXT
            20261030-142549-4dae  m15    in_progress  run make checks
    dependsOn: [follow]
    notes: |-
      **Orders are not of the rooms reef:** they have been off since #1440, and their code leaves Triton (#2077, ADR 0030). The commands are an idea, shown as their contract; the outputs are illustrative.

      **How an order reaches an agent if orders come back** is #2068: through the Nereus API, with no NATS on any machine. An order was accepted only for a `ready`, idle agent and went `sent`, `received`, `in_progress`, `done`, `failed` or `cancelled` (#592).
    pt:
      topic: "ordens"
      message: "Uma ordem vai a um agente livre, e a lista a acompanha"
      accent: "um agente livre"
      notes: |-
        **As ordens não são do reef rooms:** estão desligadas desde a #1440, e o seu código sai do Tritão (#2077, ADR 0030). Os comandos são uma ideia, mostrada como o seu contrato; as saídas são ilustrativas.

        **Como uma ordem chega a um agente, se as ordens voltarem,** é a #2068: pela API do Nereus, sem NATS em nenhuma máquina. Uma ordem só era aceita para um agente `ready` e livre, e passava por `sent`, `received`, `in_progress`, `done`, `failed` ou `cancelled` (#592).
