        **Num Environment** (#877), o `--secret-value` faz o binding no namespace do Environment no host, `env-<nereid>-<environment>`, que o vault precisa permitir pelo nome; o `--secret` é recusado ali até o #1065.

        **A CLI recusa antes de escrever qualquer coisa** quando o secret não existe, a chave não está nele ou o vault não permite o namespace; a Nereid escreve o HelmRelease só quando cada binding está `Ready`, e `BindingFailed` diz quando um não pode ficar.

