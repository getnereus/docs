  - name: ingress-curl
    act: ingress
    topic: "curl"
    message: "A Gateway opens Envoy's listener, and with no route it answers 404"
    accent: "answers 404"
    terminal:
      steps:
        - comment: "The Gateway ingress: class istio, the gateway's Service, HTTP on port 80"
          run: "kubectl apply"
          options: ["--filename gateway.yaml"]
          output: |-
            gateway.gateway.networking.k8s.io/ingress created
        - comment: "The host port, the gateway's Service, Envoy"
          run: "curl"
          options: ["--include http://localhost:8080/"]
          output: |-
            HTTP/1.1 404 Not Found
            date: Sat, 31 Oct 2026 20:51:28 GMT
            server: istio-envoy
            content-length: 0
    dependsOn: [ingress-istio-gateway]
    notes: |-
      **Envoy opens no listener until a Gateway asks for one:** without it, curl gets an empty reply. `gateway.yaml` is a Gateway API Gateway `ingress` in `istio-system`, of the class `istio`, bound to the chart's Service through `addresses` (`istio-gateway.istio-system.svc.cluster.local`, Istio's manual deployment), with one HTTP listener on port 80; applied by hand, the same stand-in as the CRDs (#751).

      **The 404 proves the path:** the k3d port, the gateway's Service and Envoy answering with no route; the routes are #728. The scene's port is a free one, shown here as the kept cluster's 8080.
    pt:
      topic: "curl"
      message: "Um Gateway abre o listener do Envoy, e sem rota ele responde 404"
      accent: "responde 404"
      notes: |-
        **O Envoy não abre listener até um Gateway pedir um:** sem ele, o curl recebe uma resposta vazia. O `gateway.yaml` é um Gateway `ingress` da Gateway API no `istio-system`, da class `istio`, ligado ao Service do chart pelo `addresses` (`istio-gateway.istio-system.svc.cluster.local`, o deployment manual do Istio), com um listener HTTP na porta 80; aplicado à mão, o mesmo stand-in dos CRDs (#751).

        **O 404 prova o caminho:** a porta do k3d, o Service do gateway e o Envoy respondendo sem rota; as rotas são o #728. A porta do scene é uma livre, mostrada aqui como a 8080 do cluster mantido.
