deck:
  name: release
  title: "The release Reef"
  subtitle: "Every command of the release Reef: where a chart comes from, what it is, where it goes and the release itself"
  accent: "where it goes"
  pt:
    title: "O Reef release"
    subtitle: "Todos os comandos do Reef release: de onde um chart vem, o que ele é, para onde vai e o próprio release"
    accent: "para onde vai"

acts:
  - name: opening
    title: "Opening"
    pt: {title: "Abertura"}
  - name: setup
    title: "Setup"
    question: "What comes before the first chart?"
    pt: {title: "Preparação", question: "O que vem antes do primeiro chart?"}
  - name: repository
    title: "Repository"
    question: "Where does the chart come from?"
    pt: {title: "Repository", question: "De onde vem o chart?"}
  - name: source
    title: "Source"
    question: "Which chart, at which version?"
    pt: {title: "Source", question: "Qual chart, em qual versão?"}
  - name: target
    title: "Target"
    question: "Where does it go?"
    pt: {title: "Target", question: "Para onde ele vai?"}
  - name: release
    title: "Release"
    question: "How does a chart start running?"
    pt: {title: "Release", question: "Como um chart começa a rodar?"}
  - name: ingress
    title: "Ingress"
    question: "How does traffic reach the cluster?"
    pt: {title: "Ingress", question: "Como o tráfego chega ao cluster?"}

slides:
  - name: cover
    act: opening
    cover: true
    message: "The release Reef"
    notes: |-
      **The source of truth for the commands of the release Reef** (#477). Every command here is built: the CLI builds them itself (`cli/src/nereus/commands/release.py`, #445 (the release Reef)), and the outputs are what they print, recorded on a throwaway cluster by `make scene-release`, `make scene-ingress` (#745, Istio through the release Reef) and the commands of #479.

      **The Reef takes a chart from where it comes from to where it runs**, without tying Nereus to Flux, Argo CD or plain Helm: the Mandate picks the Nereid (ADR 0010, Reefs at runtime).
    pt:
      message: "O Reef release"
      notes: |-
        **A fonte da verdade dos comandos do Reef release** (#477). Todo comando aqui está pronto: o próprio CLI os constrói (`cli/src/nereus/commands/release.py`, #445 (o Reef release)), e as saídas são o que eles imprimem, gravadas num cluster descartável pelo `make scene-release`, pelo `make scene-ingress` (#745, o Istio pelo Reef release) e pelos comandos do #479.

        **O Reef leva um chart de onde ele vem até onde ele roda**, sem amarrar o Nereus ao Flux, ao Argo CD ou ao Helm puro: o Mandate escolhe a Nereid (ADR 0010, Reefs em runtime).

  - name: kinds
    act: opening
    topic: "kinds"
    message: "Four kinds, each one answering one question"
    accent: "one question"
    screen:
      - "**Repository:** where the chart comes from, a Helm repository, an OCI registry or Git · `nereus release repository`"
      - "**Source:** what is released, a chart of a repository at a version · `nereus release source`"
      - "**Target:** where it goes, a namespace of an environment or of the cluster Nereus runs in · `nereus release target`"
      - "**Release:** a source running in a target, with its values · `nereus release`"
    notes: |-
      **The four kinds live in `release.getnereus.dev/v1alpha1`**, in the namespace Nereus runs in. Every kind takes `create`, `apply`, `list`, `get` and `delete` (ADR 0013, command conventions), and every change takes `--dry-run`.

      **A kind named after its Reef takes the Reef's own verbs:** `nereus release create` is `nereus release release create`, and the slides of the Release use the short form.
    pt:
      topic: "kinds"
      message: "Quatro kinds, cada um respondendo uma pergunta"
      accent: "uma pergunta"
      screen:
        - "**Repository:** de onde o chart vem, um repositório Helm, um registry OCI ou o Git · `nereus release repository`"
        - "**Source:** o que é instalado, um chart de um repositório numa versão · `nereus release source`"
        - "**Target:** para onde ele vai, um namespace de um ambiente ou do cluster onde o Nereus roda · `nereus release target`"
        - "**Release:** um source rodando num target, com os seus values · `nereus release`"
      notes: |-
        **Os quatro kinds vivem em `release.getnereus.dev/v1alpha1`**, no namespace onde o Nereus roda. Todo kind aceita `create`, `apply`, `list`, `get` e `delete` (ADR 0013, convenções de comando), e toda mudança aceita `--dry-run`.

        **Um kind com o nome do seu Reef usa os verbos do próprio Reef:** `nereus release create` é `nereus release release create`, e os slides da Release usam a forma curta.

  - name: apply-reef
    act: setup
    topic: "Reef"
    status: built
    message: "One command applies the {reef:release} Reef, with its four kinds"
    accent: "One command"
    terminal:
      steps:
        - comment: "Apply the release Reef"
          run: "nereus reef apply release"
          output: |-
            ✓ core/reefs/release 0.1.0 created (release.getnereus.dev/v1alpha1: releases, repositories, sources, targets)

            Next steps:

              nereus release --help
              nereus nereid apply <nereid> --reef release
    notes: |-
      **The Reef comes first, with no tool behind it.** Its commands appear in the CLI as soon as it exists; until a Nereid looks after it, nothing writes the status of its objects.
    pt:
      topic: "Reef"
      message: "Um comando aplica o Reef {reef:release}, com os seus quatro kinds"
      accent: "Um comando"
      notes: |-
        **O Reef vem primeiro, sem ferramenta por trás.** Os seus comandos aparecem no CLI assim que ele existe; até uma Nereid cuidar dele, nada escreve o status dos seus objetos.

  - name: apply-reference
    act: setup
    topic: "reference Nereid"
    status: built
    message: "The {nereid:reference-release} Nereid answers every kind with no tool, through the {mandate:reference} Mandate"
    accent: "no tool"
    terminal:
      steps:
        - comment: "Apply the reference Nereid to the release Reef"
          run: "nereus nereid apply reference-release"
          options: ["--reef release", "--image localhost:5111/reference-release-controller:0.1.0"]
          output: |-
            ✓ core/nereids/reference-release created, Ready, pinned to sha256:b3c32d74194e: see 'nereus release --help'

            Next steps:

              nereus nereid list
        - comment: "Make it the Reef's default"
          run: "nereus mandate create reference"
          options: ["--reef release", "--nereid reference-release", "--default"]
          output: |-
            ✓ core/mandates/reference created (reef: release, nereid: reference-release, default)
              clusterrole/controller-reference-release configured (nereid reference-release writes the status of mandate reference)

            Next steps:

              nereus release repository create <name> --url <url>
    dependsOn: [apply-reef]
    notes: |-
      **The reference Nereid is the Reef's reference** (`controllers/reference/reefs/release.py`): it answers a Repository, a Source, a Target and a Release as a real Nereid would, so every command works end to end without Flux. #486 (the fake Nereid became the reference Nereid of every Reef) named it so.

      **Its image is built and pushed by the scene** (`make reference` builds it alone, to the local registry `nereus init` creates); the digest after `pinned to` changes with each build.
    pt:
      topic: "Nereid de referência"
      message: "A Nereid {nereid:reference-release} responde a todo kind sem ferramenta, pelo Mandate {mandate:reference}"
      accent: "sem ferramenta"
      notes: |-
        **A Nereid de referência é a referência do Reef** (`controllers/reference/reefs/release.py`): ela responde a um Repository, um Source, um Target e uma Release como uma Nereid real, então todo comando funciona de ponta a ponta sem o Flux. O #486 (a Nereid fake virou a Nereid de referência de todos os Reefs) lhe deu esse nome.

        **A sua imagem é construída e publicada pelo scene** (`make reference` a constrói sozinha, no registry local que o `nereus init` cria); o digest depois de `pinned to` muda a cada build.

  - name: apply-flux
    act: setup
    topic: "Flux"
    status: built
    message: "The {nereid:flux} Nereid installs Flux and becomes the default through its Mandate"
    accent: "installs Flux"
    terminal:
      steps:
        - comment: "Apply the flux Nereid to the release Reef"
          run: "nereus nereid apply flux"
          options: ["--reef release"]
          output: |-
            ✓ core/nereids/flux created, Ready, pinned to sha256:e8731e3fb833: see 'nereus release --help'
              flux/v2.9.6 created (source-controller, helm-controller in namespace flux-system)

            Next steps:

              nereus mandate create flux --reef release --nereid flux --default
        - comment: "Make it the Reef's default"
          run: "nereus mandate create flux"
          options: ["--reef release", "--nereid flux", "--default"]
          output: |-
            ✓ core/mandates/flux created (reef: release, nereid: flux, default)
              core/mandates/reference configured (reef: release, nereid: reference-release, no longer the default)
              clusterrole/controller-flux configured (nereid flux writes the status of mandate flux)

            Next steps:

              nereus release repository create <name> --url <url>
    dependsOn: [apply-reef]
    notes: |-
      **The flux Nereid runs no tool next to it:** it installs Flux in the cluster first, as the openbao Nereid runs OpenBao. Only the two controllers the Reef uses, `source-controller` and `helm-controller`, from Flux's `install.yaml` of the version the CLI pins, refused unless its digest is the pinned one. Applying it again changes nothing; who upgrades Flux is #449.

      **One Nereid per Reef until #72:** delete the reference one first (`nereus nereid delete reference-release`); its Mandate and the Reef's objects stay. Switching to Argo CD later is another Nereid and another Mandate, with the same commands.
    pt:
      topic: "Flux"
      message: "A Nereid {nereid:flux} instala o Flux e vira a padrão pelo seu Mandate"
      accent: "instala o Flux"
      notes: |-
        **A Nereid flux não roda ferramenta ao lado:** ela instala o Flux no cluster primeiro, como a Nereid openbao roda o OpenBao. Só os dois controllers que o Reef usa, `source-controller` e `helm-controller`, do `install.yaml` do Flux na versão que o CLI fixa, recusado se o digest não for o fixado. Aplicá-la de novo não muda nada; quem atualiza o Flux é o #449.

        **Uma Nereid por Reef até o #72:** apague a de referência antes (`nereus nereid delete reference-release`); o seu Mandate e os objetos do Reef ficam. Trocar para o Argo CD depois é outra Nereid e outro Mandate, com os mesmos comandos.

  - name: repository-create
    act: repository
    topic: "create"
    status: built
    message: "A repository says where the charts come from"
    accent: "where the charts come from"
    terminal:
      steps:
        - comment: "A Helm repository over http"
          run: "nereus release repository create codecentric"
          options: ["--url https://codecentric.github.io/helm-charts", "--type http"]
          output: |-
            ✓ release/repositories/codecentric created
            NAME         TYPE  URL                                        READY
            codecentric  http  https://codecentric.github.io/helm-charts  True

            Next steps:

              nereus release source create <name> --repository codecentric --chart <chart> --version <version>
    dependsOn: [apply-reference]
    notes: |-
      **`--type` is `http` (a Helm repository), `oci` (an OCI registry) or `git`.** A private registry takes `--type oci` and `--secret <secret>`, a secret of the secrets Reef.

      **`READY` comes from the Nereid of the Reef's default Mandate**, which writes the status of every Repository, Source and Target (ADR 0005, Nereids publish endpoints and commands in status).
    pt:
      topic: "create"
      message: "Um repository diz de onde os charts vêm"
      accent: "de onde os charts vêm"
      notes: |-
        **`--type` é `http` (um repositório Helm), `oci` (um registry OCI) ou `git`.** Um registry privado leva `--type oci` e `--secret <secret>`, um secret do Reef secrets.

        **O `READY` vem da Nereid do Mandate padrão do Reef**, que escreve o status de todo Repository, Source e Target (ADR 0005, as Nereids publicam endpoints e comandos no status).

  - name: repository-apply
    act: repository
    topic: "apply"
    status: built
    message: "Apply takes a file, and applying what already holds changes nothing"
    accent: "changes nothing"
    terminal:
      steps:
        - comment: "Write the repository as a file"
          run: "nereus release repository create codecentric"
          options: ["--url https://codecentric.github.io/helm-charts", "--type http", "--dry-run", "--output yaml > codecentric.yaml"]
          output: ""
        - comment: "Apply the file"
          run: "nereus release repository apply"
          options: ["--from-file codecentric.yaml"]
          output: |-
            release/repositories/codecentric unchanged

            Next steps:

              nereus release repository list
    dependsOn: [repository-create]
    notes: |-
      **`create` builds from flags, `apply` takes files** (ADR 0013): `create --dry-run --output yaml` writes the object as `apply --from-file` takes it, whether it exists or not. `apply` reports `created` when the repository is new, `configured` when the file changes it, `unchanged` when it already holds. A folder of files works too.
    pt:
      topic: "apply"
      message: "O apply recebe um arquivo, e aplicar o que já vale não muda nada"
      accent: "não muda nada"
      notes: |-
        **O `create` monta a partir de flags, o `apply` recebe arquivos** (ADR 0013): `create --dry-run --output yaml` escreve o objeto como o `apply --from-file` o recebe, exista ele ou não. O `apply` reporta `created` quando o repository é novo, `configured` quando o arquivo o muda, `unchanged` quando ele já vale. Uma pasta de arquivos também serve.

  - name: repository-list
    act: repository
    topic: "list"
    status: built
    message: "The list shows every repository and whether it is ready"
    accent: "whether it is ready"
    terminal:
      steps:
        - comment: "Every repository"
          run: "nereus release repository list"
          output: |-
            NAME         TYPE  URL                                        READY
            codecentric  http  https://codecentric.github.io/helm-charts  True
    dependsOn: [repository-create]
    notes: |-
      **`--output yaml` prints the objects themselves.** With no repository, the list says so and points to `nereus release repository create --help`.
    pt:
      topic: "list"
      message: "A lista mostra todo repository e se ele está pronto"
      accent: "se ele está pronto"
      notes: |-
        **`--output yaml` imprime os próprios objetos.** Sem nenhum repository, a lista diz isso e aponta para `nereus release repository create --help`.

  - name: repository-get
    act: repository
    topic: "get"
    status: built
    message: "One repository, by its name"
    accent: "by its name"
    terminal:
      steps:
        - comment: "One repository"
          run: "nereus release repository get codecentric"
          output: |-
            NAME         TYPE  URL                                        READY
            codecentric  http  https://codecentric.github.io/helm-charts  True
    dependsOn: [repository-create]
    notes: |-
      **`get` takes `--watch`**, which prints a line each time the repository changes, and `--output yaml`.
    pt:
      topic: "get"
      message: "Um repository, pelo seu nome"
      accent: "pelo seu nome"
      notes: |-
        **O `get` aceita `--watch`**, que imprime uma linha cada vez que o repository muda, e `--output yaml`.

  - name: repository-delete
    act: repository
    topic: "delete"
    status: built
    message: "A repository goes once no source names it"
    accent: "no source names it"
    terminal:
      steps:
        - comment: "Delete the repository"
          run: "nereus release repository delete codecentric"
          output: |-
            ✓ release/repositories/codecentric deleted

            Next steps:

              nereus release repository list
    notes: |-
      **`delete` is refused while another object names the one deleted**, here a Source of the repository; the refusal names it and the command that deletes it first. `--dry-run` says what would be deleted.
    pt:
      topic: "delete"
      message: "Um repository sai quando nenhum source o nomeia"
      accent: "nenhum source o nomeia"
      notes: |-
        **O `delete` é recusado enquanto outro objeto nomeia o que é apagado**, aqui um Source do repository; a recusa o nomeia, com o comando que o apaga antes. `--dry-run` diz o que seria apagado.

  - name: source-create
    act: source
    topic: "create"
    status: built
    message: "A source is one chart of a repository, at one version"
    accent: "at one version"
    terminal:
      steps:
        - comment: "The keycloakx chart at 7.0.1"
          run: "nereus release source create keycloak"
          options: ["--repository codecentric", "--chart keycloakx", "--version 7.0.1"]
          output: |-
            ✓ release/sources/keycloak created
            NAME      REPOSITORY   CHART      VERSION  DIGEST  READY
            keycloak  codecentric  keycloakx  7.0.1    -       True

            Next steps:

              nereus release target create <name> --namespace <namespace>
        - comment: "Create it again"
          run: "nereus release source create keycloak"
          options: ["--repository codecentric", "--chart keycloakx", "--version 7.0.1"]
          output: |-
            ✗ release/sources/keycloak already exists. To change it, write it as a file, then apply the file:
              nereus release source create keycloak --repository codecentric --chart keycloakx --version 7.0.1 --dry-run --output yaml > keycloak.yaml
              nereus release source apply --from-file keycloak.yaml
    dependsOn: [repository-create]
    notes: |-
      **`create` fails when the source exists**, and prints how to change it: write it as a file, then apply the file (ADR 0013).
    pt:
      topic: "create"
      message: "Um source é um chart de um repository, numa versão"
      accent: "numa versão"
      notes: |-
        **O `create` falha quando o source existe**, e imprime como mudá-lo: escrever como arquivo, depois aplicar o arquivo (ADR 0013).

  - name: source-apply
    act: source
    topic: "apply"
    status: built
    message: "A new version is one file away"
    accent: "one file away"
    terminal:
      steps:
        - comment: "Write the source at 7.0.2 as a file"
          run: "nereus release source create keycloak"
          options: ["--repository codecentric", "--chart keycloakx", "--version 7.0.2", "--dry-run", "--output yaml > keycloak.yaml"]
          output: ""
        - comment: "Apply the file"
          run: "nereus release source apply"
          options: ["--from-file keycloak.yaml"]
          output: |-
            ✓ release/sources/keycloak configured

            Next steps:

              nereus release source list
    dependsOn: [source-create]
    notes: |-
      **Every Release of the source follows it:** the Nereid of each Release's Mandate moves it to the new version. The slides of the Release show 7.0.2 for that reason. The file is the object: keep it in git, and the next change is an edit of the file and the same `apply`.
    pt:
      topic: "apply"
      message: "Uma versão nova fica a um arquivo de distância"
      accent: "a um arquivo de distância"
      notes: |-
        **Toda Release do source o acompanha:** a Nereid do Mandate de cada Release a leva para a versão nova. Os slides da Release mostram 7.0.2 por isso. O arquivo é o objeto: guarde-o no git, e a próxima mudança é editar o arquivo e o mesmo `apply`.

  - name: source-list
    act: source
    topic: "list"
    status: built
    message: "The list shows every source with its chart and version"
    accent: "its chart and version"
    terminal:
      steps:
        - comment: "Every source"
          run: "nereus release source list"
          output: |-
            NAME      REPOSITORY   CHART      VERSION  DIGEST  READY
            keycloak  codecentric  keycloakx  7.0.2    -       True
    dependsOn: [source-apply]
    notes: |-
      **`--output yaml` prints the objects themselves.**
    pt:
      topic: "list"
      message: "A lista mostra todo source com o seu chart e a sua versão"
      accent: "o seu chart e a sua versão"
      notes: |-
        **`--output yaml` imprime os próprios objetos.**

  - name: source-get
    act: source
    topic: "get"
    status: built
    message: "One source, by its name"
    accent: "by its name"
    terminal:
      steps:
        - comment: "One source"
          run: "nereus release source get keycloak"
          output: |-
            NAME      REPOSITORY   CHART      VERSION  DIGEST  READY
            keycloak  codecentric  keycloakx  7.0.2    -       True
    dependsOn: [source-apply]
    notes: |-
      **`get` takes `--watch` and `--output yaml`.**
    pt:
      topic: "get"
      message: "Um source, pelo seu nome"
      accent: "pelo seu nome"
      notes: |-
        **O `get` aceita `--watch` e `--output yaml`.**

  - name: source-publish
    act: source
    topic: "publish"
    status: built
    message: "Publishing goes through the platform, with its credential, never yours"
    accent: "never yours"
    terminal:
      steps:
        - comment: "An OCI repository whose push credential is a secret of the platform"
          run: "nereus release repository create ghcr"
          options: ["--type oci", "--url oci://ghcr.io/getnereus/charts", "--secret ghcr-push"]
          output: |-
            ✓ release/repositories/ghcr created
            NAME  TYPE  URL                              READY
            ghcr  oci   oci://ghcr.io/getnereus/charts   True

            Next steps:

              nereus release source create <name> --repository ghcr --chart <chart> --version <version>
        - comment: "Package the chart, upload it to the cluster's registry, let the Nereid copy it"
          run: "nereus release source publish nereus"
          options: ["--path charts/nereus", "--repository ghcr"]
          output: |-
            chart nereus 0.4.0 packaged
            registry/registries/main/repositories/chart-nereus created
            uploaded to registry/registries/main/repositories/chart-nereus: sha256:ab12…
            ✓ release/sources/nereus created
            copied to oci://ghcr.io/getnereus/charts/nereus@sha256:ab12…, ready
            NAME    REPOSITORY  CHART   VERSION  DIGEST                READY
            nereus  ghcr        nereus  0.4.0    sha256:ab12cd34ef56…  True

            Next steps:

              nereus release create <name> --source nereus --target <target>
    dependsOn: [repository-create]
    notes: |-
      **No token of the external registry ever sits on the person's machine** (#1229, the ADR "An external registry's push credential is the Repository's secret"): the CLI packages the chart and uploads it to a registry of the cluster with a ten-minute push token, as `nereus registry repository publish` does an image; the flux Nereid copies it by digest with the Repository's `--secret`, delivered by a SecretBinding for the copy alone, and checks the digest the target answers. The registry Reef is required. A GitHub App token replaces the personal one later (#1250).
    pt:
      topic: "publish"
      message: "Publicar passa pela plataforma, com a credencial dela, nunca a sua"
      accent: "nunca a sua"
      notes: |-
        **Nenhum token do registry externo fica na máquina da pessoa** (#1229, the ADR "An external registry's push credential is the Repository's secret"): o CLI empacota o chart e o envia a um registry do cluster com um push token de dez minutos, como `nereus registry repository publish` faz com uma imagem; a Nereid flux o copia por digest com o `--secret` do Repository, entregue por um SecretBinding só para a cópia, e confere o digest que o destino responde. O registry Reef é obrigatório. Um token de GitHub App substitui o pessoal depois (#1250).

  - name: source-delete
    act: source
    topic: "delete"
    status: built
    message: "A source in use is refused, with what to delete first"
    accent: "what to delete first"
    terminal:
      steps:
        - comment: "A release still uses it"
          run: "nereus release source delete keycloak"
          output: |-
            ✗ source keycloak is used by release keycloak-reference.
              Delete it first: nereus release delete keycloak-reference
        - comment: "Once the release is gone"
          run: "nereus release source delete keycloak"
          output: |-
            ✓ release/sources/keycloak deleted

            Next steps:

              nereus release source list
    notes: |-
      **Nothing is left pointing at what is gone:** the refusal names the release and the command that deletes it ([`nereus release delete`](#release-delete)).
    pt:
      topic: "delete"
      message: "Um source em uso é recusado, com o que apagar antes"
      accent: "o que apagar antes"
      notes: |-
        **Nada fica apontando para o que saiu:** a recusa nomeia a release e o comando que a apaga ([`nereus release delete`](#release-delete)).

  - name: target-create
    act: target
    topic: "create"
    status: built
    message: "A target is a namespace, of an environment or of the cluster Nereus runs in"
    accent: "a namespace"
    terminal:
      steps:
        - comment: "The identity namespace of the dev environment"
          run: "nereus release target create dev-identity"
          options: ["--environment dev", "--namespace identity"]
          output: |-
            ✓ release/targets/dev-identity created
            NAME          ENVIRONMENT  NAMESPACE  READY
            dev-identity  dev          identity   True

            Next steps:

