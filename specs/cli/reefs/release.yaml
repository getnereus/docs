  - name: release-delete
    act: release
    topic: "delete"
    status: built
    message: "Deleting a release uninstalls its chart"
    accent: "uninstalls its chart"
    terminal:
      steps:
        - comment: "See what would go"
          run: "nereus release delete keycloak-reference"
          options: ["--dry-run"]
          output: |-
            release/releases/keycloak-reference would be deleted.
            Nothing changed (--dry-run).
        - comment: "Delete it"
          run: "nereus release delete keycloak-reference"
          output: |-
            ✓ release/releases/keycloak-reference deleted

            Next steps:

              nereus release list
    dependsOn: [release-create]
    notes: |-
      **With Flux, deleting the Release deletes the HelmRelease the Nereid wrote, and Flux uninstalls the chart.** Then its source and its target can go.

      **`delete` waits until the Nereid removed what it made**, as `kubectl delete` does: the Release keeps its cleanup finalizer meanwhile, and `list` and `get` show it `Terminating`. A Nereid that writes steps in its status gets a line per step as it changes (time, `✓` done, `…` in progress, `·` pending, `✗` failed, name, message); a failed cleanup ends with exit 1. `--wait=false` returns at once, `--timeout` bounds the wait.
    pt:
      topic: "delete"
      message: "Apagar uma release desinstala o seu chart"
      accent: "desinstala o seu chart"
      notes: |-
        **Com o Flux, apagar a Release apaga o HelmRelease que a Nereid escreveu, e o Flux desinstala o chart.** Depois o seu source e o seu target podem sair.

        **O `delete` espera até a Nereid remover o que fez**, como o `kubectl delete`: a Release mantém o seu finalizer de cleanup enquanto isso, e `list` e `get` a mostram `Terminating`. Uma Nereid que escreve steps no seu status ganha uma linha por step quando ele muda (hora, `✓` feito, `…` em andamento, `·` pendente, `✗` falhou, nome, mensagem); um cleanup que falha termina com exit 1. `--wait=false` retorna na hora, `--timeout` limita a espera.

