    accent: "never pass through Nereus"
    terminal:
      steps:
        - comment: "Keycloak with a Secret in its namespace and one key in its values"
          run: "nereus release create keycloak"
          options: ["--source keycloak", "--target dev-identity", "--values-file keycloak-values.yaml", "--mandate flux", "--secret google-oauth", "--secret-value nereus.googleClientId=google-oauth/GOOGLE_CLIENT_ID"]
          output: |-
            ✓ release/releases/keycloak created (nereid: flux)
              binding secrets/vaults/default/secrets/google-oauth/secretbindings/identity/keycloak
              binding secrets/vaults/default/secrets/google-oauth/secretbindings/nereus-system/keycloak-values-google-oauth

            Next steps:

              nereus release get keycloak --watch
        - comment: "The bindings first, then the HelmRelease"
          run: "nereus release get keycloak"
          options: ["--watch"]
          output: |-
            NAME      SOURCE    TARGET        VERSION  NEREID             STATUS
            keycloak  keycloak  dev-identity  7.0.1    flux    Pending
            2026-10-30T07:53:21Z  ✓ binding      2 Secrets ready: identity/keycloak, nereus-system/keycloak-values-google-oauth.
            2026-10-30T07:53:21Z  ✓ helmrelease  Wrote the Flux HelmRelease keycloak.
            keycloak  keycloak  dev-identity  7.0.1    flux    Progressing
            keycloak  keycloak  dev-identity  7.0.1    flux    Ready
    dependsOn: [release-create-values]
    notes: |-
      **`--secret <vault>/<secret>` asks for a Kubernetes Secret in the Target's namespace**, every key, for a chart that reads a Secret by name; **`--secret-value <path>=<vault>/<secret>/<key>` puts one key into one field of the values**, through a binding in `nereus-system` that the HelmRelease's `valuesFrom` reads (#533). A bare secret name means the vault `default`.

      **Into an Environment** (#877), `--secret-value` binds in the Environment's namespace on the host, `env-<nereid>-<environment>`, which the vault must allow by name; `--secret` is refused there until #1065.

      **The CLI refuses before it writes anything** when the secret does not exist, the key is not in it, or the vault does not allow the namespace; the Nereid writes the HelmRelease only once each binding is `Ready`, and `BindingFailed` says when one cannot be. Recorded by `make scene-release`.
