deck:
  name: build
  title: "The build Reef"
  subtitle: "Every command that builds an image from a Workload's source inside the cluster"
  accent: "inside the cluster"
  pt:
    title: "O Reef build"
    subtitle: "Todos os comandos que constroem uma imagem a partir do código de um Workload dentro do cluster"
    accent: "dentro do cluster"

acts:
  - name: opening
    title: "Opening"
    pt: {title: "Abertura"}
  - name: build
    title: "Build"
    pt: {title: "Build"}
  - name: trigger
    title: "Trigger"
    pt: {title: "Trigger"}
  - name: references
    title: "References"
    pt: {title: "Referências"}

slides:
  - name: cover
    act: opening
    cover: true
    message: "The build Reef"
    notes: |-
      **The source of truth for the commands of the build Reef** (#848, spec 0009: the build Reef's security design). #1067 builds its first slice: the verbs of `Build`, the buildkit Nereid, and the namespace `builds` (made by `nereid apply`) with its NetworkPolicies; #914 adds the `Trigger` (spec 0010), which builds a Workload on each new commit of its Mirror. The group is `build.getnereus.dev/v1alpha1`, cluster-scoped.
    pt:
      message: "O Reef build"
      notes: |-
        **A fonte da verdade dos comandos do Reef build** (#848, spec 0009: o desenho de segurança do Reef build). A #1067 constrói a primeira fatia: os verbos do `Build`, o Nereid buildkit e o namespace `builds` (criado pelo `nereid apply`) com as suas NetworkPolicies; a #914 acrescenta o `Trigger` (spec 0010), que constrói um Workload a cada commit novo do seu Mirror. O grupo é `build.getnereus.dev/v1alpha1`, com escopo de cluster.

  - name: kinds
    act: opening
    topic: "the kind"
    message: "A Build is one image, from one commit, never changed"
    accent: "never changed"
    screen:
      - "**`Build`:** `spec` has `workload`, `commit`, `owner` and `mandate`; `status` has `nereid`, `phase`, `commit`, `image`, `digest` and `job`"
      - "**Its name is the tag:** the image goes to the Repository named after the Workload"
      - "**One writer per field:** the person writes `spec`, the Nereid writes `status`"
    notes: |-
      **`workload` and `commit` never change:** another commit is another Build; `apply --from-file` (#1545, the Reefs' default apply) changes only a Build's `owner` and `mandate`, and refuses the rest. With no `commit`, the Nereid takes the Workload's `status.source.commit` once and keeps it in `status.commit`. **The digest is the registry's answer, never what the Job wrote** (spec 0009).
    pt:
      topic: "o kind"
      message: "Um Build é uma imagem, de um commit, nunca alterado"
      accent: "nunca alterado"
      screen:
        - "**`Build`:** o `spec` tem `workload`, `commit`, `owner` e `mandate`; o `status` tem `nereid`, `phase`, `commit`, `image`, `digest` e `job`"
        - "**O nome é a tag:** a imagem vai para o Repository com o nome do Workload"
        - "**Um escritor por campo:** a pessoa escreve o `spec`, o Nereid escreve o `status`"
      notes: |-
        **`workload` e `commit` nunca mudam:** outro commit é outro Build; o `apply --from-file` (#1545, o apply padrão dos Reefs) muda só o `owner` e o `mandate` de um Build, e recusa o resto. Sem `commit`, o Nereid pega o `status.source.commit` do Workload uma vez e o guarda em `status.commit`. **O digest é a resposta do registry, nunca o que o Job escreveu** (spec 0009).

  - name: build-create
    act: build
    topic: "build create"
    status: built
    issue: 1067
    message: "create builds a Workload at the commit its Nereid read"
    accent: "the commit its Nereid read"
    terminal:
      steps:
        - comment: "Two Jobs in the namespace builds: fetch, then build and push"
          run: "nereus build create hello-1"
          options: ["--workload hello"]
          output: |-
            build/builds/hello-1 created (mandate: buildkit, nereid: buildkit)

            Next steps:

              nereus build get hello-1
    notes: |-
      **`nereus nereid apply buildkit` makes the namespace `builds`, and the Nereid its NetworkPolicies before the first Job** (spec 0009): no traffic but DNS, the registry, and the egress proxy `builds-egress`, which lets a `RUN` reach only the main package hosts and those the build Reef's default Mandate adds with `egressHosts` (#1142). `--commit` takes a full commit (40 hexadecimal digits). A Build that exists is refused: a Build never changes. **Two modes (#1120):** with no `BUILD_RUNTIME_CLASS`, portable mode builds only the operators' Builds, and a team's ends `SandboxRequired`; `nereus nereid apply buildkit --set BUILD_RUNTIME_CLASS=gvisor` runs every build in that RuntimeClass, with `builds` at `baseline`, once a probe Pod there reports a kernel that is not its node's. **The build pool (#1121):** `--set BUILD_NODE_POOL=builds` puts every Pod of `builds` on the nodes labelled and tainted `build.getnereus.dev/pool=builds`, and no other Pod may tolerate that taint.
    pt:
      topic: "build create"
      message: "O create constrói um Workload no commit que o Nereid leu"
      accent: "o commit que o Nereid leu"
      notes: |-
        **O `nereus nereid apply buildkit` cria o namespace `builds`, e o Nereid as suas NetworkPolicies antes do primeiro Job** (spec 0009): nenhum tráfego além de DNS, o registry, e o proxy de saída `builds-egress`, que deixa um `RUN` alcançar só os principais hosts de pacotes e os que o Mandate padrão do build Reef adiciona com `egressHosts` (#1142). O `--commit` aceita um commit completo (40 dígitos hexadecimais). Um Build que já existe é recusado: um Build nunca muda. **Dois modos (#1120):** sem `BUILD_RUNTIME_CLASS`, o modo portável só constrói os Builds dos operadores, e o de um time termina `SandboxRequired`; `nereus nereid apply buildkit --set BUILD_RUNTIME_CLASS=gvisor` roda todo build nessa RuntimeClass, com `builds` em `baseline`, assim que um Pod de sonda ali reporta um kernel que não é o do seu nó. **O pool de builds (#1121):** `--set BUILD_NODE_POOL=builds` põe todo Pod de `builds` nos nós com o label e o taint `build.getnereus.dev/pool=builds`, e nenhum outro Pod pode tolerar esse taint.

  - name: build-get
    act: build
    topic: "build get"
    status: built
    issue: 1067
    message: "get shows the digest the registry answered"
    accent: "the registry answered"
    terminal:
      steps:
        - comment: "Its phase, image and digest"
          run: "nereus build get hello-1"
          output: |-
            Name:          hello-1
            Workload:      hello
            Commit:        a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
            Organization:  -
            Project:       -
            Mandate:       -
            Nereid:        buildkit
            Phase:         Succeeded
            Image:         localhost:31874/hello:hello-1
            Digest:        sha256:3517762d3517762d3517762d3517762d3517762d3517762d3517762d3517762d
            Job:           hello-1
    dependsOn: [build-create]
    notes: |-
      **A Build that waits says why in a `Message` line:** its Workload, a commit, or a Repository with the push credential in `builds` (#1072). `--output yaml` prints the whole object.
    pt:
      topic: "build get"
      message: "O get mostra o digest que o registry respondeu"
      accent: "o registry respondeu"
      notes: |-
        **Um Build que espera diz o porquê numa linha `Message`:** o seu Workload, um commit, ou um Repository com a credencial de push em `builds` (#1072). O `--output yaml` imprime o objeto inteiro.

  - name: build-list
    act: build
    topic: "build list"
    status: built
    issue: 1067
    message: "list shows every build, a line each"
    accent: "a line each"
    terminal:
      steps:
        - comment: "The Workload, the commit, the phase and the digest"
          run: "nereus build list"
          output: |-
            BUILD    WORKLOAD  COMMIT   STATUS     DIGEST
            hello-1  hello     a1b2c3d  Succeeded  sha256:3517762d3517
            hello-2  hello     -        Pending    -
    dependsOn: [build-create]
    notes: |-
      **A Build with no commit yet shows `-`:** it waits for the Workload's Nereid to read one. `--sort-by .metadata.creationTimestamp` lists from the oldest.
    pt:
      topic: "build list"
      message: "O list mostra cada build, uma linha cada"
      accent: "uma linha cada"
      notes: |-
        **Um Build ainda sem commit mostra `-`:** espera o Nereid do Workload ler um. O `--sort-by .metadata.creationTimestamp` lista do mais antigo.

  - name: build-private
    act: build
    topic: "a private repository"
    status: built
    issue: 1070
    message: "A private repository is fetched with a token for that build alone"
    accent: "for that build alone"
    terminal:
      steps:
        - comment: "An allow line for builds on the App's Mandate, then the Build"
          run: "nereus build get app-1"
          output: |-
            Name:      app-1
            Workload:  app
            Phase:     Running
            Message:   source fetched at a1b2c3d from https://github.com/example/app with a token for example/app (contents=read)
    dependsOn: [build-create]
    notes: |-
      **The buildkit Nereid never holds the App's key.** When an authentication Mandate's `allow` covers `builds` and the Workload's repository, it asks a `Token` named after the Build (ADR 0006); the github Nereid mints it into `token-<build>`, which only the fetch Pod mounts. The Token goes once the fetch ends. With no Mandate covering it, the fetch is anonymous; a refused Token leaves the Build `Pending` with the line to add.
    pt:
      topic: "um repositório privado"
      message: "Um repositório privado é buscado com um token só daquele build"
      accent: "só daquele build"
      notes: |-
        **O Nereid buildkit nunca guarda a chave do App.** Quando o `allow` de um Mandate do Reef authentication cobre `builds` e o repositório do Workload, ele pede um `Token` com o nome do Build (ADR 0006); o Nereid github o emite em `token-<build>`, que só o Pod do fetch monta. O Token some quando o fetch termina. Sem Mandate que o cubra, o fetch é anônimo; um Token recusado deixa o Build `Pending` com a linha a acrescentar.

  - name: build-delete
    act: build
    topic: "build delete"
    status: built
    issue: 1067
    message: "delete removes the Build and its Job, never the image"
    accent: "never the image"
    terminal:
      steps:
        - comment: "The image it pushed stays in its Repository"
          run: "nereus build delete hello-1"
          output: |-
            build/builds/hello-1 deleted

            Next steps:

              nereus build list
    dependsOn: [build-create]
    notes: |-
      **The Job is owned by the Build, so Kubernetes deletes it with it.** A new Build of the same name waits until that Job is gone (reason `OldJob`).
    pt:
      topic: "build delete"
      message: "O delete remove o Build e o seu Job, nunca a imagem"
      accent: "nunca a imagem"
      notes: |-
        **O Job pertence ao Build, então o Kubernetes o apaga junto.** Um novo Build com o mesmo nome espera esse Job sumir (motivo `OldJob`).

  - name: trigger-create
    act: trigger
    topic: "build trigger create"
    status: built
    issue: 914
    message: "trigger create builds a Workload on each new commit of its Mirror"
    accent: "each new commit"
    terminal:
      steps:
        - comment: "The Mirror nereus copies the source of the Workload triton"
          run: "nereus build trigger create triton"
          options: ["--workload triton"]
          output: |-
            build/triggers/triton created (mandate: buildkit, nereid: buildkit)

            Next steps:

              nereus build trigger get triton
    dependsOn: [build-create]
    notes: |-
      **A `Trigger` of the build Reef names a Workload; its Nereid follows the scm Reef's Mirror of that Workload's repository** (spec 0010) and, whenever the Mirror's `status.commit` changes, creates the Build `<trigger>-<first 7 digits of the commit>`, labelled `build.getnereus.dev/trigger`. **One Build at a time:** while the last one is `Pending` or `Running`, a new commit waits (`Building`), so a burst of pushes builds the last one. Each Nereid writes only its own Reef's objects: the forgejo Nereid keeps the Mirror's commit, the buildkit Nereid creates the Builds. `--owner` gives every Build that owner, checked as for `nereus build create`, so the gates of spec 0009 hold; `--mandate` names a build Mandate.
    pt:
      topic: "build trigger create"
      message: "O trigger create constrói um Workload a cada commit novo do seu Mirror"
      accent: "cada commit novo"
      notes: |-
        **Um `Trigger` do Reef build nomeia um Workload; o seu Nereid segue o Mirror do Reef scm do repositório desse Workload** (spec 0010) e, sempre que o `status.commit` do Mirror muda, cria o Build `<trigger>-<7 primeiros dígitos do commit>`, com o label `build.getnereus.dev/trigger`. **Um Build por vez:** enquanto o último está `Pending` ou `Running`, um commit novo espera (`Building`), então uma rajada de pushes constrói o último. Cada Nereid escreve só os objetos do seu Reef: o Nereid forgejo mantém o commit do Mirror, o Nereid buildkit cria os Builds. O `--owner` dá esse dono a todo Build, verificado como no `nereus build create`, então os portões da spec 0009 valem; o `--mandate` nomeia um Mandate do build.

  - name: trigger-list
    act: trigger
    topic: "build trigger list"
    status: built
    issue: 914
    message: "trigger list shows the commit each one saw and its last Build"
    accent: "its last Build"
    terminal:
      steps:
        - comment: "After a push, once the Mirror pulled it"
          run: "nereus build trigger list"
          output: |-
            TRIGGER  WORKLOAD  MIRROR  COMMIT   LAST BUILD      STATUS
            triton   triton    nereus  a1b2c3d  triton-a1b2c3d  Ready
    dependsOn: [trigger-create]
    notes: |-
      **The Mirror pulls on its interval, so a push becomes a Build within one interval and one pass** (15 s for the forgejo Nereid). A Trigger that makes no Build says why in `STATUS`: `NoWorkload`, `NoSource`, `NoMirror`, `MirrorNotReady`, `OtherBranch` (a Mirror follows its default branch only), `NameTaken` or `NoMandate`.
    pt:
      topic: "build trigger list"
      message: "O trigger list mostra o commit que cada um viu e o seu último Build"
      accent: "o seu último Build"
      notes: |-
        **O Mirror puxa no seu intervalo, então um push vira um Build dentro de um intervalo e uma passada** (15 s para o Nereid forgejo). Um Trigger que não cria Build diz o porquê em `STATUS`: `NoWorkload`, `NoSource`, `NoMirror`, `MirrorNotReady`, `OtherBranch` (um Mirror segue só o seu branch padrão), `NameTaken` ou `NoMandate`.

  - name: trigger-get
    act: trigger
    topic: "build trigger get"
    status: built
    issue: 914
    message: "trigger get shows the Mirror it follows and the commit it saw"
    accent: "the commit it saw"
    terminal:
      steps:
        - comment: "Its Mirror, branch, commit and last Build"
          run: "nereus build trigger get triton"
          output: |-
            Name:          triton
            Workload:      triton
            Organization:  getnereus
            Project:       nereus/triton
            Mandate:       -
            Nereid:        buildkit
            Mirror:        nereus
            Branch:        main
            Commit:        a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
            Last Build:    triton-a1b2c3d
            Status:        Ready
    dependsOn: [trigger-create]
    notes: |-
      **A Trigger that waits says why in a `Message` line**, with the command to run. `Commit` is the Mirror's commit the Trigger saw on its last pass, built or not yet. `--output yaml` prints the whole object.
    pt:
      topic: "build trigger get"
      message: "O trigger get mostra o Mirror que segue e o commit que viu"
      accent: "o commit que viu"
      notes: |-
        **Um Trigger que espera diz o porquê numa linha `Message`**, com o comando a rodar. `Commit` é o commit do Mirror que o Trigger viu na última passada, construído ou ainda não. O `--output yaml` imprime o objeto inteiro.

  - name: trigger-delete
    act: trigger
    topic: "build trigger delete"
    status: built
    issue: 914
    message: "trigger delete stops new Builds and leaves the ones it made"
    accent: "leaves the ones it made"
    terminal:
      steps:
        - comment: "No new Build of triton; triton-a1b2c3d stays"
          run: "nereus build trigger delete triton"
          output: |-
            build/triggers/triton deleted; the Builds it created stay

            Next steps:

              nereus build trigger list
    dependsOn: [trigger-create]
    notes: |-
      **A Trigger never deletes a Build:** each one stays, with its image, until `nereus build delete`. `--dry-run` says what would go and changes nothing.
    pt:
      topic: "build trigger delete"
      message: "O trigger delete para os Builds novos e mantém os que fez"
      accent: "mantém os que fez"
      notes: |-
        **Um Trigger nunca apaga um Build:** cada um fica, com a sua imagem, até o `nereus build delete`. O `--dry-run` diz o que sairia e não muda nada.

  - name: credits
    act: references
    topic: "references"
    message: "Where the ideas came from"
    accent: "the ideas"
    screen:
      - "**[BuildKit](https://github.com/moby/buildkit):** the builder, rootless"
      - "**[crane](https://github.com/google/go-containerregistry/tree/main/cmd/crane):** the push, with no shell"
      - "**[Flux image automation](https://fluxcd.io/flux/components/image/):** a controller that follows a source and acts on a new revision, the Trigger's shape"
    notes: |-
      **The full reasoning is in spec 0009** (the build Reef's security design) **and spec 0010** (the Trigger: a new commit on a Mirror builds a Workload).
    pt:
      topic: "referências"
      message: "De onde vieram as ideias"
      accent: "as ideias"
      screen:
        - "**[BuildKit](https://github.com/moby/buildkit):** o builder, rootless"
        - "**[crane](https://github.com/google/go-containerregistry/tree/main/cmd/crane):** o push, sem shell"
        - "**[Flux image automation](https://fluxcd.io/flux/components/image/):** um controller que segue uma fonte e age numa revisão nova, a forma do Trigger"
      notes: |-
        **O raciocínio completo está na spec 0009** (o desenho de segurança do Reef build) **e na spec 0010** (o Trigger: um commit novo num Mirror constrói um Workload).
