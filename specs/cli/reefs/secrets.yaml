deck:
  name: secrets
  title: "The secrets Reef"
  subtitle: "Every command of the secrets Reef: vaults, and the secrets in them, encrypted before they leave the machine"
  accent: "encrypted before they leave the machine"
  pt:
    title: "O Reef secrets"
    subtitle: "Todos os comandos do Reef secrets: vaults, e os secrets dentro deles, cifrados antes de saírem da máquina"
    accent: "cifrados antes de saírem da máquina"

acts:
  - name: opening
    title: "Opening"
    pt: {title: "Abertura"}
  - name: setup
    title: "Setup"
    question: "What comes before the first secret?"
    pt: {title: "Preparação", question: "O que vem antes do primeiro secret?"}
  - name: secret
    title: "Secret"
    question: "How does a value reach the cluster without being seen?"
    pt: {title: "Secret", question: "Como um valor chega ao cluster sem ser visto?"}
  - name: vault
    title: "Vault"
    question: "Where are secrets kept, and who may bind them?"
    pt: {title: "Vault", question: "Onde os secrets ficam, e quem pode vinculá-los?"}
  - name: binding
    title: "Binding"
    question: "How does a pod read a secret?"
    pt: {title: "Binding", question: "Como um pod lê um secret?"}

slides:
  - name: cover
    act: opening
    cover: true
    message: "The secrets Reef"
    notes: |-
      **The source of truth for the commands of the secrets Reef** (#477). Every command here is built: the CLI builds them itself (`cli/src/nereus/commands/secrets.py`, #530 (the Vault and Secret kinds of the secrets Reef)), and the outputs are what they print, recorded on a throwaway cluster by `make scene`.

      **A value never leaves the machine in the clear:** the CLI encrypts it with the public key of the vault's Mandate, and only the Nereid behind that Mandate can open it. The cluster holds envelopes; `get` and `list` show the names of the keys, never a value.
    pt:
      message: "O Reef secrets"
      notes: |-
        **A fonte da verdade dos comandos do Reef secrets** (#477). Todo comando aqui está pronto: o próprio CLI os constrói (`cli/src/nereus/commands/secrets.py`, #530 (os kinds Vault e Secret do Reef secrets)), e as saídas são o que eles imprimem, gravadas num cluster descartável pelo `make scene`.

        **Um valor nunca sai da máquina às claras:** o CLI o cifra com a chave pública do Mandate do vault, e só a Nereid por trás desse Mandate consegue abri-lo. O cluster guarda envelopes; `get` e `list` mostram os nomes das chaves, nunca um valor.

  - name: kinds
    act: opening
    topic: "kinds"
    message: "Three kinds: where secrets are kept, the secrets themselves, and where they are used"
    accent: "Three kinds"
    screen:
      - "**Vault:** where secrets are kept, the Mandate whose Nereid keeps them and the namespaces allowed to bind them · `nereus secrets vault`"
      - "**Secret:** keys and their encrypted values, in a vault, named `<vault>/<secret>` · `nereus secrets`"
      - "**SecretBinding:** a Kubernetes Secret made from a secret, in the namespace of whoever asks for it · `nereus secrets binding`"
    notes: |-
      **The three kinds live in `secrets.getnereus.dev/v1alpha1`**: Vault and Secret in the namespace Nereus runs in, a SecretBinding in its consumer's namespace. Every kind takes `create`, `apply`, `list`, `get` and `delete` (ADR 0013, command conventions: `create` builds from flags and refuses an existing object, `apply` takes only files or folders), and every change takes `--dry-run`.

      **A Vault's Mandate is `spec.mandate`, or the Reef's default Mandate when absent**, and it never changes: the secrets already in it are encrypted with its key. `--allow-namespace` lists the namespaces a binding of the vault may write a Kubernetes Secret to; absent, Nereus's own.

      **Secret is the Reef's default kind:** `nereus secrets create` is `nereus secrets secret create`. A secret is named `<vault>/<secret>`, its object `<vault>.<secret>`; a bare name is in the vault `--vault` names, or the vault `default`.
    pt:
      topic: "kinds"
      message: "Três kinds: onde os secrets ficam, os próprios secrets, e onde eles são usados"
      accent: "Três kinds"
      screen:
        - "**Vault:** onde os secrets ficam, o Mandate cuja Nereid os guarda e os namespaces que podem vinculá-los · `nereus secrets vault`"
        - "**Secret:** chaves e os seus valores cifrados, num vault, com o nome `<vault>/<secret>` · `nereus secrets`"
        - "**SecretBinding:** um Secret do Kubernetes feito de um secret, no namespace de quem o pede · `nereus secrets binding`"
      notes: |-
        **Os três kinds vivem em `secrets.getnereus.dev/v1alpha1`**: Vault e Secret no namespace onde o Nereus roda, um SecretBinding no namespace de quem o consome. Todo kind aceita `create`, `apply`, `list`, `get` e `delete` (ADR 0013, convenções de comando: o `create` monta a partir de flags e recusa um objeto que já existe, o `apply` recebe só arquivos ou pastas), e toda mudança aceita `--dry-run`.

        **O Mandate de um Vault é o `spec.mandate`, ou o Mandate padrão do Reef quando ausente**, e ele nunca muda: os secrets que já estão nele foram cifrados com a sua chave. O `--allow-namespace` lista os namespaces onde um binding do vault pode escrever um Secret do Kubernetes; ausente, o do próprio Nereus.

        **Secret é o kind padrão do Reef:** `nereus secrets create` é `nereus secrets secret create`. Um secret tem o nome `<vault>/<secret>`, e o seu objeto `<vault>.<secret>`; um nome sozinho fica no vault que o `--vault` nomeia, ou no vault `default`.

  - name: init
    act: setup
    topic: "init"
    status: built
    message: "The profile brings the {reef:secrets} Reef ready to use, with its key and the vault default"
    accent: "ready to use"
    terminal:
      steps:
        - comment: "Install core and the internal developer platform profile"
          run: "nereus init"
          options: ["--profile internal-developer-platform"]
          output: |-
            ✓ reef secrets              0.0s  core/reefs/secrets 0.1.0 created (secrets.getnereus.dev/v1alpha1: secrets, secretbindings, vaults)
            ✓ nereid openbao           21.5s  core/nereids/openbao created, Ready
            ✓ mandate default           0.0s  core/mandates/default created (reef: secrets, nereid: openbao, default)
            ✓ public key                5.0s  rsa-4096, SHA256:yJi61pETATOGjDo6b6B2y5+V8jiPPDruqOUYp2CtPFs, version 1
            ✓ vault default             0.1s  secrets/vaults/default created (mandate: default)
    notes: |-
      **These are the secrets Reef's lines of `init`**; the other steps are in What init does (`docs/reference/init.md`).

      **The openbao Nereid runs OpenBao next to it:** it creates an RSA key in OpenBao's Transit engine and publishes its public key in the status of the Mandate `default`, which `init` waits for and checks against its fingerprint. OpenBao keeps its key and values on the volume `openbao-data` and unseals itself, so a restart changes neither; only a lost volume makes a new key, with the next `version`. The vault `default` is where a secret goes when no vault is named.

      **openbao serves the Reef's kinds** (#531): it answers each Vault and Secret, and keeps every secret's values in OpenBao's KV engine. Every output from here on comes from it.
    pt:
      topic: "init"
      message: "O profile traz o Reef {reef:secrets} pronto para uso, com a sua chave e o vault default"
      accent: "pronto para uso"
      notes: |-
        **Estas são as linhas do Reef secrets no `init`**; os outros passos estão em What init does (`docs/reference/init.md`).

        **A Nereid openbao roda o OpenBao ao lado, em modo dev:** ela cria uma chave RSA no engine Transit do OpenBao e publica a sua chave pública no status do Mandate `default`, que o `init` espera e confere pela sua fingerprint. O modo dev guarda tudo em memória: um restart cria uma chave nova, com a próxima `version`. O vault `default` é para onde vai um secret quando nenhum vault é nomeado.

        **A openbao serve os kinds do Reef** (#531): ela responde a cada Vault e Secret, e guarda os valores de cada secret no engine KV do OpenBao. Toda saída daqui em diante vem dela.

  - name: create
    act: secret
    topic: "create"
    status: built
    message: "A {secret:secret} is encrypted on your machine, before it leaves it"
    accent: "before it leaves it"
    terminal:
      steps:
        - comment: "Two keys, each from an environment variable"
          run: "nereus secrets create google-oauth"
          options: ["--from-env GOOGLE_CLIENT_ID", "--from-env GOOGLE_CLIENT_SECRET"]
          output: |-
            ✓ secrets/vaults/default/secrets/google-oauth created (key SHA256:GQ8TrJ9h6ZrNYHItBycWK+tXkURjowfJWcjEyabRIKI)
            Stored encrypted; a Kubernetes Secret is made only when a binding asks for it (#532).

            Next steps:

              nereus secrets get default/google-oauth
    dependsOn: [init]
    notes: |-
      **Envelope encryption, on the client:** each value gets a fresh AES-256-GCM data key and a 12-byte nonce, and the data key is wrapped with RSA-OAEP-256 by the public key the vault's Mandate publishes in its status; the ciphertext is bound to `<vault>.<secret>/<key>`, so an envelope copied elsewhere does not open. The output names the fingerprint of that key. The cluster only ever holds the envelopes.

      **Values come from `--from-env VAR`, `--from-env KEY=VAR` or `--from-file KEY=PATH`**, never from a flag's value, which would land in the shell's history.

      **No Kubernetes Secret is made yet:** a binding asks for one, with #532 (a binding writes a secret into a namespace).
    pt:
      topic: "create"
      message: "Um {secret:secret} é cifrado na sua máquina, antes de sair dela"
      accent: "antes de sair dela"
      notes: |-
        **Envelope encryption, no cliente:** cada valor ganha uma data key AES-256-GCM nova e um nonce de 12 bytes, e a data key é embrulhada com RSA-OAEP-256 pela chave pública que o Mandate do vault publica no seu status; o ciphertext fica preso a `<vault>.<secret>/<key>`, e um envelope copiado para outro lugar não abre. A saída nomeia a fingerprint dessa chave. O cluster só guarda os envelopes.

        **Os valores vêm de `--from-env VAR`, `--from-env KEY=VAR` ou `--from-file KEY=PATH`**, nunca do valor de uma flag, que ficaria no histórico do shell.

        **Nenhum Secret do Kubernetes é criado ainda:** um binding pede um, com o #532 (um binding escreve um secret num namespace).

  - name: create-exists
    act: secret
    topic: "create again"
    status: built
    message: "Creating it again is refused, with how to change it"
    accent: "how to change it"
    terminal:
      steps:
        - comment: "Create it again"
          run: "nereus secrets create google-oauth"
          options: ["--from-env GOOGLE_CLIENT_ID"]
          output: |-
            ✗ secrets/vaults/default/secrets/google-oauth already exists. To change it, write it as a file, then apply the file:
              nereus secrets create google-oauth --from-env GOOGLE_CLIENT_ID --dry-run --output yaml > google-oauth.yaml
              nereus secrets apply --from-file google-oauth.yaml
    dependsOn: [create]
    notes: |-
      **`create` builds from flags and refuses an existing object; `apply` takes only files or folders** (ADR 0013). The refusal prints the two commands that change the secret, with the flags given ([`nereus secrets apply`](#apply) shows them).
    pt:
      topic: "create de novo"
      message: "Criar de novo é recusado, com o jeito de mudá-lo"
      accent: "o jeito de mudá-lo"
      notes: |-
        **O `create` monta a partir de flags e recusa um objeto que já existe; o `apply` recebe só arquivos ou pastas** (ADR 0013). A recusa imprime os dois comandos que mudam o secret, com as flags dadas (o [`nereus secrets apply`](#apply) os mostra).

  - name: create-file
    act: secret
    topic: "create from a file"
    status: built
    message: "A key can come from a file, such as a private key"
    accent: "from a file"
    terminal:
      steps:
        - comment: "A private key from a file, and an id from the environment"
          run: "nereus secrets create github-app"
          options: ["--vault default", "--from-file private-key=key.pem", "--from-env APP_ID"]
          output: |-
            ✓ secrets/vaults/default/secrets/github-app created (key SHA256:GQ8TrJ9h6ZrNYHItBycWK+tXkURjowfJWcjEyabRIKI)
            Stored encrypted; a Kubernetes Secret is made only when a binding asks for it (#532).

            Next steps:

              nereus secrets get default/github-app
    dependsOn: [init]
    notes: |-
      **`--from-file KEY=PATH` takes the file's bytes as the value of `KEY`**, here `private-key`; `--from-env APP_ID` keeps the variable's name as the key. `--vault default` names the vault, the same as `default/github-app`.
    pt:
      topic: "create a partir de arquivo"
      message: "Uma chave pode vir de um arquivo, como uma chave privada"
      accent: "de um arquivo"
      notes: |-
        **O `--from-file KEY=PATH` usa os bytes do arquivo como o valor de `KEY`**, aqui `private-key`; o `--from-env APP_ID` mantém o nome da variável como chave. O `--vault default` nomeia o vault, o mesmo que `default/github-app`.

  - name: apply
    act: secret
    topic: "apply"
    status: built
    message: "Apply takes a folder of secrets, and the second apply changes nothing"
    accent: "changes nothing"
    terminal:
      steps:
        - comment: "Write each secret as a file"
          run: "nereus secrets create google-oauth"
          options: ["--from-env GOOGLE_CLIENT_ID", "--from-env GOOGLE_CLIENT_SECRET", "--dry-run", "--output yaml > secrets/google-oauth.yaml"]
          output: ""
        - comment: "The second one"
          run: "nereus secrets create github-app"
          options: ["--from-file private-key=key.pem", "--from-env APP_ID", "--dry-run", "--output yaml > secrets/github-app.yaml"]
          output: ""
        - comment: "Apply the folder"
          run: "nereus secrets apply"
          options: ["--from-file secrets"]
          output: |-
            ✓ secrets/vaults/default/secrets/github-app configured
            ✓ secrets/vaults/default/secrets/google-oauth configured

            Next steps:

              nereus secrets list
        - comment: "Apply it again"
          run: "nereus secrets apply"
          options: ["--from-file secrets"]
          output: |-
            secrets/vaults/default/secrets/github-app unchanged
            secrets/vaults/default/secrets/google-oauth unchanged

            Next steps:

              nereus secrets list
    dependsOn: [create, create-file]
    notes: |-
      **`create --dry-run --output yaml` writes the secret as `apply --from-file` takes it**, its values already encrypted: the file holds envelopes, never a value. Each run makes a fresh data key and nonce, so the new files differ from what the cluster holds, and the first `apply` reports `configured`; the same files again report `unchanged`.

      **`apply` reports `created` when the secret is new, `configured` when the file changes it, `unchanged` when it already holds.** A file made with a key that is no longer the vault's is reported by the Nereid in the status (`KeyMismatch`): write it again.
    pt:
      topic: "apply"
      message: "O apply recebe uma pasta de secrets, e o segundo apply não muda nada"
      accent: "não muda nada"
      notes: |-
        **O `create --dry-run --output yaml` escreve o secret como o `apply --from-file` o recebe**, com os valores já cifrados: o arquivo guarda envelopes, nunca um valor. Cada execução cria uma data key e um nonce novos, então os arquivos novos diferem do que o cluster guarda, e o primeiro `apply` reporta `configured`; os mesmos arquivos de novo reportam `unchanged`.

        **O `apply` reporta `created` quando o secret é novo, `configured` quando o arquivo o muda, `unchanged` quando ele já vale.** Um arquivo feito com uma chave que não é mais a do vault é reportado pela Nereid no status (`KeyMismatch`): escreva-o de novo.

  - name: list
    act: secret
    topic: "list"
    status: built
    message: "The list shows every secret with its keys, never a value"
    accent: "never a value"
    terminal:
      steps:
        - comment: "Every secret"
          run: "nereus secrets list"
          output: |-
            VAULT    NAME          KEYS                  STATUS  AGE
            default  github-app    APP_ID, +1            Ready   4s
            default  google-oauth  GOOGLE_CLIENT_ID, +1  Ready   5s
    dependsOn: [apply]
    notes: |-
      **`KEYS` shows the first key and how many more**; `get` lists them all. `--vault` keeps one vault's secrets, and `--output yaml` prints the objects with the names of their keys instead of the envelopes.
    pt:
      topic: "list"
      message: "A lista mostra todo secret com as suas chaves, nunca um valor"
      accent: "nunca um valor"
      notes: |-
        **`KEYS` mostra a primeira chave e quantas mais há**; o `get` lista todas. O `--vault` mantém os secrets de um vault só, e o `--output yaml` imprime os objetos com os nomes das suas chaves no lugar dos envelopes.

  - name: get
    act: secret
    topic: "get"
    status: built
    message: "One secret, by its vault and name"
    accent: "by its vault and name"
    terminal:
      steps:
        - comment: "One secret"
          run: "nereus secrets get default/google-oauth"
          output: |-
            Vault     default
            Name      google-oauth
            Keys      GOOGLE_CLIENT_ID
                      GOOGLE_CLIENT_SECRET
            Version   2
            Location  openbao: secret/nereus/default/google-oauth
            Bindings  -
            Status    Ready
            Age       10s
    dependsOn: [apply]
    notes: |-
      **`Version` is the Tool's version of the value**, written by the Nereid: each apply that changed the secret is a new version in OpenBao, here the second. `Location` is where the Tool keeps it, `secret/nereus/<vault>/<secret>` in OpenBao's KV engine. `Bindings` lists what writes the secret into a namespace ([`nereus secrets binding`](#binding-create)); none yet.
    pt:
      topic: "get"
      message: "Um secret, pelo seu vault e o seu nome"
      accent: "pelo seu vault e o seu nome"
      notes: |-
        **`Version` é a versão do valor na ferramenta**, escrita pela Nereid: cada apply que mudou o secret é uma nova versão no OpenBao, aqui a segunda. `Location` é onde a ferramenta o guarda, `secret/nereus/<vault>/<secret>` no engine KV do OpenBao. `Bindings` lista o que escreve o secret num namespace (o [`nereus secrets binding`](#binding-create)); nenhum ainda.

  - name: get-yaml
    act: secret
    topic: "get as yaml"
    status: built
    message: "As YAML, the object shows the names of its keys instead of the envelopes"
    accent: "instead of the envelopes"
    terminal:
      steps:
        - comment: "The object, without its values"
          run: "nereus secrets get google-oauth"
          options: ["--output yaml"]
          output: |-
            apiVersion: secrets.getnereus.dev/v1alpha1
            kind: Secret
            metadata:
              name: default.google-oauth
              namespace: nereus-system
            spec:
              vault: default
              keys:
              - GOOGLE_CLIENT_ID
              - GOOGLE_CLIENT_SECRET
            status:
              location: 'openbao: secret/nereus/default/google-oauth'
              mandate: default
              nereid: openbao
              phase: Ready
              version: '2'
    dependsOn: [apply]
    notes: |-
      **Abridged:** the output also prints the metadata kubectl adds (timestamps, the finalizer, labels, `resourceVersion`, `uid`) and, in the status, the `Ready` condition, the keys again, `observedGeneration`, the `steps` and `updatedAt`; every line shown is printed as is.

      **The object's name is `<vault>.<secret>`**, and a bare name is in the vault `default`. `spec.data`, the envelopes, is replaced by `spec.keys`; the steps say what openbao did: `unwrap` (Transit unwrapped each data key), `decrypt` (each value opened in memory, bound to its place) and `store` ("Stored the 2 keys as version 2 of secret/nereus/default/google-oauth in OpenBao."). No value is in the status, the Nereid's log or the cluster.
    pt:
      topic: "get em yaml"
      message: "Em YAML, o objeto mostra os nomes das suas chaves no lugar dos envelopes"
      accent: "no lugar dos envelopes"
      notes: |-
        **Resumida:** a saída também imprime os metadados que o kubectl acrescenta (timestamps, o finalizer, labels, `resourceVersion`, `uid`) e, no status, a condition `Ready`, as chaves de novo, `observedGeneration`, os `steps` e `updatedAt`; toda linha mostrada é impressa como está.

        **O nome do objeto é `<vault>.<secret>`**, e um nome sozinho fica no vault `default`. O `spec.data`, os envelopes, é trocado pelo `spec.keys`; os steps dizem o que a openbao fez: `unwrap` (o Transit abriu cada data key), `decrypt` (cada valor aberto em memória, preso ao seu lugar) e `store` ("Stored the 2 keys as version 2 of secret/nereus/default/google-oauth in OpenBao."). Nenhum valor está no status, no log da Nereid ou no cluster.

  - name: vault-list
    act: vault
    topic: "list"
    status: built
    message: "The list shows every vault, its Nereid and how many secrets it holds"
    accent: "how many secrets it holds"
    terminal:
      steps:
        - comment: "Every vault"
          run: "nereus secrets vault list"
          output: |-
            NAME     NEREID   NAMESPACES     SECRETS  STATUS  AGE
            default  openbao  nereus-system  2        Ready   4m
    dependsOn: [apply]
    notes: |-
      **`NEREID` is the Nereid of the vault's Mandate**, here `openbao`, through the Reef's default Mandate `default`. `NAMESPACES` are the namespaces a binding of the vault may write to: with no `--allow-namespace`, Nereus's own.
    pt:
      topic: "list"
      message: "A lista mostra todo vault, a sua Nereid e quantos secrets ele guarda"
      accent: "quantos secrets ele guarda"
      notes: |-
        **`NEREID` é a Nereid do Mandate do vault**, aqui a `openbao`, pelo Mandate padrão do Reef, `default`. `NAMESPACES` são os namespaces onde um binding do vault pode escrever: sem `--allow-namespace`, o do próprio Nereus.

  - name: vault-create
    act: vault
    topic: "create"
    status: built
    message: "A vault for a team, with the namespaces allowed to bind its secrets"
    accent: "the namespaces allowed"
    terminal:
      steps:
        - comment: "A vault the identity and tools namespaces may bind"
          run: "nereus secrets vault create team-a"
          options: ["--allow-namespace identity", "--allow-namespace tools"]
          output: |-
            ✓ secrets/vaults/team-a created

            Next steps:

              nereus secrets create <secret> --vault team-a --from-env <VAR>
    dependsOn: [init]
    notes: |-
      **`--mandate` picks the vault's Mandate, so its Nereid and its key**; absent, the Reef's default. It never changes: the secrets in the vault are encrypted with its key. Like a secret, `vault create` refuses an existing vault and points to `vault apply --from-file`.
    pt:
      topic: "create"
      message: "Um vault para um time, com os namespaces que podem vincular os seus secrets"
      accent: "os namespaces que podem"
      notes: |-
        **O `--mandate` escolhe o Mandate do vault, portanto a sua Nereid e a sua chave**; ausente, o padrão do Reef. Ele nunca muda: os secrets do vault são cifrados com a sua chave. Como um secret, o `vault create` recusa um vault que já existe e aponta para o `vault apply --from-file`.

  - name: vault-delete-held
    act: vault
    topic: "delete, held"
    status: built
    message: "A vault that holds secrets is refused, with what to delete first"
    accent: "what to delete first"
    terminal:
      steps:
        - comment: "The vault default still holds two secrets"
          run: "nereus secrets vault delete default"
          output: |-
            ✗ secrets/vaults/default holds secrets github-app, google-oauth. Delete them first:
              nereus secrets delete default/github-app
              nereus secrets delete default/google-oauth
    dependsOn: [apply]
    notes: |-
      **Nothing is left in a vault that is gone:** the refusal names the secrets it holds and the commands that delete them ([`nereus secrets delete`](#delete)).
    pt:
      topic: "delete, ocupado"
      message: "Um vault que guarda secrets é recusado, com o que apagar antes"
      accent: "o que apagar antes"
      notes: |-
        **Nada fica num vault que saiu:** a recusa nomeia os secrets que ele guarda e os comandos que os apagam (o [`nereus secrets delete`](#delete)).

  - name: delete
    act: vault
    topic: "delete a secret"
    status: built
    message: "A secret goes by its full name, or by its name in the vault default"
    accent: "by its full name"
    terminal:
      steps:
        - comment: "By vault and name"
          run: "nereus secrets delete default/google-oauth"
          output: |-
            ✓ secrets/vaults/default/secrets/google-oauth deleted

            Next steps:

              nereus secrets list
        - comment: "A bare name is in the vault default"
          run: "nereus secrets delete github-app"
          output: |-
            ✓ secrets/vaults/default/secrets/github-app deleted

            Next steps:

              nereus secrets list
    dependsOn: [apply]
    notes: |-
      **`--dry-run` says what would be deleted.** openbao destroys every version of the secret in OpenBao, then its metadata, and only then lets the secret go: nothing is left behind.
    pt:
      topic: "delete de um secret"
      message: "Um secret sai pelo seu nome completo, ou pelo seu nome no vault default"
      accent: "pelo seu nome completo"
      notes: |-
        **O `--dry-run` diz o que seria apagado.** A openbao destrói toda versão do secret no OpenBao, depois os seus metadados, e só então deixa o secret ir: nada fica para trás.

  - name: vault-delete
    act: vault
    topic: "delete"
    status: built
    message: "An empty vault goes"
    accent: "empty"
    terminal:
      steps:
        - comment: "Delete the vault team-a"
          run: "nereus secrets vault delete team-a"
          output: |-
            ✓ secrets/vaults/team-a deleted

            Next steps:

              nereus secrets vault list
    dependsOn: [vault-create]
    notes: |-
      **A vault holding secrets is refused** ([`nereus secrets vault delete default`](#vault-delete-held)); an empty one goes at once. `--dry-run` says what would be deleted.
    pt:
      topic: "delete"
      message: "Um vault vazio sai"
      accent: "vazio"
      notes: |-
        **Um vault que guarda secrets é recusado** ([`nereus secrets vault delete default`](#vault-delete-held)); um vazio sai na hora. O `--dry-run` diz o que seria apagado.

  - name: binding-create
    act: binding
    topic: "binding create"
    status: built
    message: "A binding makes a Kubernetes Secret from a secret, in a namespace the vault allows"
    accent: "in a namespace the vault allows"
    terminal:
      steps:
        - comment: "Keycloak, in the namespace identity, reads the Google client under its own key names"
          run: "nereus secrets binding create keycloak-google"
          options: ["--secret default/google-oauth", "--namespace identity", "--key client-id=GOOGLE_CLIENT_ID", "--key client-secret=GOOGLE_CLIENT_SECRET"]
          output: |-
            ✓ secrets/vaults/default/secrets/google-oauth/secretbindings/identity/keycloak-google created
            Secret keycloak-google ready in namespace identity.

            Next steps:

              nereus secrets binding get keycloak-google --namespace identity
    dependsOn: [apply]
    notes: |-
      **A Kubernetes Secret exists only when a binding asks for it** (#532): the SecretBinding lives in the consumer's namespace, and the Nereid of the vault's Mandate reads the secret's current version from OpenBao and writes the Secret `keycloak-google` there, owned by the binding and labelled with the binding, the secret and the vault. `--key name=KEY` renames a key; without one, every key under its own name. `--secret-name` names the Kubernetes Secret, the binding's name by default.

      **The vault decides where:** its `spec.allowedNamespaces` must hold the namespace (here `identity` and `tools`, added with `vault apply`), since whoever can create a binding in a namespace can read what the vault allows there. The CLI waits for `Ready`; `--wait=false` returns at once, `--dry-run` shows the object.
    pt:
      topic: "binding create"
      message: "Um binding faz um Secret do Kubernetes a partir de um secret, num namespace que o vault permite"
      accent: "num namespace que o vault permite"
      notes: |-
        **Um Secret do Kubernetes só existe quando um binding o pede** (#532): o SecretBinding vive no namespace de quem o consome, e a Nereid do Mandate do vault lê a versão atual do secret no OpenBao e escreve ali o Secret `keycloak-google`, de dono o binding e com os labels do binding, do secret e do vault. O `--key nome=CHAVE` renomeia uma chave; sem ele, toda chave com o seu próprio nome. O `--secret-name` dá nome ao Secret do Kubernetes, o do binding por padrão.

        **O vault decide onde:** o seu `spec.allowedNamespaces` precisa ter o namespace (aqui `identity` e `tools`, somados com `vault apply`), já que quem pode criar um binding num namespace pode ler o que o vault permite ali. O CLI espera o `Ready`; o `--wait=false` volta na hora, o `--dry-run` mostra o objeto.

  - name: binding-refused
    act: binding
    topic: "binding create, refused"
    status: built
    message: "A namespace the vault does not allow, or a key the secret does not have, is refused before anything is written"
    accent: "before anything is written"
    terminal:
      steps:
        - comment: "The vault default does not allow the namespace payments"
          run: "nereus secrets binding create payments"
          options: ["--secret default/google-oauth", "--namespace payments"]
          output: |-
            ✗ secrets/vaults/default does not allow namespace payments (it allows: nereus-system, identity, tools).
              Allow it: write the vault as a file, add payments to spec.allowedNamespaces, then apply the file:
              nereus secrets vault get default --output yaml > default.yaml
              nereus secrets vault apply --from-file default.yaml
        - comment: "The secret has no key NOT_A_KEY"
          run: "nereus secrets binding create missing"
          options: ["--secret default/google-oauth", "--namespace identity", "--key x=NOT_A_KEY"]
          output: |-
            ✗ secrets/vaults/default/secrets/google-oauth has no key NOT_A_KEY (it has: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET)
    dependsOn: [binding-create]
    notes: |-
      **The CLI checks what it can see first:** the vault's namespaces, the secret's keys, the secret itself. A binding written by other means (a chart, `kubectl`) gets the same answers from the Nereid, as its `Ready` reason: `NamespaceNotAllowed`, `KeyMissing`, `SecretMissing`, or `WriteFailed` when a Secret of that name exists and is not the binding's.
    pt:
      topic: "binding create, recusado"
      message: "Um namespace que o vault não permite, ou uma chave que o secret não tem, é recusado antes de qualquer escrita"
      accent: "antes de qualquer escrita"
      notes: |-
        **O CLI confere primeiro o que consegue ver:** os namespaces do vault, as chaves do secret, o próprio secret. Um binding escrito por outro meio (um chart, o `kubectl`) recebe as mesmas respostas da Nereid, como a razão do seu `Ready`: `NamespaceNotAllowed`, `KeyMissing`, `SecretMissing`, ou `WriteFailed` quando existe um Secret com esse nome que não é do binding.

  - name: binding-chart
    act: binding
    topic: "a chart asks"
    status: built
    message: "A chart asks for its secret with a SecretBinding among its templates"
    accent: "among its templates"
    terminal:
      steps:
        - comment: "The template of test/charts/binding-demo"
          run: "cat test/charts/binding-demo/templates/secretbinding.yaml"
          output: |-
            apiVersion: {{ .Values.apiGroup }}/v1alpha1
            kind: SecretBinding
            metadata:
              name: {{ .Release.Name }}
              namespace: {{ .Release.Namespace }}
              labels:
                {{- include "binding-demo.labels" . | nindent 4 }}
            spec:
              secret: {{ required "secret is <vault>/<secret>" .Values.secret | quote }}
        - comment: "Installed with Helm, into the namespace tools"
          run: "helm install binding-demo test/charts/binding-demo"
          options: ["--namespace tools", "--create-namespace", "--wait"]
    dependsOn: [binding-create]
    notes: |-
      **No CLI and no Nereus code in the chart:** a SecretBinding is a template like any other, so `helm uninstall` removes it, and with it the Kubernetes Secret. The Nereid reads the chart's name from its Helm labels and shows it as who asked (`chart binding-demo`).
    pt:
      topic: "um chart pede"
      message: "Um chart pede o seu secret com um SecretBinding entre os seus templates"
      accent: "entre os seus templates"
      notes: |-
        **Nem CLI nem código do Nereus no chart:** um SecretBinding é um template como qualquer outro, então o `helm uninstall` o remove, e com ele o Secret do Kubernetes. A Nereid lê o nome do chart nos seus labels do Helm e o mostra como quem pediu (`chart binding-demo`).

  - name: binding-list
    act: binding
    topic: "binding list"
    status: built
    message: "Every binding, with who asked for it"
    accent: "who asked for it"
    terminal:
      steps:
        - comment: "In every namespace"
          run: "nereus secrets binding list"
          output: |-
            NAME             SECRET                NAMESPACE  FOR                 STATUS  AGE
            keycloak-google  default/google-oauth  identity   system:admin        Ready   12s
            binding-demo     default/google-oauth  tools      chart binding-demo  Ready   4s
    dependsOn: [binding-create, binding-chart]
    notes: |-
      **`FOR` is who asked:** a release (`release/releases/<name>`), a chart (`chart <name>`), or the person who ran the CLI, which writes the user Kubernetes names in the annotation `core.getnereus.dev/created-by`. `--namespace` narrows the list to one namespace.
    pt:
      topic: "binding list"
      message: "Todo binding, com quem o pediu"
      accent: "quem o pediu"
      notes: |-
        **`FOR` é quem pediu:** uma release (`release/releases/<nome>`), um chart (`chart <nome>`), ou a pessoa que rodou o CLI, que escreve o usuário que o Kubernetes nomeia na anotação `core.getnereus.dev/created-by`. O `--namespace` restringe a lista a um namespace.

  - name: binding-used
    act: binding
    topic: "where a secret is used"
    status: built
    message: "A secret says where it is used, and is not deleted while it is"
    accent: "where it is used"
    terminal:
      steps:
        - comment: "The secret lists its bindings"
          run: "nereus secrets get default/google-oauth"
          output: |-
            Vault     default
            Name      google-oauth
            Keys      GOOGLE_CLIENT_ID
                      GOOGLE_CLIENT_SECRET
            Version   2
            Location  openbao: secret/nereus/default/google-oauth
            Bindings  identity/keycloak-google  by system:admin        Ready
                      tools/binding-demo        by chart binding-demo  Ready
            Status    Ready
            Age       30s
        - comment: "And is refused while they are there"
          run: "nereus secrets delete default/google-oauth"
          output: |-
            ✗ secrets/vaults/default/secrets/google-oauth is used by 2 bindings: identity/keycloak-google, tools/binding-demo. Delete them first:
              nereus secrets binding delete keycloak-google --namespace identity
              nereus secrets binding delete binding-demo --namespace tools
    dependsOn: [binding-list]
    notes: |-
      **Nothing is left reading a secret that is gone:** the refusal names the bindings and the commands that delete them, as a vault that holds secrets does ([`vault delete`](#vault-delete-held)).
    pt:
      topic: "onde um secret é usado"
      message: "Um secret diz onde é usado, e não sai enquanto é"
      accent: "onde é usado"
      notes: |-
        **Nada fica lendo um secret que saiu:** a recusa nomeia os bindings e os comandos que os apagam, como faz um vault que guarda secrets (o [`vault delete`](#vault-delete-held)).

  - name: binding-delete
    act: binding
    topic: "binding delete"
    status: built
    message: "A binding goes, and its Kubernetes Secret with it"
    accent: "its Kubernetes Secret with it"
    terminal:
      steps:
        - comment: "The binding keycloak-google"
          run: "nereus secrets binding delete keycloak-google"
          options: ["--namespace identity"]
          output: |-
            ✓ secrets/vaults/default/secrets/google-oauth/secretbindings/identity/keycloak-google deleted

            Next steps:

              nereus secrets binding list --namespace identity
    dependsOn: [binding-create]
    notes: |-
      **The Nereid deletes the Kubernetes Secret, then lets the binding go** (the finalizer `secrets.getnereus.dev/cleanup`), and the CLI waits until both are gone. A rotated secret reaches the Kubernetes Secret on the Nereid's next pass; a pod reading it as environment variables needs a restart to see it.
    pt:
      topic: "binding delete"
      message: "Um binding sai, e o seu Secret do Kubernetes com ele"
      accent: "o seu Secret do Kubernetes com ele"
      notes: |-
        **A Nereid apaga o Secret do Kubernetes, depois deixa o binding ir** (o finalizer `secrets.getnereus.dev/cleanup`), e o CLI espera até os dois saírem. Um secret rotacionado chega ao Secret do Kubernetes na próxima passada da Nereid; um pod que o lê como variáveis de ambiente precisa de um restart para vê-lo.
