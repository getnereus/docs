<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Environment screens</title>
<style>
  :root {
    --page: #000; --c1: #141414; --c2: #1c1c1c; --c3: #242424;
    --line: #262626; --text: #f5f5f5; --muted: #a3a3a3; --outline: #444;
    --ok: #4ade80; --ok-bg: rgba(74,222,128,.12); --warn: #fbbf24; --warn-bg: rgba(251,191,36,.12);
    --bad: #f87171; --bad-bg: rgba(248,113,113,.14); --nereid: #9d97ea; --info: #7cc4ff;
    --sec: #4a4458; --on-sec: #e8def8;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Roboto Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #111; color: var(--text); font: 400 14px/20px var(--font); }
  .note { max-width: 412px; margin: 10px auto 0; padding: 0 12px; color: var(--muted); font-size: 13px; line-height: 18px; min-height: 36px; }
  .phone { position: relative; width: 100%; max-width: 412px; height: min(860px, calc(100dvh - 70px)); min-height: 640px; margin: 10px auto 24px; background: var(--page); border: 1px solid #2a2a2a; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; }
  @media (max-width: 440px) { .phone { border-radius: 0; border: 0; margin: 6px 0 0; height: calc(100dvh - 60px); } }
  .scroll { flex: 1; overflow-y: auto; padding: 20px 16px 16px; }
  .appbar h1 { margin: 0; font: 400 28px/36px var(--font); }
  .appbar p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  .summary { display: flex; align-items: center; gap: 14px; margin: 18px 0 14px; padding: 14px 16px; background: var(--c1); border-radius: 20px; }
  .summary .big { font: 400 22px/28px var(--font); }
  .summary .sub { color: var(--muted); font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .bg-ok { background: var(--ok); } .bg-warn { background: var(--warn); } .bg-bad { background: var(--bad); }
  .section-label { margin: 16px 4px 8px; color: var(--muted); font: 500 13px/18px var(--font); letter-spacing: .02em; }
  svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .spark { display: block; width: 100%; height: 28px; }
  .spark polyline { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .spark path { stroke: none; opacity: .14; }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: transparent; border: 0; color: var(--text); cursor: pointer; flex: none; }
  .iconbtn:active { background: var(--c2); }

  /* toolbar: filter chips, search, view toggle */
  .toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; min-height: 44px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
  .chip-f { flex: none; font: 500 13px/18px var(--font); color: var(--text); background: transparent; border: 1px solid var(--outline); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .chip-f[aria-pressed="true"] { background: var(--sec); border-color: var(--sec); }
  .search { flex: none; display: flex; align-items: center; height: 40px; width: 40px; border-radius: 20px; border: 1px solid var(--outline); overflow: hidden; transition: width .22s ease, background .22s ease; background: transparent; }
  .search button { width: 38px; height: 38px; flex: none; display: grid; place-items: center; background: transparent; border: 0; color: var(--text); cursor: pointer; padding: 0; }
  .search svg.i { width: 18px; height: 18px; }
  .search input { flex: 1 1 auto; min-width: 0; width: 0; height: 38px; border: 0; outline: 0; background: transparent; color: var(--text); font: 400 15px/20px var(--font); padding: 0; }
  .search .clear { display: none; }
  .toolbar.open .chips { display: none; }
  .toolbar.open .search { flex: 1 1 auto; width: auto; background: var(--c2); border-color: var(--c2); }
  .toolbar.open .search .clear { display: grid; }
  .toolbar.filtered:not(.open) .search { background: var(--sec); border-color: var(--sec); }
  .viewtoggle { flex: none; width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--outline); display: grid; place-items: center; background: transparent; color: var(--text); cursor: pointer; padding: 0; }
  .viewtoggle svg.i { width: 18px; height: 18px; }
  .qline { display: flex; align-items: center; justify-content: space-between; margin: -6px 4px 6px; color: var(--muted); font-size: 13px; }
  .qline button { background: transparent; border: 0; color: var(--on-sec); font: 500 13px/18px var(--font); cursor: pointer; padding: 6px 4px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty button { margin-top: 12px; }
  mark { background: transparent; color: var(--on-sec); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .search { transition: none; } .pulse { animation: none !important; } }

  /* list rows */
  .row { display: flex; gap: 12px; align-items: center; padding: 12px 8px; border-radius: 16px; cursor: pointer; }
  .row:active { background: var(--c1); }
  .row .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--c2); display: grid; place-items: center; flex: none; }
  .row .tx { flex: 1; min-width: 0; }
  .row .t1 { display: flex; justify-content: space-between; gap: 8px; font: 400 16px/22px var(--font); }
  .row .t1 > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .t2 { color: var(--muted); font-size: 13px; display: flex; gap: 10px; font-family: var(--mono); white-space: nowrap; overflow: hidden; }
  .row .t3 { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .spark { height: 22px; margin-top: 2px; }
  .nm { color: var(--muted); font: 400 13px/18px var(--font); }
  .badge { flex: none; font: 500 12px/16px var(--font); padding: 2px 8px; border-radius: 6px; }
  .badge.ok { background: var(--ok-bg); } .badge.warn { background: var(--warn-bg); } .badge.bad { background: var(--bad-bg); }

  /* grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--c1); border-radius: 16px; padding: 12px; cursor: pointer; border: 1px solid transparent; min-width: 0; }
  .tile.attn { border-color: currentColor; }
  .tile .top { display: flex; align-items: center; justify-content: space-between; }
  .tile .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--c3); display: grid; place-items: center; color: var(--text); }
  .tile .ic svg.i { width: 18px; height: 18px; }
  .tile .name { margin-top: 10px; font: 500 15px/20px var(--font); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .nm { font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .num { margin-top: 8px; display: flex; justify-content: space-between; align-items: baseline; color: var(--text); }
  .tile .num b { font: 400 20px/24px var(--font); }
  .tile .num span { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .tile .reason { margin-top: 6px; font-size: 12px; line-height: 16px; }

  /* environment health card */
  .health { margin: 4px 0 14px; padding: 14px 16px 6px; background: var(--c1); border-radius: 20px; }
  .health .h1 { display: flex; align-items: center; gap: 10px; font: 400 18px/24px var(--font); }
  .health .h2 { margin: 2px 0 0 20px; color: var(--muted); font-size: 12px; line-height: 16px; }
  .hgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin-top: 10px; }
  .hcell { padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
  .hcell .l { color: var(--muted); font-size: 12px; line-height: 16px; }
  .hcell .v { font: 400 16px/22px var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hcell .meter { margin: 4px 0 2px; }
  .upd { display: flex; align-items: center; gap: 10px; margin: 6px 0 8px; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--text); font-size: 13px; line-height: 18px; }
  .upd svg.i { width: 18px; height: 18px; color: var(--warn); flex: none; }

  /* detail */
  .topbar { display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px; }
  .hero { display: flex; align-items: center; gap: 14px; padding: 4px 8px 12px; }
  .hero .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--c2); display: grid; place-items: center; flex: none; }
  .hero .ic svg.i { width: 26px; height: 26px; }
  .hero h2 { margin: 0; font: 400 24px/30px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero .nm b { color: var(--nereid); font-weight: 500; }
  .seg { display: flex; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; margin: 4px 0 12px; }
  .seg button { flex: 1 1 0; min-width: 0; padding: 8px 4px; background: transparent; color: var(--text); border: 0; border-right: 1px solid var(--outline); font: 500 13px/18px var(--font); cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--sec); }
  .signals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sig { background: var(--c1); border-radius: 16px; padding: 12px; min-width: 0; }
  .sig .lbl { color: var(--muted); font: 500 12px/16px var(--font); display: flex; justify-content: space-between; gap: 6px; }
  .sig .val { font: 400 26px/32px var(--font); margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
  .sig .val small { font-size: 14px; color: var(--muted); margin-left: 2px; }
  .sig .spark { height: 40px; }
  .sig.missing .val { font-size: 14px; line-height: 20px; color: var(--muted); }
  .card { background: var(--c1); border-radius: 16px; padding: 4px 14px; margin-top: 8px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .kv:last-child { border-bottom: 0; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { text-align: right; font-family: var(--mono); font-size: 13px; }
  .meter { height: 6px; border-radius: 3px; background: var(--c3); position: relative; margin: 6px 0 2px; }
  .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
  .meter b { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--muted); }
  .meter-legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .pod { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .pod:last-child { border-bottom: 0; }
  .pod .p1 { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 13px; }
  .pod .p1 span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pod .p2 { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tonal { background: var(--sec); color: var(--on-sec); border: 0; padding: 10px 20px; border-radius: 20px; font: 500 14px/20px var(--font); cursor: pointer; }
  .livebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; background: var(--c1); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .livebar .live { display: flex; align-items: center; gap: 6px; color: var(--text); }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: p 1.4s infinite; }
  @keyframes p { 50% { opacity: .25; } }

  nav.bottom { display: flex; background: var(--c1); border-top: 1px solid var(--line); padding: 10px 0 14px; }
  nav.bottom button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 12px/16px var(--font); color: var(--muted); background: transparent; border: 0; cursor: pointer; }
  nav.bottom .pill { width: 60px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
  nav.bottom .on { color: var(--text); }
  nav.bottom .on .pill { background: var(--sec); }
</style>
</head>
<body>
<p class="note" id="note"></p>
<div class="phone" id="phone"></div>

<script>
// Mockup only: invented data, simulated live updates. Icons drawn after Lucide (ISC).
const ICON = {
  refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/>',
  key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M19 4l2 2"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  hammer: '<path d="m15 12-8.4 8.4a2.1 2.1 0 0 1-3-3L12 9"/><path d="M17.6 15 22 10.6 13.4 2 9 6.4z"/>',
  book: '<path d="M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  branch: '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5a6 6 0 0 1-6 6H8.5"/>',
  message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>',
  rocket: '<path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2.1-.1-2.9a2.2 2.2 0 0 0-2.9-.1z"/><path d="M12 15l-3-3a22 22 0 0 1 2-4A13 13 0 0 1 22 2c0 2.7-.8 7.5-6 11a22 22 0 0 1-4 2z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  status: '<rect x="3" y="3" width="8" height="10" rx="1"/><rect x="13" y="3" width="8" height="6" rx="1"/><rect x="13" y="11" width="8" height="10" rx="1"/><rect x="3" y="15" width="8" height="6" rx="1"/>',
  layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
  check: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  more: '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  cloud: '<path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 12 3.5 3.5 0 0 0 6 19z"/>',
  server: '<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>',
  cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
};
const svg = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

function walk(n, base, spiky) {
  const out = []; let v = base;
  for (let i = 0; i < n; i++) {
    v = Math.max(0, base + (v - base) * 0.7 + (Math.random() - 0.5) * base * 0.5);
    out.push(spiky && base === 0 ? (Math.random() < 0.03 ? 0.01 : 0) : v);
  }
  return out;
}
const level = (s) => s === "Ready" ? "ok" : s === "Degraded" ? "bad" : "warn";
const color = (l) => ({ ok: "#4ade80", warn: "#fbbf24", bad: "#f87171" })[l];
const fmtRate = (r) => r < 0.1 ? `${(r * 60).toFixed(1)}/min` : `${r.toFixed(r < 10 ? 2 : 0)}/s`;
const fmtErr = (e) => `${(e * 100).toFixed(e && e < 0.01 ? 1 : 0)}%`;
const fmtLat = (s) => s < 1 ? `${Math.round(s * 1000)}ms` : `${s.toFixed(1)}s`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function spark(values, stroke) {
  const max = Math.max(...values, 1e-9), w = 100, h = 28;
  const pts = values.map((v, i) => `${(i / (values.length - 1) * w).toFixed(1)},${(h - 2 - v / max * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="M0,${h} L${pts.replaceAll(" ", " L")} L${w},${h}Z" fill="${stroke}"/><polyline points="${pts}" stroke="${stroke}"/></svg>`;
}
function pods(name, status, n = 2) {
  const id = () => Math.random().toString(36).slice(2, 7), rs = `${name}-${Math.random().toString(36).slice(2, 12)}`;
  if (status === "Degraded") return [
    { name: `${rs}-${id()}`, ready: false, phase: "CrashLoopBackOff", restarts: 7, last: "Error · exit 1 · 20:24", node: "node-a", age: "38m" },
    { name: `${rs}-${id()}`, ready: true, phase: "Running", restarts: 2, last: "OOMKilled · 19:51", node: "node-b", age: "38m" }];
  if (status === "Progressing") return [
    { name: `${rs}-${id()}`, ready: true, phase: "Running", restarts: 0, node: "node-b", age: "2m" },
    { name: `${rs}-${id()}`, ready: false, phase: "ContainerCreating", restarts: 0, node: "node-c", age: "30s" }];
  return Array.from({ length: n }, (_, i) => ({ name: `${rs}-${id()}`, ready: true, phase: "Running", restarts: 0, node: `node-${"abc"[i % 3]}`, age: `${2 + i}d` }));
}

// Workloads: name, icon, status, rate req/s (null: no route at the edge), 5xx ratio, p95 s, cpu m, mem Mi, reason
const W = (rows) => rows.map(([name, icon, status, rate, err, p95, cpu, mem, reason, version]) => ({
  name, icon, status, rate, err, p95, reason, version: version || "1.4.2",
  series: rate == null ? null : walk(60, rate), errs: rate == null ? null : walk(60, err, true), lat: rate == null ? null : walk(60, p95),
  cpuS: walk(60, cpu), memS: walk(60, mem), cpuReq: 100, cpuLim: 500, memReq: 256, memLim: 512, pods: pods(name, status, rate == null ? 1 : 2) }));

// Environments: the developer's view; health is what decides "my app or the environment?"
const ENVS = [
  { name: "shop-dev", owner: "project/shop", nereid: "vcluster", status: "Ready", k8s: "1.31.4", latest: "1.32.1", expires: null,
    nodes: [3, 3], cpu: 0.41, mem: 0.63, pending: 0, icon: "layers",
    workloads: W([
      ["checkout", "cart", "Degraded", 4.2, 0.08, 1.4, 180, 470, "CrashLoopBackOff: 1 of 2 pods ready"],
      ["payments", "card", "Progressing", 1.1, 0.0, 0.32, 60, 210, "Rolling out 2.0.1: 1 of 2 pods ready", "2.0.1"],
      ["storefront", "globe", "Ready", 18.4, 0.002, 0.12, 90, 180],
      ["catalog-api", "book", "Ready", 9.7, 0, 0.05, 40, 150],
      ["search", "search", "Ready", 3.3, 0, 0.21, 120, 380],
      ["cart-cache", "database", "Ready", null, 0, 0, 20, 90],
      ["order-worker", "cog", "Ready", null, 0, 0, 35, 120],
    ]) },
  { name: "pr-2291", owner: "project/shop", nereid: "vcluster", status: "Progressing", k8s: "1.32.1", latest: "1.32.1", expires: "2d",
    nodes: [3, 3], cpu: 0.88, mem: 0.71, pending: 2, icon: "branch", pressure: "CPU requests at 88% of capacity: 2 pods wait to be scheduled",
    workloads: W([
      ["storefront", "globe", "Progressing", 0.4, 0, 0.18, 70, 170, "2 pods pending: insufficient CPU"],
      ["checkout", "cart", "Ready", 0.2, 0, 0.3, 50, 200],
    ]) },

// ----- shared pieces -----
function matches(text) { return !S.q || text.toLowerCase().includes(S.q.toLowerCase()); }
function hl(text) {
  if (!S.q) return esc(text);
  const i = text.toLowerCase().indexOf(S.q.toLowerCase());
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + S.q.length)) + "</mark>" + esc(text.slice(i + S.q.length));
}
function toolbar(placeholder, withView = true) {
  const chip = (id, label) => `<button class="chip-f" data-filter="${id}" aria-pressed="${S.filter === id}">${label}</button>`;
  const other = S.view === "list" ? ["grid", "Grid view"] : ["list", "List view"];
  return `<div class="toolbar ${S.searchOpen ? "open" : ""} ${S.q ? "filtered" : ""}" id="toolbar">
    <div class="chips">${chip("all", "All")}${chip("attn", "Attention")}${chip("ok", "Ready")}</div>
    <div class="search" role="search">
      <button data-search aria-label="Search by name" title="Search by name">${svg("search")}</button>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="${placeholder}" aria-label="${placeholder}" value="${esc(S.q)}" tabindex="${S.searchOpen ? 0 : -1}">
      <button class="clear" data-clear aria-label="Clear">${svg("x")}</button>
    </div>
    ${withView ? `<button class="viewtoggle" data-view="${other[0]}" aria-label="${other[1]}" title="${other[1]}">${svg(other[0])}</button>` : ""}
  </div>`;
}
function qline(shown, total, noun) {

}
const byFilter = (s) => S.filter === "all" || (S.filter === "attn" ? s !== "Ready" : s === "Ready");
function bottomNav() {
  const b = (id, icon, label) => `<button data-tab="${id}" class="${S.tab === id ? "on" : ""}"><span class="pill">${svg(icon)}</span>${label}</button>`;

}
function meter(v, warnAt = 0.7, badAt = 0.85) {

    <div class="hgrid">

      ${cell("CPU requested", `${Math.round(e.cpu * 100)}% <span class="nm">of capacity</span>`, meter(e.cpu))}
      ${cell("Memory requested", `${Math.round(e.mem * 100)}% <span class="nm">of capacity</span>`, meter(e.mem))}

  </div>`;
}

      ${l !== "ok" ? `<div class="reason ${l}">${w.status}</div>` : ""}

      ${sparkOf(w, l)}</div>`; };
    return qline(list.length, e.workloads.length, "workloads") + `<div class="grid">${sorted.map(tile).join("")}</div>`;
  }
  const row = (w) => { const l = level(w.status); return `<div class="row" data-wl="${w.name}"><span class="ic">${svg(w.icon)}</span>

    ${l !== "ok" ? `<span class="t3 ${l}">${w.reason}</span>` : ""}
    <span class="t2">${sig(w)}</span>${sparkOf(w, l)}</span></div>`; };
  const attn = list.filter((w) => w.status !== "Ready"), good = list.filter((w) => w.status === "Ready");

function envScreen(e) {

// ----- One Workload -----
function wlScreen(e, w) {
  const l = level(w.status);
  const sig = (label, val, unit, series, c, hint) => `<div class="sig"><div class="lbl"><span>${label}</span><span>${hint}</span></div><div class="val">${val}<small>${unit}</small></div>${spark(series, c)}</div>`;
  const missing = (label, why) => `<div class="sig missing"><div class="lbl"><span>${label}</span></div><div class="val">${why}</div></div>`;
  const restarts = w.pods.reduce((a, p) => a + p.restarts, 0);
  const m = (label, v, req, lim, u) => { const pct = Math.min(100, v / lim * 100), c = pct > 80 ? "#f87171" : pct > 60 ? "#fbbf24" : "#4ade80";
    return `<div class="meter-legend"><span style="color:var(--text);font-family:var(--font);font-size:12px">${label}</span><span>${Math.round(v)}${u} of ${lim}${u} limit</span></div>
    <div class="meter"><i style="width:${pct}%;background:${c}"></i><b style="left:${req / lim * 100}%"></b></div>
    <div class="meter-legend"><span>0</span><span>▲ request ${req}${u}</span><span>${lim}${u}</span></div>`; };
  let red;
  if (w.series) {
    const rate = fmtRate(w.series.at(-1)).match(/([\d.]+)(.*)/), lat = fmtLat(w.lat.at(-1)).match(/([\d.]+)(.*)/), errV = w.errs.at(-1);
    red = `${sig("Requests", rate[1], rate[2], w.series, "#9d97ea", "at the edge")}
      ${sig("Errors", (errV * 100).toFixed(errV && errV < 0.01 ? 1 : 0), "%", w.errs, errV ? "#f87171" : "#4ade80", "5xx")}
      ${sig("Latency", lat[1], lat[2], w.lat, "#7cc4ff", "p95")}
      ${sig("Saturation", Math.round(w.cpuS.at(-1) / w.cpuLim * 100), "%", w.cpuS, w.cpuS.at(-1) > w.cpuLim * 0.8 ? "#fbbf24" : "#4ade80", "of limit")}`;
  } else {
    red = `${missing("Requests", "No route at the edge: this workload takes no HTTP traffic")}${sig("Saturation", Math.round(w.cpuS.at(-1) / w.cpuLim * 100), "%", w.cpuS, "#4ade80", "of limit")}`;
  }
  return `<div class="topbar"><button class="iconbtn" data-back aria-label="Back">${svg("back")}</button><span style="flex:1"></span><button class="iconbtn" aria-label="More">${svg("more")}</button></div>
  <div class="scroll" style="padding-top:0">
    <div class="hero"><span class="ic">${svg(w.icon)}</span><div style="flex:1;min-width:0"><h2>${w.name}</h2><div class="nm">Workload in <b style="color:var(--text)">${e.name}</b> · ${w.version}</div></div><span class="badge ${l} ${l}">${w.status}</span></div>
    ${l !== "ok" ? `<div class="card ${l}" style="padding:10px 14px;margin:0 0 10px;background:var(--${l}-bg)">${w.reason}</div>` : ""}
    ${e.status !== "Ready" ? `<div class="card warn" style="padding:10px 14px;margin:0 0 10px;background:var(--warn-bg)">The environment is under pressure: ${e.pressure}</div>` : ""}
    <div class="seg" role="group" aria-label="Range">${["5m", "1h", "24h", "7d"].map((r) => `<button data-range="${r}" aria-pressed="${S.range === r}">${r}</button>`).join("")}</div>
    <div class="signals">${red}</div>
    <div class="section-label">Pods · ${w.pods.filter((p) => p.ready).length}/${w.pods.length} ready</div>
    <div class="signals">
      ${sig("CPU", Math.round(w.cpuS.at(-1)), "m", w.cpuS, "#7cc4ff", `req ${w.cpuReq}m`)}
      ${sig("Memory", Math.round(w.memS.at(-1)), "MiB", w.memS, w.memS.at(-1) > w.memLim * 0.8 ? "#f87171" : "#7cc4ff", `lim ${w.memLim}Mi`)}
    </div>
    <div class="card" style="padding:12px 14px">${m("CPU", w.cpuS.at(-1), w.cpuReq, w.cpuLim, "m")}<div style="height:10px"></div>${m("Memory", w.memS.at(-1), w.memReq, w.memLim, "Mi")}</div>
    <div class="card"><div class="kv"><span>Restarts · 24h</span><span class="${restarts ? "bad" : ""}">${restarts}</span></div></div>
    <div class="card">${w.pods.map((p) => `<div class="pod"><div class="p1"><span>${p.name}</span><span class="${p.ready ? "ok" : "bad"}">${p.ready ? "Ready" : p.phase}</span></div>
      <div class="p2">${p.node} · ${p.age} · ${p.restarts} restarts${p.last ? ` · <span class="bad">last ${p.last}</span>` : ""}</div></div>`).join("")}</div>
  </div>
  <div class="livebar"><span class="live"><span class="pulse"></span>Live · every 2 s</span><span id="tick">updated 20:29:00</span></div>`;
}

// ----- render -----
const curEnv = () => ENVS.find((e) => e.name === S.env);
function results() {
  if (S.tab === "nereids") return nereidsResults();
  return S.env ? envResults(curEnv()) : envsResults();
}
function refreshResults() { document.getElementById("results").innerHTML = results(); document.getElementById("toolbar").classList.toggle("filtered", !!S.q); }
function render() {
  clearInterval(timer);
  const phone = document.getElementById("phone"), note = document.getElementById("note");
  if (S.tab === "approvals") { phone.innerHTML = `<div class="scroll"><div class="appbar"><h1>Approvals</h1><p>#2222, not part of this design</p></div></div>${bottomNav()}`; note.textContent = ""; return; }

  else if (S.workload) {
    const e = curEnv(), w = e.workloads.find((x) => x.name === S.workload);
    phone.innerHTML = wlScreen(e, w); note.textContent = NOTES.wl;
    let s = 0;
    timer = setInterval(() => {
      for (const [k, base] of [["series", w.rate], ["errs", w.err], ["lat", w.p95], ["cpuS", w.cpuS[0]], ["memS", w.memS[0]]]) {
        if (!w[k]) continue; w[k].shift(); w[k].push(walk(3, base, k === "errs").at(-1));
      }
      const top = phone.querySelector(".scroll").scrollTop;
      phone.innerHTML = wlScreen(e, w); phone.querySelector(".scroll").scrollTop = top;
      s += 2; document.getElementById("tick").textContent = `updated 20:29:${String(s % 60).padStart(2, "0")}`;
    }, 2000);
  } else if (S.env) { phone.innerHTML = envScreen(curEnv()); note.textContent = NOTES.env; }
  else { phone.innerHTML = envsScreen(); note.textContent = NOTES.envs; }
  if (S.searchOpen) { const q = document.getElementById("q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}
function resetList() { S.q = ""; S.searchOpen = false; S.filter = "all"; }

document.addEventListener("input", (ev) => { if (ev.target.id === "q") { S.q = ev.target.value.trim() ? ev.target.value : ""; refreshResults(); } });
