deck:
  name: walkthrough-get-started
  title: "Get started"
  subtitle: "From no cluster to a reef added at runtime, and a Nereid that adds its own commands to the CLI"
  accent: "a reef added at runtime"
  pt:
    title: "Começar"
    subtitle: "De nenhum cluster a um reef adicionado em runtime, e uma Nereid que acrescenta os seus próprios comandos ao CLI"
    accent: "um reef adicionado em runtime"

acts:
  - name: opening
    title: "Opening"
    pt: {title: "Abertura"}
  - name: before
    title: "Before you start"
    pt: {title: "Antes de começar"}
  - name: cluster
    title: "The cluster"
    question: "How does a laptop become a Nereus instance?"
    pt: {title: "O cluster", question: "Como um laptop vira uma instância do Nereus?"}
  - name: reef
    title: "A reef at runtime"
    question: "How does a capability arrive after init?"
    pt: {title: "Um reef em runtime", question: "Como uma capacidade chega depois do init?"}
  - name: cloud
    title: "The cloud"
    question: "What changes when the cluster reaches a cloud?"
    pt: {title: "A nuvem", question: "O que muda quando o cluster alcança uma nuvem?"}
  - name: end
    title: "The end"
    question: "How do you see it, break it and remove it?"
    pt: {title: "O fim", question: "Como você o vê, o quebra e o remove?"}

slides:
  - name: cover
    act: opening
    cover: true
    message: "Get started"
    notes: |-
      **You end with a local cluster prepared by `nereus init`, a reef added at runtime and a Nereid that adds its own commands to the CLI**, then a cloud the cluster reaches with no secret of its own. For whoever tries Nereus for the first time, on a laptop: specs 0001 to 0004 (the first slice, a reef at runtime, Nereid conformance, the time SLO of init).

      **Status: built.** Every step links to its command in the [core deck](../../specs/cli/core.html); `make scene` runs them all on a throwaway cluster. The cloud steps are recorded against fakes.
    pt:
      message: "Começar"
      notes: |-
        **Você termina com um cluster local preparado pelo `nereus init`, um reef adicionado em runtime e uma Nereid que acrescenta os seus próprios comandos ao CLI**, depois uma nuvem que o cluster alcança sem nenhum secret próprio. Para quem experimenta o Nereus pela primeira vez, num laptop: as specs 0001 a 0004 (a primeira fatia, um reef em runtime, a conformidade das Nereids, o SLO de tempo do init).

        **Status: pronto.** Cada passo aponta para o seu comando no [deck do core](../../specs/cli/core.html); o `make scene` roda todos eles num cluster descartável. Os passos da nuvem são gravados contra fakes.

  - name: prerequisites
    act: before
    message: "Five tools and a clone, then the CLI"
    accent: "then the CLI"
    screen:
      - "**The tools:** `docker`, `k3d`, `kubectl`, `uv` and `make`"
      - "**The clone:** `git clone https://github.com/getnereus/nereus.git`, then `make cli` puts `nereus` and `nrs` on the PATH"
      - "**1 · Install the CLI:** its command groups, before any reef · [`nereus --help`](../../specs/cli/core.html#groups) · built"
    notes: |-
      **`make cli` installs the CLI editable from the checkout**, so a change in `cli/` takes effect at the next run; `nereus --install-completion` turns on Tab completion for both names ([Install the CLI](../../start/install.md)). `make scene` runs every step that follows on a throwaway cluster, leaving your config alone.
    pt:
      message: "Cinco ferramentas e um clone, depois o CLI"
      accent: "depois o CLI"
      screen:
        - "**As ferramentas:** `docker`, `k3d`, `kubectl`, `uv` e `make`"
        - "**O clone:** `git clone https://github.com/getnereus/nereus.git`, depois o `make cli` põe `nereus` e `nrs` no PATH"
        - "**1 · Instalar o CLI:** os seus grupos de comandos, antes de qualquer reef · [`nereus --help`](../../specs/cli/core.html#groups) · pronto"
      notes: |-
        **O `make cli` instala o CLI editável a partir do checkout**, então uma mudança em `cli/` vale na próxima execução; o `nereus --install-completion` liga o completar com Tab para os dois nomes ([Instalar o CLI](../../start/install.md)). O `make scene` roda todos os passos seguintes num cluster descartável, sem tocar na sua configuração.

  - name: settings
    act: cluster
    topic: "the settings"
    message: "Write the settings of init once, and read them back"
    accent: "once"
    screen:
      - "**2 · Write the settings:** the `InitConfig` and the `Installation`, and nothing is created · [`nereus init --generate-file`](../../specs/cli/core.html#init-generate-file) · built"
      - "**3 · See the settings:** each value and where it came from · [`nereus init --dry-run`](../../specs/cli/core.html#init-dry-run) · built"
    notes: |-
      **A plain `nereus init` reads the file `~/.config/nereus/init.yaml`;** a flag wins over it, and an unknown key is an error. `profile` and `ingressPort` live there too ([Write the settings](../../start/settings.md), [See the settings](../../start/settings.md)).
    pt:
      topic: "as configurações"
      message: "Escreva as configurações do init uma vez, e leia-as de volta"
      accent: "uma vez"
      screen:
        - "**2 · Escrever as configurações:** o `InitConfig` e a `Installation`, e nada é criado · [`nereus init --generate-file`](../../specs/cli/core.html#init-generate-file) · pronto"
        - "**3 · Ver as configurações:** cada valor e de onde ele veio · [`nereus init --dry-run`](../../specs/cli/core.html#init-dry-run) · pronto"
      notes: |-
        **Um `nereus init` simples lê o arquivo `~/.config/nereus/init.yaml`;** uma flag ganha dele, e uma chave desconhecida é um erro. O `profile` e o `ingressPort` também vivem ali ([Escrever as configurações](../../start/settings.md), [Ver as configurações](../../start/settings.md)).

  - name: init
    act: cluster
    topic: "init"
    message: "Prepare the cluster: core, then a profile"
    accent: "then a profile"
    screen:
      - "**4 · Prepare the cluster:** core in two Helm releases, then thetis installs the profile · [`nereus init --profile internal-developer-platform`](../../specs/cli/core.html#init-profile) · built"
      - "**Check it worked:** one row per reef and its Nereid · [`nereus status`](../../specs/cli/core.html#status) · built"
    notes: |-
      **`make nereids` builds and pushes the Nereids' images first.** With this profile the instance offers sign-in, so log in right after: [`nereus login`](../../specs/cli/reefs/authentication.html#login). Profiles are listed, described and applied from the laptop too: [`profile list`](../../specs/cli/core.html#profile-list), [`profile describe`](../../specs/cli/core.html#profile-describe), [`profile apply`](../../specs/cli/core.html#profile-apply). Run it again and it reuses everything, in seconds ([`nereus init`](../../specs/cli/core.html#init); [Prepare the cluster](../../reference/init.md)).
    pt:
      topic: "init"
      message: "Prepare o cluster: o core, depois um profile"
      accent: "depois um profile"
      screen:
        - "**4 · Preparar o cluster:** o core em duas releases do Helm, depois o thetis instala o profile · [`nereus init --profile internal-developer-platform`](../../specs/cli/core.html#init-profile) · pronto"
        - "**Conferir:** uma linha por reef e a sua Nereid · [`nereus status`](../../specs/cli/core.html#status) · pronto"
      notes: |-
        **O `make nereids` constrói e publica as imagens das Nereids primeiro.** Com este profile a instância oferece login, então entre logo depois: [`nereus login`](../../specs/cli/reefs/authentication.html#login). Os profiles também são listados, descritos e aplicados do laptop: [`profile list`](../../specs/cli/core.html#profile-list), [`profile describe`](../../specs/cli/core.html#profile-describe), [`profile apply`](../../specs/cli/core.html#profile-apply). Rode de novo e ele reusa tudo, em segundos ([`nereus init`](../../specs/cli/core.html#init); [Preparar o cluster](../../reference/init.md)).

  - name: slo
    act: cluster
    topic: "the time SLO"
    message: "init is measured against a time objective"
    accent: "a time objective"
    screen:
      - "**5 · See the SLO:** 8 minutes on k3d, and the colour bands · [`nereus config slo show`](../../specs/cli/core.html#slo-show) · built"
      - "**Change some values:** the rest keep their defaults · [`nereus config slo set`](../../specs/cli/core.html#slo-set) · built"
      - "**Back to the defaults** · [`nereus config slo reset`](../../specs/cli/core.html#slo-reset) · built"
    notes: |-
      **The next `init` reads the values in its last step**, and its clock changes colour at each band; missing the objective never stops `init`, `--check-slo` fails past the tolerance (spec 0004, [The time SLO](../../guides/operate/slo.md)).
    pt:
      topic: "o SLO de tempo"
      message: "O init é medido contra um objetivo de tempo"
      accent: "um objetivo de tempo"
      screen:
        - "**5 · Ver o SLO:** 8 minutos no k3d, e as faixas de cor · [`nereus config slo show`](../../specs/cli/core.html#slo-show) · pronto"
        - "**Mudar alguns valores:** os outros mantêm os seus padrões · [`nereus config slo set`](../../specs/cli/core.html#slo-set) · pronto"
        - "**De volta aos padrões** · [`nereus config slo reset`](../../specs/cli/core.html#slo-reset) · pronto"
      notes: |-
        **O próximo `init` lê os valores no seu último passo**, e o seu relógio muda de cor a cada faixa; perder o objetivo nunca para o `init`, o `--check-slo` falha depois da tolerância (spec 0004, [O SLO de tempo](../../guides/operate/slo.md)).

  - name: installation
    act: cluster
    topic: "the installation"
    message: "Every installation has a name, an id and an alias"
    accent: "a name, an id and an alias"
    screen:
      - "**6 · See the installation:** the name and the id never change · [`nereus config installation show`](../../specs/cli/core.html#installation-show) · built"
      - "**Change the alias or a naming override** · [`nereus config installation set`](../../specs/cli/core.html#installation-set) · built"
    notes: |-
      **The settings file holds the id too**, so a cluster recreated from it is the same installation; another `--installation-name` on a second `init` is not a rename, and its line says so (spec 0006, [The installation](../../reference/installation.md)).
    pt:
      topic: "a instalação"
      message: "Toda instalação tem um nome, um id e um alias"
      accent: "um nome, um id e um alias"
      screen:
        - "**6 · Ver a instalação:** o nome e o id nunca mudam · [`nereus config installation show`](../../specs/cli/core.html#installation-show) · pronto"
        - "**Mudar o alias ou um naming override** · [`nereus config installation set`](../../specs/cli/core.html#installation-set) · pronto"
      notes: |-
        **O arquivo de configurações também guarda o id**, então um cluster recriado a partir dele é a mesma instalação; outro `--installation-name` num segundo `init` não é uma renomeação, e a sua linha diz isso (spec 0006, [A instalação](../../reference/installation.md)).

  - name: empty
    act: reef
    topic: "no Nereids yet"
    message: "Before any {nereid:Nereid}, the CLI has only its own commands"
    accent: "only its own commands"
    screen:
      - "**7 · No Nereids yet:** the list prints `No nereids added.` · [`nereus nereid list`](../../specs/cli/core.html#nereid-list) · built"
      - "**8 · Build the reference Nereid:** `make reference` builds its image and pushes it to the local registry"
    notes: |-
      **The image declares in labels the reef it fulfils, the reefs it requires, its name and version**, and its commands are data, in `commands.yaml` ([No Nereids yet](../../start/look-around.md), [Build the reference Nereid](../../guides/build/image.md)). A new Nereid of your own starts from `scripts/nereid/new --reef <reef> --tool <tool>` ([Start a new Nereid](../../guides/build/new-nereid.md)).
    pt:
      topic: "nenhuma Nereid ainda"
      message: "Antes de qualquer {nereid:Nereid}, o CLI tem só os seus comandos"
      accent: "só os seus comandos"
      screen:
        - "**7 · Nenhuma Nereid ainda:** a lista imprime `No nereids added.` · [`nereus nereid list`](../../specs/cli/core.html#nereid-list) · pronto"
        - "**8 · Construir a Nereid de referência:** o `make reference` constrói a sua imagem e a publica no registry local"
      notes: |-
        **A imagem declara em labels o reef que cumpre, os reefs que exige, o seu nome e a sua versão**, e os seus comandos são dados, em `commands.yaml` ([Nenhuma Nereid ainda](../../start/look-around.md), [Construir a Nereid de referência](../../guides/build/image.md)). Uma Nereid nova sua começa do `scripts/nereid/new --reef <reef> --tool <tool>` ([Começar uma Nereid nova](../../guides/build/new-nereid.md)).

  - name: reef
    act: reef
    topic: "the reef"
    message: "First the {reef:release} reef, then the {nereid:Nereid} that serves it"
    accent: "then the {nereid:Nereid}"
    screen:
      - "**9 · Apply the reef:** its kinds, and a `release` group in the CLI · [`nereus reef apply release`](../../specs/cli/core.html#reef-apply) · built"
      - "**10 · Apply the Nereid:** pinned to its image's digest, and `Ready` · [`nereus nereid apply reference-release`](../../specs/cli/core.html#nereid-apply) · built"
      - "**Check it worked:** the reef with its Nereid · [`nereus reef list`](../../specs/cli/core.html#reef-list) · built"
    notes: |-
      **A Nereid needs its reef first:** without it, `nereid apply` is refused and names `nereus reef apply release`. `reef create` fails on a reef that exists ([reef create](../../specs/cli/core.html#reef-create)); `--from-file` applies local YAML ([reef apply --from-file](../../specs/cli/core.html#reef-apply-file)); another image updates the Nereid in place ([nereid apply --image](../../specs/cli/core.html#nereid-apply-image)) ([Apply the reef](../../reference/reefs-and-nereids.md), [Apply the Nereid](../../reference/reefs-and-nereids.md)).
    pt:
      topic: "o reef"
      message: "Primeiro o reef {reef:release}, depois a {nereid:Nereid} que o serve"
      accent: "depois a {nereid:Nereid}"
      screen:
        - "**9 · Aplicar o reef:** os seus kinds, e um grupo `release` no CLI · [`nereus reef apply release`](../../specs/cli/core.html#reef-apply) · pronto"
        - "**10 · Aplicar a Nereid:** fixada no digest da sua imagem, e `Ready` · [`nereus nereid apply reference-release`](../../specs/cli/core.html#nereid-apply) · pronto"
        - "**Conferir:** o reef com a sua Nereid · [`nereus reef list`](../../specs/cli/core.html#reef-list) · pronto"
      notes: |-
        **Uma Nereid precisa do seu reef primeiro:** sem ele, o `nereid apply` é recusado e nomeia o `nereus reef apply release`. O `reef create` falha num reef que existe ([reef create](../../specs/cli/core.html#reef-create)); o `--from-file` aplica YAML local ([reef apply --from-file](../../specs/cli/core.html#reef-apply-file)); outra imagem atualiza a Nereid no lugar ([nereid apply --image](../../specs/cli/core.html#nereid-apply-image)) ([Aplicar o reef](../../reference/reefs-and-nereids.md), [Aplicar a Nereid](../../reference/reefs-and-nereids.md)).

  - name: commands
    act: reef
    topic: "its commands"
    message: "The {nereid:Nereid} filled the group with its own commands"
    accent: "its own commands"
    screen:
      - "**11 · Its commands:** `nereus release --help` lists what the Nereid published, with no code downloaded"
      - "**12 · Run its commands:** `nereus release repo add` and `repo list` go to the Nereid's controller, which runs them"
    notes: |-
      **These commands are not in the CLI reference on purpose:** the reference Nereid publishes them at runtime (ADR 0004, reefs extend the CLI), and the CLI builds them from that description. The group is named after the reef, not the Nereid ([Its commands](../../start/run.md), [Run its commands](../../start/run.md)).
    pt:
      topic: "os seus comandos"
      message: "A {nereid:Nereid} encheu o grupo com os seus próprios comandos"
      accent: "os seus próprios comandos"
      screen:
        - "**11 · Os seus comandos:** o `nereus release --help` lista o que a Nereid publicou, sem baixar código"
        - "**12 · Rodar os seus comandos:** o `nereus release repo add` e o `repo list` vão ao controller da Nereid, que os roda"
      notes: |-
        **Estes comandos não estão na referência do CLI de propósito:** a Nereid de referência os publica em runtime (ADR 0004, os reefs estendem o CLI), e o CLI os constrói a partir dessa descrição. O grupo leva o nome do reef, não da Nereid ([Os seus comandos](../../start/run.md), [Rodar os seus comandos](../../start/run.md)).

  - name: requires
    act: reef
    topic: "requires"
    message: "A {nereid:Nereid} requires reefs, never Nereids"
    accent: "never Nereids"
    screen:
      - "**13 · Require a reef:** a `docs` reef and its Nereid, which requires `release` · [`nereus nereid apply reference-docs`](../../specs/cli/core.html#nereid-apply) · built"
      - "**The last Nereid of a required reef stays** while another requires it · [`nereus nereid delete`](../../specs/cli/core.html#nereid-delete) · built"
    notes: |-
      **The requirement is the image label `core.getnereus.dev/requires`**, recorded in `spec.requires`; an apply whose required reef has no Nereid is refused, and one whose Nereid is not `Ready` warns but goes ahead (spec 0003, [Require a reef](../../guides/build/requires.md)).
    pt:
      topic: "requires"
      message: "Uma {nereid:Nereid} exige reefs, nunca Nereids"
      accent: "nunca Nereids"
      screen:
        - "**13 · Exigir um reef:** um reef `docs` e a sua Nereid, que exige o `release` · [`nereus nereid apply reference-docs`](../../specs/cli/core.html#nereid-apply) · pronto"
        - "**A última Nereid de um reef exigido fica** enquanto outra o exige · [`nereus nereid delete`](../../specs/cli/core.html#nereid-delete) · pronto"
      notes: |-
        **A exigência é a label de imagem `core.getnereus.dev/requires`**, gravada em `spec.requires`; um apply cujo reef exigido não tem Nereid é recusado, e um cuja Nereid não está `Ready` avisa mas segue (spec 0003, [Exigir um reef](../../guides/build/requires.md)).

  - name: undercloud
    act: cloud
    topic: "the undercloud"
    message: "An undercloud whose tokens the cloud trusts"
    accent: "the cloud trusts"
    screen:
      - "**14 · Prepare the undercloud:** the plan for Azure, and nothing runs there · [`nereus init --dry-run`](../../specs/cli/core.html#init-target) · built"
      - "**Approve the plan:** each request with its time, then the token exchange · [`nereus init --approve-access`](../../specs/cli/core.html#init-approve-access) · built"
      - "**15 · When a name is taken:** record another for it · [`nereus config installation set --naming-override`](../../specs/cli/core.html#installation-set) · built"
    notes: |-
      **The issuer is computed from the installation's id before the cluster exists**, so the cloud trusts the undercloud's tokens with no secret; every request to Azure goes through the `azure` Nereid's plans (spec 0005, [Prepare the undercloud](../../guides/operate/undercloud.md), [When a name is taken](../../guides/troubleshoot/name-taken.md)). Recorded against fakes; [Connect to the cloud](../../guides/operate/cloud.md) is a goal of its own.
    pt:
      topic: "o undercloud"
      message: "Um undercloud em cujos tokens a nuvem confia"
      accent: "a nuvem confia"
      screen:
        - "**14 · Preparar o undercloud:** o plano para a Azure, e nada roda lá · [`nereus init --dry-run`](../../specs/cli/core.html#init-target) · pronto"
        - "**Aprovar o plano:** cada requisição com o seu tempo, depois a troca de token · [`nereus init --approve-access`](../../specs/cli/core.html#init-approve-access) · pronto"
        - "**15 · Quando um nome está tomado:** registre outro para ele · [`nereus config installation set --naming-override`](../../specs/cli/core.html#installation-set) · pronto"
      notes: |-
        **O issuer é calculado a partir do id da instalação antes de o cluster existir**, então a nuvem confia nos tokens do undercloud sem nenhum secret; toda requisição à Azure passa pelos planos da Nereid `azure` (spec 0005, [Preparar o undercloud](../../guides/operate/undercloud.md), [Quando um nome está tomado](../../guides/troubleshoot/name-taken.md)). Gravado contra fakes; [Conectar à nuvem](../../guides/operate/cloud.md) é um objetivo próprio.

  - name: access
    act: cloud
    topic: "access"
    message: "A {nereid:Nereid} asks for access, and you grant it"
    accent: "you grant it"
    screen:
      - "**16 · Grant access:** a Nereid that requires `cloud` acts as its reef's identity, with no secret · [`nereus nereid apply keyvault`](../../specs/cli/core.html#nereid-apply) · built"
      - "**See what is asked, then approve:** `nereus system access list` and `nereus system access approve --all`, the legacy commands"
    notes: |-
      **`nereus system` stays out of the CLI reference** (the deprecated aliases of the first proof of concept, #409), so the page shows these two as they run today; a failed plan undoes none of the others, and running it again applies only what is missing ([Grant access](../../guides/access/grant-access.md)). Recorded against fakes.
    pt:
      topic: "acesso"
      message: "Uma {nereid:Nereid} pede acesso, e você o concede"
      accent: "você o concede"
      screen:
        - "**16 · Conceder acesso:** uma Nereid que exige `cloud` age como a identidade do seu reef, sem nenhum secret · [`nereus nereid apply keyvault`](../../specs/cli/core.html#nereid-apply) · pronto"
        - "**Ver o que é pedido, depois aprovar:** `nereus system access list` e `nereus system access approve --all`, os comandos legados"
      notes: |-
        **O `nereus system` fica fora da referência do CLI** (os aliases obsoletos da primeira prova de conceito, #409), então a página mostra estes dois como rodam hoje; um plano que falha não desfaz nenhum dos outros, e rodar de novo aplica só o que falta ([Conceder acesso](../../guides/access/grant-access.md)). Gravado contra fakes.

  - name: chaos
    act: end
    topic: "chaos"
    message: "When the {nereid:Nereid} stops, the CLI says why"
    accent: "says why"
    screen:
      - "**17 · When the Nereid stops:** scaled to zero, its commands send nothing and exit non-zero, and the list says `Unavailable` · [`nereus nereid list`](../../specs/cli/core.html#nereid-list) · built"
      - "**18 · Under the hood:** `kubectl get reefs` and `kubectl get nereids`, the objects the CLI wrote"
    notes: |-
      **Its Deployment brings a deleted pod back**, and scaling up makes the commands work again by themselves ([When the Nereid stops](../../guides/troubleshoot/nereid-stops.md)). One writer per field (ADR 0005): the CLI writes the spec, the controller writes `status.conditions` and `status.commands` ([Under the hood](../../reference/reefs-and-nereids.md)).
    pt:
      topic: "caos"
      message: "Quando a {nereid:Nereid} para, o CLI diz por quê"
      accent: "diz por quê"
      screen:
        - "**17 · Quando a Nereid para:** escalada para zero, os seus comandos não enviam nada e saem com erro, e a lista diz `Unavailable` · [`nereus nereid list`](../../specs/cli/core.html#nereid-list) · pronto"
        - "**18 · Por baixo dos panos:** `kubectl get reefs` e `kubectl get nereids`, os objetos que o CLI escreveu"
      notes: |-
        **O seu Deployment traz de volta um pod apagado**, e escalar para cima faz os comandos voltarem a funcionar sozinhos ([Quando a Nereid para](../../guides/troubleshoot/nereid-stops.md)). Um escritor por campo (ADR 0005): o CLI escreve o spec, o controller escreve `status.conditions` e `status.commands` ([Por baixo dos panos](../../reference/reefs-and-nereids.md)).

  - name: delete
    act: end
    topic: "delete"
    message: "The {nereid:Nereid} first, then its reef, then the cluster"
    accent: "then the cluster"
    screen:
      - "**19 · Delete the Nereid:** its commands and everything it ran go with it · [`nereus nereid delete reference-release`](../../specs/cli/core.html#nereid-delete) · built"
