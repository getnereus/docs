<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="16">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d1322"/></marker></defs>
  <g fill="none" stroke="#0d1322" stroke-width="1.8">
    <rect x="10" y="75" width="240" height="70" rx="8"/>
    <rect x="340" y="10" width="380" height="85" rx="8" stroke-width="3" stroke="#2f6fd6"/>
    <rect x="340" y="125" width="380" height="85" rx="8" stroke-dasharray="5 4"/>
    <line x1="250" y1="100" x2="338" y2="55" marker-end="url(#ar)"/>
