<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="sans-serif" font-size="13">
  <g fill="none" stroke="#0d1322" stroke-width="1.5">
    <rect x="5" y="5" width="770" height="270" rx="12" stroke-dasharray="6 4"/>
    <rect x="20" y="40" width="740" height="225" rx="10"/>
    <rect x="40" y="75" width="700" height="175" rx="10" stroke-width="3" stroke="#2f6fd6"/>
    <rect x="70" y="120" width="300" height="70" rx="6"/>
    <rect x="410" y="120" width="300" height="70" rx="6" stroke-dasharray="4 3"/>
  </g>
  <g fill="#0d1322" text-anchor="middle">
    <text x="390" y="26" font-size="12">resource group tailwind-platform</text>
    <text x="390" y="60" font-weight="bold">storage account issuers&lt;id16&gt; (the installation's own)</text>
    <text x="390" y="100" font-weight="bold">container oidc (anonymous blob read, no listing)</text>
    <text x="220" y="145" font-weight="bold">undercloud/</text>
    <text x="220" y="165" font-size="11">k3d: discovery + JWKS</text>
    <text x="220" y="180" font-size="11">+ manifest.json</text>
    <text x="560" y="145" font-weight="bold">overcloud/</text>
    <text x="560" y="165" font-size="11">managed (AKS, EKS, GKE):</text>
    <text x="560" y="180" font-size="11">manifest.json only</text>
    <text x="390" y="215" font-size="11">write access: only who administers tailwind</text>
    <text x="390" y="235" font-size="11">the pivot deletes undercloud/'s documents</text>
  </g>
</svg>
