<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="16">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d1322"/></marker></defs>
  <g fill="none" stroke="#0d1322" stroke-width="1.8">
    <rect x="10" y="50" width="260" height="75" rx="8"/>
    <rect x="370" y="50" width="280" height="75" rx="8" stroke-width="3" stroke="#2f6fd6"/>
    <rect x="750" y="50" width="240" height="75" rx="8"/>
    <line x1="270" y1="87" x2="368" y2="87" marker-end="url(#ar)"/>
    <line x1="650" y1="87" x2="748" y2="87" marker-end="url(#ar)"/>
    <path d="M 510 125 C 510 185, 380 185, 380 140" marker-end="url(#ar)" stroke-dasharray="4 3"/>
