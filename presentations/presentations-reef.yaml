  - name: signup-raffle
    act: after
    topic: "Sign-up and raffle"
    message: "Sign-up and the raffle come right after the slice"
    accent: "right after"
    screen:
      - "**Sign-up:** links the device to a User, e-mails optional, deletion any time"
      - "**Raffle:** optional per Session, only for those signed up"
      - "**Winner:** shows a one-time QR code, scanned by the speaker or the staff"
      - "**Deletion:** only after the prize is delivered, what stays is anonymized"
      - "**Rules:** a slide made by Nereus or the speaker, accepted before joining"
    refs: [lgpd]
    notes: |-
      **The raffle of #1198 needs the sign-up,** so it comes right after it. The draw runs on the server from a secure random source and is recorded on the Session.

      **Presence in the room is proved by the winner's QR code,** scanned through Nereus by the speaker or the staff, who check the details and confirm the delivery.

      **Deletion waits only for the delivery;** afterwards Nereus keeps anonymized statistics and the audit trail, with the person replaced by an opaque id. The rules slide is generated from the raffle's data or customized, and Nereus warns when a custom one leaves out a required item.
    pt:
      topic: "Cadastro e sorteio"
      message: "O cadastro e o sorteio vêm logo depois da fatia"
      accent: "logo depois"
      screen:
        - "**Cadastro:** liga o aparelho a um User, e-mails opcionais, exclusão quando quiser"
        - "**Sorteio:** opcional por Session, só para quem tem cadastro"
        - "**Ganhador:** mostra um QR code de uso único, escaneado por quem apresenta ou pelo staff"
        - "**Exclusão:** só depois da entrega do prêmio, o que fica é anonimizado"
        - "**Regras:** um slide feito pelo Nereus ou por quem apresenta, aceito antes de concorrer"
      notes: |-
        **O sorteio da #1198 precisa do cadastro,** então vem logo depois dele. O sorteio roda no servidor com uma fonte aleatória segura e fica registrado na Session.

        **A presença na sala é provada pelo QR code do ganhador,** escaneado pelo Nereus por quem apresenta ou pelo staff, que confere os dados e confirma a entrega.

        **A exclusão espera só a entrega;** depois o Nereus guarda estatísticas anonimizadas e a trilha de auditoria, com a pessoa trocada por um id opaco. O slide de regras é gerado a partir dos dados do sorteio ou customizado, e o Nereus avisa quando um customizado deixa de fora um item obrigatório.

