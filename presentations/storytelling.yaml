      What we want to say: **delivery as the strategy, and discarding in the open**. "The strategy is delivery" was its motto.

      GOV.UK PaaS speaks to this very project: a government platform replaced by departments' own Kubernetes platforms. A platform survives by being adopted, not by being mandated.

      Caveat: One Login, its identity service, is still rated amber; the story is not finished.

      Source: references/gds.md
    pt:
