    message: "The UK delivered at scale and stopped what did not work"
    refs: [gov-uk-pay, gov-uk-verify, gov-uk-paas]
    subtitle: "The Government Digital Service (GDS)"
    screen: ["**First principle:** start with user needs", "**GOV.UK Pay:** nearly £10 billion processed", "**Verify:** _closed_, 2023", "**PaaS:** _decommissioned_"]
