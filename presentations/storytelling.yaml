  - name: closing
    act: closing
    animations: none
    message: "The talk ends on itself"
    subtitle: "The audience recognizes the pattern it just saw"
    screen: ["Let's book a meeting to align on it."]
    dependsOn: [this-project]
    notes: |-
      What we want to say: **a call to action that turns on itself**. "So, on Monday, let's change this. I'll book a meeting to align on it. Maybe a committee. With OKRs." Pause. "Or we could ship something by Friday."

      A first draft; the others on #190: the ticket that waits in the queue, the same talk in fifty years, and "on Monday, what are you going to deliver?". The joke is on a situation everyone shares, the speaker included.

      Feedback: a QR code for a short survey comes on this slide with #197.
    pt:
      message: "A palestra termina em si mesma"
      subtitle: "A plateia reconhece o padrão que acabou de ver"
      screen: ["Vamos marcar uma reunião para alinhar isso."]
      notes: |-
        O que queremos dizer: **uma chamada para ação que se volta contra si mesma**. "Então, na segunda-feira, vamos mudar isso. Eu marco uma reunião para alinharmos. Talvez um comitê. Com OKRs." Pausa. "Ou podíamos entregar alguma coisa até sexta."

        Um primeiro rascunho; os outros na #190: o ticket que espera na fila, a mesma palestra daqui a cinquenta anos, e "na segunda-feira, o que você vai entregar?". A piada é sobre uma situação que todos compartilham, quem apresenta inclusive.

        Feedback: um QR code para uma pesquisa curta entra neste slide com a #197.

