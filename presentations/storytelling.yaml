$schema: ../../cli/src/nereus/schemas/presentations/outline/1.json
outlineVersion: 1
deck:
  name: storytelling
  title: "Faster than ever. Toward what?"
  subtitle: "Software delivery from 1968 to the AI era"
  pt: {title: "A velocidade nunca foi tão grande. Para quê?", subtitle: "Entrega de software de 1968 à era da IA"}

acts:
  - name: opening
    title: "Opening"
    pt:
      title: "Abertura"
  - name: pattern
    title: "The pattern"
    question: "Why do software projects fail the same way?"
    opening: false
    pt:
      title: "O padrão"
      question: "Por que os projetos de software falham sempre do mesmo jeito?"
  - name: agile
    title: "Agile"
    question: "Did Agile fix it?"
    opening: false
    pt:
      title: "Agile"
      question: "O Agile resolveu?"
  - name: ai
    title: "The AI era"
    question: "Now that we can deliver anything faster, what are we delivering?"
    opening: false
    pt:
      title: "A era da IA"
      question: "Agora que podemos entregar qualquer coisa mais rápido, o que estamos entregando?"
  - name: turn
    title: "The turn"
    question: "What would break the pattern?"
    opening: false
    pt:
      title: "A virada"
      question: "O que quebraria o padrão?"
  - name: closing
    title: "Closing"
    pt:
      title: "Encerramento"

references:
  - name: randell-2018
    title: "Fifty Years of Software Engineering, or The View from Garmisch"
    author: "Brian Randell"
    year: 2018
    url: "https://arxiv.org/pdf/1805.02742"
    about: "A participant of the 1968 NATO conference looks back fifty years: why the field was named, and what it promised."
    forUs: "The name **software engineering** was chosen as a provocation, a requirement rather than a reality; the \"underestimates and overexpectations\" Licklider described still happen."
    pt:
      about: "Um participante da conferência da OTAN de 1968 olha para trás, cinquenta anos depois: por que o campo recebeu esse nome e o que ele prometia."
      forUs: "O nome **engenharia de software** foi escolhido como provocação, uma exigência e não uma realidade; as \"subestimativas e expectativas exageradas\" descritas por Licklider ainda acontecem."
  - name: conway-1968
    title: "How Do Committees Invent? (Conway's law)"
    author: "Melvin Conway"
    year: 1968
    url: "https://en.wikipedia.org/wiki/Conway%27s_law"
    about: "Organizations produce designs that copy their own communication structures."
    forUs: "The bridge whose halves do not meet: misalignment is structural, not a lack of effort."
    pt:
      about: "As organizações produzem projetos que copiam as suas próprias estruturas de comunicação."
      forUs: "A ponte cujas metades não se encontram: o desalinhamento é estrutural, não falta de esforço."
  - name: brooks-1975
    title: "The Mythical Man-Month"
    author: "Fred Brooks"
    year: 1975
    url: "https://en.wikipedia.org/wiki/The_Mythical_Man-Month"
    about: "Essays from building IBM's OS/360, republished in 1995 with \"No Silver Bullet\"."
    forUs: "\"Adding manpower to a late software project makes it later\": the first answer to a late project was already known to fail."
    pt:
      about: "Ensaios sobre a construção do OS/360 da IBM, republicados em 1995 com \"No Silver Bullet\"."
      forUs: "\"Acrescentar pessoas a um projeto de software atrasado o atrasa ainda mais\": a primeira resposta a um projeto atrasado já era sabidamente um fracasso."
  - name: royce-1970
    title: "Waterfall, Royce, and the misunderstanding"
    author: "David A. Wheeler"
    url: "https://dwheeler.com/essays/waterfall.html"
    about: "Reads Winston Royce's 1970 paper, the one credited with the waterfall."
    forUs: "Royce called the simple sequential approach \"risky and invites failure\" and recommended iterating; the industry adopted the diagram anyway."
    pt:
      about: "Lê o artigo de Winston Royce de 1970, o que é creditado como a origem do waterfall."
      forUs: "Royce chamou a abordagem sequencial simples de \"arriscada, que convida ao fracasso\" e recomendou iterar; a indústria adotou o diagrama mesmo assim."
  - name: virtual-case-file
    title: "Who Killed the Virtual Case File?"
    author: "IEEE Spectrum"
    year: 2005
    url: "https://spectrum.ieee.org/who-killed-the-virtual-case-file"
    about: "How the FBI's case management system was scrapped after years of work."
    forUs: "An **800-page** requirements document, about 400 change requests and **US$170 million**: heavy up-front process delayed the discovery of the failure."
    pt:
      about: "Como o sistema de gestão de casos do FBI foi descartado depois de anos de trabalho."
      forUs: "Um documento de requisitos de **800 páginas**, cerca de 400 solicitações de mudança e **US$ 170 milhões**: o processo pesado no início atrasou a descoberta do fracasso."
  - name: ariane-501
    title: "Ariane 5 Flight 501 Failure: Report by the Inquiry Board"
    year: 1996
    url: "https://www.csm.ornl.gov/~sheldon/cs422/ariane5fr.html"
    about: "The official inquiry into the loss of the first Ariane 5, about 30 seconds after lift-off."
    forUs: "Code reused from Ariane 4 overflowed in a function that served no purpose after lift-off, kept running \"for commonality\"."
    pt:
      about: "A investigação oficial da perda do primeiro Ariane 5, cerca de 30 segundos após o lançamento."
      forUs: "Código reaproveitado do Ariane 4 estourou em uma função que não tinha utilidade depois do lançamento, mantida em execução \"por uniformidade\"."
  - name: knight-capital
    title: "SEC Charges Knight Capital With Violations of Market Access Rule"
    author: "U.S. Securities and Exchange Commission"
    year: 2013
    url: "https://www.sec.gov/news/press-release/2013-222"
    about: "The regulator's account of Knight Capital's trading incident of August 2012."
    forUs: "More than 4 million orders in 45 minutes and a loss of more than **US$460 million**, from a deployment that left old code active."
    pt:
      about: "O relato do regulador sobre o incidente de negociação da Knight Capital em agosto de 2012."
      forUs: "Mais de 4 milhões de ordens em 45 minutos e um prejuízo de mais de **US$ 460 milhões**, por um deploy que deixou código antigo ativo."
  - name: crowdstrike-2024
    title: "Microsoft says 8.5M Windows devices were affected by CrowdStrike outage"
    author: "TechCrunch"
    year: 2024
    url: "https://techcrunch.com/2024/07/20/microsoft-says-8.5m-windows-devices-were-affected-by-crowdstrike-outage/"
    about: "Microsoft's estimate of the reach of one faulty security update."
    forUs: "One update, **8.5 million** devices: delivery speed without a safe rollout."
    pt:
      about: "A estimativa da Microsoft sobre o alcance de uma única atualização de segurança defeituosa."
      forUs: "Uma atualização, **8,5 milhões** de dispositivos: velocidade de entrega sem um rollout seguro."
  - name: mckinsey-oxford-2012
    title: "Delivering large-scale IT projects on time, on budget, and on value"
    author: "McKinsey and the University of Oxford"
    year: 2012
    url: "https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/delivering-large-scale-it-projects-on-time-on-budget-and-on-value"
    about: "A study of more than 5,400 IT projects and their outcomes."
    forUs: "Large projects ran **45%** over budget, **7%** over time, and delivered **56% less value** than predicted: the size of the problem."
    pt:
      about: "Um estudo de mais de 5.400 projetos de TI e dos seus resultados."
      forUs: "Os grandes projetos estouraram o orçamento em **45%**, o prazo em **7%** e entregaram **56% menos valor** do que o previsto: o tamanho do problema."
  - name: chaos-report
    title: "CHAOS Report on IT Project Outcomes"
    author: "OpenCommons, on the Standish Group's figures"
    url: "https://opencommons.org/CHAOS_Report_on_IT_Project_Outcomes"
    about: "A summary of the Standish Group's CHAOS figures, from 1994 to 2020."
    forUs: "1994: **16.2%** of projects successful, where successful means on time and on budget: the forecast, not the value."
    pt:
      about: "Um resumo dos números do CHAOS do Standish Group, de 1994 a 2020."
      forUs: "1994: **16,2%** dos projetos bem-sucedidos, onde bem-sucedido significa no prazo e no orçamento: a previsão, não o valor."
  - name: eveleens-verhoef-2010
    title: "The Rise and Fall of the Chaos Report Figures"
    author: "J. Laurenz Eveleens and Chris Verhoef, IEEE Software"
    year: 2010
    url: "https://research.vu.nl/en/publications/the-rise-and-fall-of-the-chaos-report-figures/"
    about: "A critique of how the CHAOS report defines success and failure."
    forUs: "The definitions judge only the accuracy of the forecast, and distort the figures: **measuring success by the forecast is part of the problem**."
    pt:
      about: "Uma crítica de como o relatório CHAOS define sucesso e fracasso."
      forUs: "As definições julgam apenas a precisão da previsão e distorcem os números: **medir o sucesso pela previsão é parte do problema**."
  - name: agile-manifesto
    title: "Manifesto for Agile Software Development"
    year: 2001
    url: "https://agilemanifesto.org/"
    about: "Four values and twelve principles, signed in 2001."
    forUs: "\"Working software over comprehensive documentation\", and \"working software is the primary measure of progress\"."
    pt:
      about: "Quatro valores e doze princípios, assinados em 2001."
      forUs: "\"Software funcionando mais que documentação abrangente\", e \"software funcionando é a medida primária de progresso\"."
  - name: fowler-c3
    title: "C3"
    author: "Martin Fowler"
    url: "https://martinfowler.com/bliki/C3.html"
    about: "One of the people on Chrysler's payroll project, where Extreme Programming was born, on what happened to it."
    forUs: "\"C3's cancellation, however, also proves that XP is no guarantee of success.\" No method guarantees success; it can give honest feedback early."
    pt:
      about: "Uma das pessoas do projeto de folha de pagamento da Chrysler, onde nasceu o Extreme Programming, sobre o que aconteceu com ele."
      forUs: "\"O cancelamento do C3, porém, também prova que o XP não é garantia de sucesso.\" Nenhum método garante o sucesso; ele pode dar feedback honesto cedo."
  - name: c3-wikipedia
    title: "Chrysler Comprehensive Compensation System"
    author: "Wikipedia"
    url: "https://en.wikipedia.org/wiki/Chrysler_Comprehensive_Compensation_System"
    about: "The timeline of the project: started in 1993, live in 1997, ended in February 2000."
    forUs: "Stuck without a single paycheck until 1996, it paid about **10,000** people in 1997; the customer representative left from burnout."
    pt:
      about: "A linha do tempo do projeto: iniciado em 1993, no ar em 1997, encerrado em fevereiro de 2000."
      forUs: "Sem emitir um único contracheque até 1996, passou a pagar cerca de **10.000** pessoas em 1997; o representante do cliente saiu por esgotamento."
  - name: dave-thomas-2014
    title: "Pragmatic Dave Thomas: Agile is Dead (Long Live Agility)"
    author: "InfoQ"
    year: 2014
    url: "https://www.infoq.com/news/2014/10/pragmatic-dave-agility"
    about: "A signatory of the Agile Manifesto on what became of the word."
    forUs: "\"Agile\" was devalued, consultants \"started to circle\", and agility cannot be imposed from the top."
    pt:
      about: "Um dos signatários do Manifesto Agile sobre o que foi feito da palavra."
      forUs: "\"Agile\" foi desvalorizado, os consultores \"começaram a rondar\", e a agilidade não pode ser imposta de cima para baixo."
  - name: dora-2025
    title: "State of AI-assisted Software Development 2025"
    author: "DORA, Google Cloud"
    year: 2025
    url: "https://services.google.com/fh/files/misc/2025_state_of_ai_assisted_software_development.pdf"
    about: "A global survey of nearly 5,000 technology professionals, with interviews, on AI in software delivery."
    forUs: "\"AI adoption now improves software delivery throughput (...) However, it still increases delivery instability\" (p. 4)."
    pt:
      about: "Uma pesquisa global com quase 5.000 profissionais de tecnologia, com entrevistas, sobre IA na entrega de software."
      forUs: "\"A adoção de IA agora melhora a vazão da entrega de software (...) No entanto, ela ainda aumenta a instabilidade da entrega\" (p. 4)."
  - name: metr-2025
    title: "Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity"
    author: "METR"
    year: 2025
    url: "https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/"
    about: "A randomized study: 16 experienced developers, 246 real issues in their own repositories. METR marks it as outdated."
    forUs: "**19% slower** with AI, while they expected 24% faster and still believed 20% faster: measure, do not believe."
    pt:
      about: "Um estudo randomizado: 16 desenvolvedores experientes, 246 issues reais nos seus próprios repositórios. A METR o marca como desatualizado."
      forUs: "**19% mais lentos** com IA, enquanto esperavam ser 24% mais rápidos e ainda acreditavam ser 20% mais rápidos: meça, não acredite."
  - name: stackoverflow-2025
    title: "Stack Overflow Developer Survey 2025: AI"
    author: "Stack Overflow"
    year: 2025
    url: "https://survey.stackoverflow.co/2025/ai"
    about: "The AI section of the yearly developer survey."
    forUs: "**84%** use or plan to use AI tools, **46%** distrust their accuracy, and the top frustration is answers \"almost right, but not quite\"."
    pt:
      about: "A seção de IA da pesquisa anual com desenvolvedores."
      forUs: "**84%** usam ou pretendem usar ferramentas de IA, **46%** desconfiam da precisão, e a maior frustração são respostas \"quase certas, mas não totalmente\"."
  - name: dora-change-approval
    title: "Streamlining change approval"
    author: "DORA"
    url: "https://dora.dev/capabilities/streamlining-change-approval/"
    about: "DORA's research on how changes get approved, and what works better."
    forUs: "Heavyweight approval hurts delivery performance, and no evidence was found that it lowers the change failure rate; peer review in the team's platform still satisfies segregation of duties."
    pt:
      about: "A pesquisa da DORA sobre como as mudanças são aprovadas e o que funciona melhor."
      forUs: "A aprovação pesada prejudica o desempenho da entrega, e não se encontrou evidência de que reduza a taxa de falha de mudanças; a revisão por pares na plataforma do time ainda cumpre a segregação de funções."
  - name: gov-uk-pay
    title: "GOV.UK Pay at 10: how it started and how it's going"
    author: "Government Digital Service"
    year: 2026
    url: "https://gds.blog.gov.uk/2026/09/02/gov-uk-pay-at-10-how-it-started-and-how-its-going/"
    about: "Ten years of the UK government's shared payment platform."
    forUs: "Nearly **£10 billion** processed for almost 1,800 services: a small thing that works, reused by hundreds."
    pt:
      about: "Dez anos da plataforma de pagamentos compartilhada do governo do Reino Unido."
      forUs: "Quase **£10 bilhões** processados para cerca de 1.800 serviços: uma coisa pequena que funciona, reutilizada por centenas."
  - name: gov-uk-verify
    title: "GDS closes GOV.UK Verify service"
    author: "UKAuthority"
    url: "https://www.ukauthority.com/articles/gds-closes-govuk-verify-service/"
    about: "The end of GDS's first identity service, replaced by One Login."
    forUs: "Take-up was \"disappointing\" and it closed in April 2023: discarding in the open."
    pt:
      about: "O fim do primeiro serviço de identidade do GDS, substituído pelo One Login."
      forUs: "A adesão foi \"decepcionante\" e o serviço foi encerrado em abril de 2023: descartar às claras."
  - name: gov-uk-paas
    title: "GDS to decommission Platform as a Service"
    author: "UKAuthority"
    url: "https://ukauthority.com/articles/gds-to-decommission-platform-as-a-service/"
    about: "Why GDS decided in 2022 to close its platform as a service."
    forUs: "Departments had built their own Kubernetes platforms: **a platform survives by being adopted, not by being mandated**."
    pt:
      about: "Por que o GDS decidiu, em 2022, encerrar a sua plataforma como serviço."
      forUs: "Os departamentos haviam construído as suas próprias plataformas Kubernetes: **uma plataforma sobrevive sendo adotada, não sendo imposta**."
  - name: gov-br-accounts
    title: "gov.br reaches 175 million accounts"
    author: "Mobile Time, from the Ministry of Management (MGI)"
    year: 2026
    url: "https://www.mobiletime.com.br/noticias/24/03/2026/govbr-175-milhoes/"
    about: "The scale of Brazil's federal digital government platform in March 2026."
    forUs: "**175 million** accounts and more than 4,600 federal services."
    pt:
      about: "A escala da plataforma de governo digital federal do Brasil em março de 2026."
      forUs: "**175 milhões** de contas e mais de 4.600 serviços federais."
  - name: gov-br-contracting
    title: "Model for contracting software development"
    author: "Secretaria de Governo Digital"
    year: 2022
    url: "https://www.gov.br/governodigital/pt-br/contratacoes-de-tic/apresentacao-do-modelo-de-desenvolvimento-de-software.pdf"
    about: "How the federal government contracts software development since 2022."
    forUs: "Agile methods as a guideline, with **payment per sprint** tied to delivered increments: agile even in public contracting."
    pt:
      about: "Como o governo federal contrata desenvolvimento de software desde 2022."
      forUs: "Métodos ágeis como diretriz, com **pagamento por sprint** vinculado aos incrementos entregues: agile até na contratação pública."

slides:
  # ── Opening ─────────────────────────────────────────
  - name: title
    act: opening
    cover: true
    message: "Fifty years of software projects failing the same way"
    subtitle: "The AI era may repeat the pattern"
    notes: |-
      What we want to say: **the problems are older than the tools**, and every generation answered them with heavier process.

      **A first-person thread:** the presenter lived through these eras in the industry; tell them aloud, as they happened. Personal details stay out of the repository.

      **Route:** the pattern, what Agile changed and what it did not, the AI era, and the turn.
    pt:
      message: "Cinquenta anos de software falhando do mesmo jeito"
      subtitle: "A era da IA pode repetir o padrão"
      notes: |-
        O que queremos dizer: **os problemas são mais antigos que as ferramentas**, e cada geração respondeu a eles com mais processo.

        **Um fio em primeira pessoa:** quem apresenta viveu essas eras na indústria; conte-as em voz alta, como aconteceram. Detalhes pessoais ficam fora do repositório.

        **Roteiro:** o padrão, o que o Agile mudou e o que não mudou, a era da IA e a virada.

  # ── The pattern ─────────────────────────────────────
  - name: field-named
    act: pattern
    topic: "Before it had a name"
    message: "In 1968 the field was named software engineering"
    refs: [randell-2018]
    subtitle: "A requirement, not a reality"
    screen: ["**Named:** _as_ a provocation", "**The concern:** a software crisis"]
    source: "Randell, Fifty Years of Software Engineering (2018)"
    notes: |-
      What we want to say: **the name was a wish**. NATO's conference in Garmisch chose "software engineering" because the field was not one yet.

      Participants recognized a shared concern that some of them called the "software crisis".

      Caveat: Randell also notes that many projects of the time were successful; the crisis was a concern, not a census.

      Source: references/software-crisis.md
    pt:
      message: "Em 1968 o campo foi batizado de engenharia de software"
      subtitle: "Uma exigência, não uma realidade"
      topic: "Antes de ter nome"
      screen: ["**Batizado:** _como_ provocação", "**A preocupação:** uma crise do software"]
      notes: |-
        O que queremos dizer: **o nome era um desejo**. A conferência da OTAN em Garmisch escolheu "engenharia de software" porque o campo ainda não era uma.

        Os participantes reconheceram uma preocupação comum que alguns chamaram de "crise do software".

        Ressalva: Randell também observa que muitos projetos da época tiveram sucesso; a crise era uma preocupação, não um censo.

        Fonte: references/software-crisis.md

  - name: underestimates
    act: pattern
    topic: "Before it had a name"
    message: "Large projects were already misjudged"
    refs: [randell-2018]
    subtitle: "And they still are"
    screen: ["\"Underestimates and overexpectations\""]
    source: "Licklider, quoted in Randell (2018)"
    dependsOn: [field-named]
    notes: |-
      What we want to say: **the diagnosis of 1968 still reads as current**. Randell, fifty years later, says it still happens.

      Ask the room: who has seen a project start with an underestimate and an overexpectation this year?

      Source: references/software-crisis.md
    pt:
      message: "Os grandes projetos já eram mal avaliados"
      subtitle: "E ainda são"
      topic: "Antes de ter nome"
      screen: ["\"Subestimativas e expectativas exageradas\""]
      notes: |-
        O que queremos dizer: **o diagnóstico de 1968 ainda parece atual**. Randell, cinquenta anos depois, diz que continua acontecendo.

        Pergunte à plateia: quem viu este ano um projeto começar com uma subestimativa e uma expectativa exagerada?

        Fonte: references/software-crisis.md

  - name: brooks
    act: pattern
    topic: "Before it had a name"
    message: "Adding people does not save a late project"
    refs: [brooks-1975]
    subtitle: "Brooks's law, 1975, from IBM's OS/360"
    screen: ["Adding people to a late project _makes_ it later"]
    source: "Brooks, The Mythical Man-Month (1975)"
    dependsOn: [underestimates]
    notes: |-
      What we want to say: **the first answer to a late project, more people, was already known to fail**.

      The original sentence: "Adding manpower to a late software project makes it later." Republished in 1995 together with "No Silver Bullet".

      Source: references/software-crisis.md
    pt:
      message: "Mais gente não salva um projeto atrasado"
      subtitle: "A lei de Brooks, 1975, a partir do OS/360 da IBM"
      topic: "Antes de ter nome"
      screen: ["Acrescentar pessoas a um projeto atrasado o _atrasa_ mais"]
      notes: |-
        O que queremos dizer: **a primeira resposta a um projeto atrasado, mais gente, já era sabidamente um fracasso**.

        A frase original: "Adding manpower to a late software project makes it later." Republicada em 1995 junto com "No Silver Bullet".

        Fonte: references/software-crisis.md

  - name: royce
    act: pattern
    topic: "The answer was process"
    message: "The paper credited with the waterfall recommended iterating"
    refs: [royce-1970]
    subtitle: "The industry adopted the diagram anyway"
    screen: ["**The diagram:** one phase after another", "**The text:** \"risky and _invites_ failure\""]
    source: "Royce (1970), as read by Wheeler"
    dependsOn: [brooks]
    notes: |-
      What we want to say: **the waterfall was the example of what not to do**. Royce drew the sequential flow and, in the same paper, recommended iterating.

      The irony opens the beat: the answer to uncertainty became the very process its author warned against.

      Source: references/software-crisis.md
    pt:
      message: "O artigo tido como origem do waterfall recomendou iterar"
      subtitle: "A indústria adotou o diagrama mesmo assim"
      topic: "A resposta foi processo"
      screen: ["**O diagrama:** uma fase após a outra", "**O texto:** \"arriscado e _convida_ ao fracasso\""]
      notes: |-
        O que queremos dizer: **o waterfall era o exemplo do que não fazer**. Royce desenhou o fluxo sequencial e, no mesmo artigo, recomendou iterar.

        A ironia abre o momento: a resposta à incerteza virou justamente o processo contra o qual o autor alertou.

        Fonte: references/software-crisis.md

  - name: heavy-process
    act: pattern
    topic: "The answer was process"
    message: "Each generation answered uncertainty with heavier process"
    subtitle: "To compensate for what it could not predict"
    screen: ["**Projects:** PMBOK", "**Development:** RUP and Rational Rose", "**Maturity:** CMMI and MPS.BR"]
    dependsOn: [royce]
    notes: |-
      What we want to say: **process was the answer to fear of the unknown**. Plan more, document more, certify more.

      MPS.BR is the Brazilian software process maturity model, close to CMMI; the audience may have lived through an assessment.

      Tell aloud what each of these looked like from the inside.
    pt:
      message: "Cada geração respondeu à incerteza com mais processo"
      subtitle: "Para compensar o que não conseguia prever"
      topic: "A resposta foi processo"
      screen: ["**Projetos:** PMBOK", "**Desenvolvimento:** RUP e Rational Rose", "**Maturidade:** CMMI e MPS.BR"]
      notes: |-
        O que queremos dizer: **o processo era a resposta ao medo do desconhecido**. Planejar mais, documentar mais, certificar mais.

        MPS.BR é o modelo brasileiro de maturidade de processos de software, próximo do CMMI; a plateia pode ter passado por uma avaliação.

        Conte em voz alta como cada um desses parecia por dentro.

  - name: virtual-case-file
    act: pattern
    topic: "The answer was process"
    message: "The FBI's Virtual Case File was scrapped"
    subtitle: "A case from 2005"
