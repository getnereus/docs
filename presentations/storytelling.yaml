  - name: c3
    act: agile
    topic: "XP's own project"
    message: "XP's founding project was cancelled"
    refs: [fowler-c3, c3-wikipedia]
    subtitle: "It failed early, and its own people say so"
    screen: ["**1996:** not one paycheck _printed_", "**1997:** about 10,000 people paid", "**2000:** _cancelled_"]
    source: "Martin Fowler, C3; Chrysler Comprehensive Compensation System"
    dependsOn: [manifesto]
    notes: |-
      What we want to say: **say it first, before anyone asks**. XP's founding project was cancelled.

      **Then turn it:** a project stuck for three years without a paycheck was paying 10,000 people within a year of changing how it worked; when the business decided it was not worth going on, it stopped. A failure that shows early is cheaper than one that shows after 800 pages of requirements.

      Fowler, who worked on it: "C3's cancellation, however, also proves that XP is no guarantee of success." No method guarantees success; what it can give is honest feedback early.

      The customer representative left from burnout months after launch: a practice depends on a sustainable pace, the manifesto's eighth principle.

      Source: references/agile.md
    pt:
      message: "O projeto fundador do XP foi cancelado"
      subtitle: "Falhou cedo, e o seu próprio pessoal diz isso"
      topic: "O projeto do próprio XP"
      screen: ["**1996:** nenhum contracheque _emitido_", "**1997:** cerca de 10.000 pessoas pagas", "**2000:** _cancelado_"]
      notes: |-
        O que queremos dizer: **diga primeiro, antes que perguntem**. O projeto fundador do XP foi cancelado.

        **Depois vire o jogo:** um projeto parado por três anos sem um contracheque estava pagando 10.000 pessoas em menos de um ano depois de mudar a forma de trabalhar; quando o negócio decidiu que não valia a pena continuar, parou. Um fracasso que aparece cedo é mais barato que um que aparece depois de 800 páginas de requisitos.

        Fowler, que trabalhou nele: "C3's cancellation, however, also proves that XP is no guarantee of success." Nenhum método garante o sucesso; o que ele pode dar é feedback honesto cedo.

        O representante do cliente saiu por esgotamento meses após o lançamento: uma prática depende de um ritmo sustentável, o oitavo princípio do manifesto.

        Fonte: references/agile.md

