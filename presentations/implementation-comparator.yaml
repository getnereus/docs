- name: interface
  act: reef
  topic: The interface
  message: An interface is a Reef
  terminal:
    steps:
    - run: nereus reef get authentication
      output: |-
        {reef:authentication.getnereus.dev/v1alpha1}

        sessions  create get list delete  # nereus login
  notes: |-
    In Nereus, **an interface is a Reef**, the equivalent of a Kubernetes API Group.

    Installing the **authentication** Reef installs the CRDs, among them **sessions**: that's how **login becomes a create**. **Users** live in **core**, because identity belongs to the platform, not to the Reef.

    The version in the name states the maturity: **v1alpha1**, **v1beta1** and, once validated, **v1**.
  pt:
    topic: A interface
    message: Uma interface é um Reef
    notes: |-
      No Nereus, **interface é um Reef**, o equivalente ao API Group do Kubernetes.

      Instalar o Reef **authentication** instala os CRDs, entre eles **sessions**: é assim que o **login vira um create**. Os **users** ficam no **core**, porque a identidade é da plataforma, não do Reef.

      A versão no nome diz a maturidade: **v1alpha1**, **v1beta1** e, depois de validada, **v1**.
