  act: closing
  topic: Implementation comparator
  message: Thank you!
  subtitle: Questions?
  notes: '**Thank the audience** and open the floor for questions.'
  pt:
    topic: Comparador de implementações
    message: Obrigado!
    subtitle: Perguntas?
