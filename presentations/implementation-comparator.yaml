- name: measured
  act: reef
  topic: Measured by design
  message: Everything goes through Nereus. Same yardstick
  screen:
  - '**Portal** · web'
  - '**platform** CLI'
  - '**Agents** · MCP'
  - '**Usage, latency and errors:** from request to `Ready`, per implementation and channel, in one trace'
  notes: |-
    Base hypothesis: **every access goes through Nereus**: web, CLI or MCP.

    Measurement belongs to **the platform**, not each implementation. Install the Nereid and **usage, latency and errors** show up.

    It's the **service mesh** effect: one yardstick for all.
  pt:
    topic: Medido por construção
    message: Tudo passa pelo Nereus. A régua é a mesma
    screen:
    - '**Portal** · web'
    - '**platform** CLI'
    - '**Agentes** · MCP'
    - '**Uso, latência e erros:** do pedido ao `Ready`, por implementação e canal, num trace só'
    notes: |-
      Hipótese de base: **todo acesso passa pelo Nereus**: web, CLI ou MCP.

      A medição é **da plataforma**, não de cada implementação. Instalou a Nereida, **uso, latência e erros** já aparecem.

      É o efeito do **service mesh**: a mesma régua para todos.
- name: not-free
  act: reef
  topic: What isn't free
  message: Three things the platform can't see alone
  screen:
  - '**Satisfaction:** a one-key score, per implementation'
  - '**Human time:** login with and without typing time'
  - '✓ **MCP:** Model Context Protocol: each tool call measured, scored by whoever asked'
  notes: |-
    Three things the platform **doesn't observe on its own, but gives a way to measure**.

    **Satisfaction:** now and then, a **one-key score**, tied to the implementation that served.

    **Human time:** the comparison shows login **with and without** the person's typing time. Without it, it compares **implementations**; with it, the **experience**.

    **MCP:** the agent acts **on behalf of whoever asked**. We measure **every tool call** in one trace, and **the score comes from the person** who delegated.
  pt:
    topic: O que não vem de graça
    message: Três coisas que a plataforma não vê sozinha
    screen:
    - '**Satisfação:** uma nota com uma tecla, por implementação'
    - '**Tempo humano:** login com e sem a pessoa digitando'
    - '✓ **MCP:** Model Context Protocol: cada tool medida, nota de quem pediu'
    notes: |-
      Três coisas que a plataforma **não observa sozinha, mas oferece como medir**.

      **Satisfação:** de vez em quando, uma **nota com uma tecla**, ligada à implementação que atendeu.

      **Tempo humano:** a comparação mostra o login **com e sem** o tempo da pessoa digitando. Sem ele, compara as **implementações**; com ele, a **experiência**.

      **MCP:** o agente age **em nome de quem pediu**. Medimos **cada tool** num trace só, e a **nota vem da pessoa** que delegou.
