- name: understand
  act: iterating
  topic: Understand
  message: Progressive disclosure
  diagram: how-i-use-ia/understand.svg
  show:
  - all
  screen:
  - '**{pr:Figure}**: I tap a moment to see where the idea is.'
  - '**{order:Classification}**: I see how it was classified. It is a **hypothesis**: if I disagree, it becomes a new event.'
  - '**{raw:Raw}**: only then do I read the exact excerpt that justifies the classification.'
  notes: |-
    Tap the three boxes, left to right, or use the ▼.

    "AI should help teams **learn faster**. Not create the **illusion of certainty**." Paulo Caroli, Times importam mais do que nunca (file 178).

    **Classification**: stage, criterion, confidence and who classified. Disagreeing **never edits** the classification; it records a new event.

    **Raw**: exact excerpt, who said it and when. Every classification points to the excerpt that justifies it: the **grounded theory** rule.

    Link to **Shneiderman**: overview, zoom and filter, details on demand.

    Details in the **references deck**.
  pt:
    topic: Entender
    message: Descoberta progressiva
    diagram: how-i-use-ia/understand.pt.svg
    screen:
    - '**{pr:Figura}**: toco num momento para ver onde a ideia está.'
    - '**{order:Classificação}**: vejo como foi classificado. É uma **hipótese**: se eu discordo, vira um evento novo.'
    - '**{raw:Bruto}**: só então leio o trecho exato que justifica a classificação.'
    notes: |-
      Tocar nas três caixas, da esquerda para a direita, ou usar o ▼.

      "A IA deve ajudar os times a **aprender mais rápido**. Não criar a **ilusão de certeza**." Paulo Caroli, Times importam mais do que nunca (arquivo 178).

      **Classificação**: estágio, critério, confiança e quem classificou. Discordar **nunca edita** a classificação; grava um evento novo.

      **Bruto**: trecho exato, quem disse e quando. Toda classificação aponta para o trecho que a justifica: regra da **grounded theory**.

      Ligar com **Shneiderman**: overview, zoom e filtro, detalhe sob demanda.

      Detalhes no **deck de referências**.
