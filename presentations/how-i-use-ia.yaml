- name: science
  act: evidence
  topic: Science
  message: None of this is new
  screen:
  - '**Progressive disclosure** (Jakob Nielsen): show only what is needed now.'
  - '**"Overview first, zoom and filter, then details on demand"** (Ben Shneiderman, 1996): it is Pearl layers in full.'
  - '**Grounded theory** (Glaser and Strauss, 1967): raw → code → category. It is what the extraction does.'
  - '**Sensemaking loop** (Pirolli and Card, 2005): collect, filter, schematize, build the case.'
  - '**W3C PROV**: provenance vocabulary: "derived from", "generated by", "attributed to".'
  source: Jakob Nielsen, "Progressive Disclosure", NN/g (2006)
  notes: |-
    **Nielsen did not create progressive disclosure**; he popularized the term in 2006, in an article that already calls the idea "more than 30 years old".

    **1984**: **"Training Wheels"** study, by **John M. Carroll** and **Caroline Carrithers**, at IBM. They blocked the advanced functions of a word processor for beginners.

    **1985**: **Kristina Hooper Woolsey**, at Apple, writes about informing the user little by little (book User Centered System Design, Norman and Draper, 1986).

    **1992**: the **Macintosh Human Interface Guidelines** have the section "Using Progressive Disclosure".

    Who named it first is **not confirmed**.

    Full table: **references deck, slide R1**. Before inventing a format, look at **REFI-QDA** (Rotterdam Exchange Format Initiative for Qualitative Data Analysis) and open tools: **Taguette**, **QualCoder**.

    https://www.nngroup.com/articles/progressive-disclosure/

    https://jakobnielsenphd.substack.com/p/progressive-disclosure

    https://en.wikipedia.org/wiki/Progressive_disclosure
  pt:
    topic: Ciência
    message: Nada disso é novo
    screen:
    - '**Progressive disclosure** (Jakob Nielsen): mostrar só o necessário agora.'
    - '**"Overview first, zoom and filter, then details on demand"** (primeiro a visão geral, depois zoom e filtro, e detalhes sob demanda; Ben Shneiderman, 1996): é o Pearl layers inteiro.'
    - '**Grounded theory** (Glaser e Strauss, 1967): bruto → código → categoria. É o que a extração faz.'
    - '**Sensemaking loop** (Pirolli e Card, 2005): coletar, filtrar, esquematizar, montar o caso.'
    - '**W3C PROV**: vocabulário de proveniência: "veio de", "gerado por", "atribuído a".'
    notes: |-
      **Nielsen não criou o progressive disclosure**; ele popularizou o termo em 2006, num artigo que já chama a ideia de "mais de 30 anos".

      **1984**: estudo **"Training Wheels"** (rodinhas de bicicleta), de **John M. Carroll** e **Caroline Carrithers**, na IBM. Bloquearam as funções avançadas de um editor de texto para quem estava começando.

      **1985**: **Kristina Hooper Woolsey**, da Apple, escreve sobre informar o usuário aos poucos (livro User Centered System Design, Norman e Draper, 1986).

      **1992**: as **Macintosh Human Interface Guidelines** têm a seção "Using Progressive Disclosure".

      Quem nomeou primeiro **não está confirmado**.

      Tabela completa: **deck de referências, slide R1**. Antes de inventar formato, olhar **REFI-QDA** (Rotterdam Exchange Format Initiative for Qualitative Data Analysis) e ferramentas abertas: **Taguette**, **QualCoder**.

      https://www.nngroup.com/articles/progressive-disclosure/

      https://jakobnielsenphd.substack.com/p/progressive-disclosure

      https://en.wikipedia.org/wiki/Progressive_disclosure
