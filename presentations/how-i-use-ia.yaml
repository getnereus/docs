- name: experimenting
  act: team
  topic: Experimenting
  message: Experimenting is expensive, and worth it
  accent: worth
  screen:
  - '**Tokens:** measure what went in, not what was learned'
  - '**Cost per learning:** the experiment divided by the decisions it produced'
  - The future belongs to the teams that **learn faster together**
  source: Paulo Caroli, _Times importam mais do que nunca_
  notes: |-
    **Cutting the experiment to save tokens also cuts the learning.** Many teams chase saving tokens.

    **Token spend is a vanity metric**, in Eric Ries's sense: it measures what went in, not what was learned.

    **The real gain is the team going through Build-Measure-Learn**, again and again; AI is the tool.

    **Cost per learning** is the cost of the experiment divided by the decisions or backlog items it produced.

    **Caroli, in full:** "The future will not belong to the teams that simply use more AI. The future will belong to the teams that learn faster together."

    **The owner's idea**, spoken in the morning and recorded on 10/27 (file 175).

    **Cost per learning**: a suggestion from Claude, not measured yet.

    A similar line, **attributed to Jeff Bezos**: "Our success at Amazon is a function of how many experiments we do per year, per month, per week, per day." Quoted by Fast Company in 2016, from a Medium post; original date not confirmed.

    https://www.fastcompany.com/3063846/why-these-tech-companies-keep-running-thousands-of-failed

    Caroli quote: file 173.
  pt:
    topic: Experimentar
    message: Experimentar custa caro, e vale
    accent: vale
    screen:
    - '**Token:** mede o que entrou, não o que se aprendeu'
    - '**Custo por aprendizado:** o experimento dividido pelas decisões que gerou'
    - O futuro é dos times que **aprendem mais rápido juntos**
    notes: |-
      **Cortar o experimento para economizar token também corta o aprendizado.** Muitos times correm atrás de economizar token.

      **Gasto de token é métrica de vaidade**, no sentido do Eric Ries: mede o que entrou, não o que se aprendeu.

      **O ganho de verdade é o time passar pelo Build-Measure-Learn**, de novo e de novo; a IA é a ferramenta.

      **Custo por aprendizado** é o custo do experimento dividido pelas decisões ou itens de backlog que ele gerou.

      **Caroli, completo:** "O futuro não será dos times que simplesmente usam mais IA. O futuro será dos times que aprendem mais rápido juntos."

      **Ideia do owner**, falada de manhã e registrada em 27/10 (arquivo 175).

      **Custo por aprendizado**: sugestão do Claude, ainda não medida.

      Frase parecida, **atribuída a Jeff Bezos**: "Nosso sucesso na Amazon é função de quantos experimentos fazemos por ano, por mês, por semana, por dia." Citada pela Fast Company em 2016, a partir de um post no Medium; data original não confirmada.

      https://www.fastcompany.com/3063846/why-these-tech-companies-keep-running-thousands-of-failed

      Citação do Caroli: arquivo 173.
