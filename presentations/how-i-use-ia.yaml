- name: humility
  act: origins
  topic: Humility
  message: Nothing new under the sun
  accent: new
  screen:
  - '**Most of the time:** someone already had our idea'
  - '**Socrates:** "I know that I know nothing", in Plato''s _Apology_'
  - '**Shoulders of giants:** Bernard of Chartres, c. 1130; Newton, 1675'
  - '**Multiple discovery:** Darwin and Wallace, Newton and Leibniz'
  - '**Dunning-Kruger:** the less we know, the more we think we know'
  - '**The AI:** opens the collective knowledge; search first, then give credit'
  notes: |-
    Most of the time, our idea was already thought by someone else.

    "I know that I know nothing" - Socrates, in Plato's Apology

    Standing on the shoulders of giants - Bernard of Chartres, c. 1130; Newton, 1675

    Multiple discovery - Darwin and Wallace, Newton and Leibniz

    Dunning-Kruger: the less we know, the more we think we know

    AI opens the collective knowledge. Search first, then give credit.

    **The owner's point**: most of the time, the idea we are developing was already thought by another human. Knowing that should make us **humble** and remove the false feeling that we invented it.

    It reminds me of **memento mori** ("remember you will die"). Here: **remember you don't know**.

    **Shoulders of giants**: Bernard of Chartres, c. 1130 (via John of Salisbury, Metalogicon); Newton's letter to Hooke, 1675; Robert K. Merton, On the Shoulders of Giants (1965). Checked on the web.

    **Multiple discovery** (Merton). **Cryptomnesia**: thinking an idea is yours when it is a forgotten memory. **Dunning-Kruger** (1999).

    Link to the project rule: **look for an open source solution before building**. Details in file 208.
  pt:
    topic: Humildade
    message: Nada de novo debaixo do sol
    accent: novo
    screen:
    - '**Quase sempre:** alguém já pensou na nossa ideia'
    - '**Sócrates:** "Só sei que nada sei", na _Apologia_ de Platão'
    - '**Ombros de gigantes:** Bernardo de Chartres, c. 1130; Newton, 1675'
    - '**Descoberta múltipla:** Darwin e Wallace, Newton e Leibniz'
    - '**Dunning-Kruger:** quanto menos sabemos, mais achamos que sabemos'
    - '**A IA:** abre o conhecimento coletivo; pesquise antes e dê o crédito'
    notes: |-
      Na maioria das vezes, a nossa ideia já foi pensada por outra pessoa.

      "Só sei que nada sei" - Sócrates, na Apologia de Platão

      Sobre ombros de gigantes - Bernardo de Chartres, c. 1130; Newton, 1675

      Descoberta múltipla - Darwin e Wallace, Newton e Leibniz

      Dunning-Kruger: quanto menos sabemos, mais achamos que sabemos

      A IA abre o conhecimento coletivo. Pesquise antes e dê o crédito.

      **Ponto do owner**: na maioria das vezes, a ideia que estamos desenvolvendo já foi pensada por outro ser humano. Saber disso deveria nos deixar **humildes** e tirar a falsa sensação de que inventamos algo.

      Me lembra **memento mori** ("lembre-se de que vai morrer"). Aqui: **lembre-se de que você não sabe**.

      **Ombros de gigantes**: Bernardo de Chartres, por volta de 1130 (via João de Salisbury, Metalogicon); carta de Newton a Hooke, 1675; Robert K. Merton, On the Shoulders of Giants (1965). Conferido na web.

      **Descoberta múltipla** (Merton). **Criptomnésia**: achar que a ideia é sua quando é uma lembrança esquecida. **Dunning-Kruger** (1999).

      Ligação com a regra do projeto: **procurar uma solução open source antes de construir**. Detalhes no arquivo 208.
- name: memory
  act: origins
  topic: Memory
  message: Why mythology? Memory
  accent: Memory
  screen:
  - '**Method of loci:** the sea is the palace, the names are the places Simonides, via Cicero'
  - '**Levels of processing:** meaning sticks more than form Craik and Lockhart, 1972'
  - '**Schema theory:** the new fits into a story we know Bartlett, 1932'
  - '**Conceptual metaphor:** the abstract understood through the concrete Lakoff and Johnson, 1980'
  - '**Dual coding:** word and image, two cues Paivio, 1971'
  notes: |-
    Telling Nereus through Hesiod's Theogony, I remember the myth **and** the system.

    **Levels of processing** (Craik and Lockhart, 1972): the deeper information is processed, by meaning rather than form, the longer it stays in memory.

    **Schema theory** (Bartlett, 1932): we remember by fitting the new into structures we already know; a familiar story becomes the mold.

    **Conceptual metaphor** (Lakoff and Johnson, 1980): we understand an abstract concept through a concrete one, like the system through the sea.

    **Dual coding** (Paivio, 1971): a word together with an image gives memory two cues, so recall gets easier.

    Nereus is a memory palace: the sea is the palace; reef, Nereids and Glaucus are the places.

    **Observation by the owner**: telling Nereus through Hesiod's **Theogony**, I remember the myth and the system concepts.

    **Method of loci**: "loci" is Latin for **places**, not a person. Picture a place you know, leave each item in a spot, walk it in your head to recall.

    **Origin**: Simonides of Ceos left a banquet just before the roof fell and named the dead by where they sat. Told by **Cicero**, De Oratore. Oldest description: **Rhetorica ad Herennium**, anonymous, c. 80 BC.

    **Books**: Frances Yates, The Art of Memory (1966); Joshua Foer, Moonwalking with Einstein (2011).

    References brought by **Claude (Anthropic)**. Only Craik and Lockhart was checked on the web. Files 188 and 204.
  pt:
    topic: Memória
    message: Por que mitologia? Memória
    accent: Memória
    screen:
    - '**Método de loci:** o mar é o palácio, os nomes são os lugares Simônides, via Cícero'
    - '**Níveis de processamento:** o significado fixa mais que a forma Craik e Lockhart, 1972'
    - '**Teoria dos esquemas:** o novo se encaixa numa história conhecida Bartlett, 1932'
    - '**Metáfora conceitual:** o abstrato entendido pelo concreto Lakoff e Johnson, 1980'
    - '**Codificação dupla:** palavra e imagem, duas pistas Paivio, 1971'
    notes: |-
      Contando o Nereus pela Teogonia de Hesíodo, eu lembro do mito **e** do sistema.

      **Níveis de processamento** (Craik e Lockhart, 1972): quanto mais fundo se processa uma informação, pelo significado e não pela forma, mais ela fica na memória.

      **Teoria dos esquemas** (Bartlett, 1932): a gente lembra encaixando o novo em estruturas que já conhece; uma história conhecida vira o molde.

      **Metáfora conceitual** (Lakoff e Johnson, 1980): entendemos um conceito abstrato por meio de outro concreto, como o sistema pelo mar.

      **Codificação dupla** (Paivio, 1971): palavra junto com imagem cria duas pistas na memória, e lembrar fica mais fácil.

      O Nereus é um palácio da memória: o mar é o palácio; reef, Nereidas e Glauco são os lugares.

      **Observação do owner**: contando o Nereus pela **Teogonia** de Hesíodo, eu lembro do mito e dos conceitos do sistema.

      **Método de loci**: "loci" é latim para **lugares**, não é uma pessoa. Imagine um lugar conhecido, deixe cada item num ponto e percorra de cabeça para lembrar.

      **Origem**: Simônides de Ceos saiu de um banquete pouco antes de o teto cair e identificou os mortos pelo lugar onde estavam sentados. Contado por **Cícero**, De Oratore. Descrição mais antiga: **Rhetorica ad Herennium**, anônima, por volta de 80 a.C.

      **Livros**: Frances Yates, A Arte da Memória (1966); Joshua Foer, A Arte e a Ciência de Memorizar Tudo (2011).

      Referências trazidas pelo **Claude (Anthropic)**. Só Craik e Lockhart foi conferido na web. Arquivos 188 e 204.
