- name: why
  act: why
  message: Build, measure, learn
  diagram: how-i-use-ia/why.svg
  show:
  - all
  screen:
  - Dictation, the beach and Glaucus
  - 'Use it for real: conversion, not volume'
  - What went wrong becomes a rule
  source: Eric Ries, _The Lean Startup_ (2011)
  notes: |-
    **Build.** I started with dictation because it is natural conversation and the raw capture guarantees nothing is lost. Since voice does not talk to agents, I put together the good enough: the beach on Drive and Glaucus. Last night: Pearl layers from v1 to v3.

    **Measure.** Use it for real and watch. Last night: me on the phone, sending screenshots of the bugs. And measure what matters: conversion into backlog, not volume of ideas.

    **Learn.** Turn what went wrong into a rule. Last night: the criteria of the five stages and progressive discovery. Each loop leaves me a bit closer to Nereus.

    This is the **heart**: the deck shows the how, here is the **why**.

    Each turn of the **Build-Measure-Learn** cycle leaves me a bit closer to the end goal.

    Source: Eric Ries, The Lean Startup (2011). Record: file 167.

    https://theleanstartup.com/principles
  pt:
    message: Construir, medir, aprender
    diagram: how-i-use-ia/why.pt.svg
    screen:
    - Ditado, a praia e o Glauco
    - 'Usar de verdade: conversão, não volume'
    - O que deu errado vira regra
    notes: |-
      **Construir.** Comecei pelo ditado porque é conversa natural e o bruto garante que nada se perde. Como a voz não fala com agentes, montei o bom o bastante: a praia no Drive e o Glauco. Ontem: Pearl layers da v1 à v3.

      **Medir.** Usar de verdade e observar. Ontem: eu no celular, mandando prints dos bugs. E medir o que importa: conversão em backlog, não volume de ideias.

      **Aprender.** Transformar o que deu errado em regra. Ontem: os critérios dos cinco estágios e a descoberta progressiva. Cada volta deixa um pouco mais perto do Nereus.

      Este é o **coração**: o deck mostra o como, aqui está o **porquê**.

      Cada volta do ciclo **Build-Measure-Learn** deixa um pouco mais perto do objetivo final.

      Fonte: Eric Ries, The Lean Startup (2011). Registro: arquivo 167.

      https://theleanstartup.com/principles
- name: agile
  act: why
  topic: Agile
  message: The Agile Manifesto in four words
  accent: four
  screen:
  - '**People**'
  - '- Individuals and interactions over processes and tools'
  - '**Working software**'
  - '- Working software over comprehensive documentation'
  - '**Collaboration**'
  - '- Customer collaboration over contract negotiation'
  - '**Responding to change**'
  - '- Responding to change over following a plan'
  source: Manifesto for Agile Software Development, Snowbird, Utah (2001), agilemanifesto.org
  notes: |-
    **The Agile Manifesto, February 2001.** Seventeen authors at Snowbird, Utah, among them Kent Beck, Martin Fowler and Ward Cunningham.

    **A mnemonic: people, software, collaboration, change.** One word per value, and the full sentence below it.

    **The items on the right still have value.** The items on the left are valued more.

    Source: https://agilemanifesto.org/
  pt:
    topic: Ágil
    message: O Manifesto Ágil em quatro palavras
    accent: quatro
    screen:
    - '**Pessoas**'
    - '- Indivíduos e interações mais que processos e ferramentas'
    - '**Software**'
    - '- Software em funcionamento mais que documentação abrangente'
    - '**Colaboração**'
    - '- Colaboração com o cliente mais que negociação de contratos'
    - '**Mudança**'
    - '- Responder a mudanças mais que seguir um plano'
    notes: |-
      **O Manifesto Ágil, fevereiro de 2001.** Dezessete autores em Snowbird, Utah, entre eles Kent Beck, Martin Fowler e Ward Cunningham.

      **Um mnemônico: pessoas, software, colaboração, mudança.** Uma palavra por valor, e a frase inteira embaixo.

      **Os itens da direita continuam tendo valor.** Os da esquerda são mais valorizados.

      Fonte: https://agilemanifesto.org/iso/ptbr/manifesto.html
- name: destination
  act: why
  topic: Destination
  message: Where I want to get to, and what I use today
  accent: today
  screen:
  - '**Where I want to get to:** voice talking directly to the agents'
  - '**Mediator agent:** like centurions in a room, each person''s agents agree on the plan'
  - '**Good enough, today:** files on Drive and a messenger'
  notes: |-
    Nereus as the meeting point: the voice conversation talking directly to the agents.

    Voice does not talk to remote agents. So: files in a Drive folder (the beach) and a messenger (Glaucus).

    The **good enough** points to the best.

    The **beach on Drive** is the draft of the **event bus** inside Nereus.

    **The mediator agent.** The first person of the team to log in for the day creates the room; the platform provisions the mediator; each person's agents join on their behalf, agree on plans, and the mediator weighs collisions and collects updates. The metaphor: centurions in the war tent.

    **It starts by listening.** Agents on different machines do not know about each other, so the mediator is the only place where the whole team becomes observable: first it records every action as an event (replay, audit), then it starts intervening, and we compare before and after.

    **Creating agents is not free.** The mediator needs a spending limit, and its own cost enters the cost pillar.

    What I do today by voice (I talk, Claude weighs and sends the work to the right machine) is a manual prototype of the mediator. Raw files: 2026-10-24 conversation 01, file 04; files 05 and 107.
  pt:
    topic: Destino
    message: Aonde quero chegar, e o que uso hoje
    accent: hoje
    screen:
    - '**Aonde quero chegar:** a voz falando direto com os agentes'
    - '**Agente mediador:** como centuriões numa sala, os agentes de cada um combinam o plano'
    - '**Bom o bastante, hoje:** arquivos no Drive e um mensageiro'
    notes: |-
      O Nereus como ponto de encontro: a conversa por voz falando direto com os agentes.

      A voz não conversa com agentes remotos. Então: arquivos numa pasta do Drive (a praia) e um mensageiro (o Glauco).

      O **bom o bastante** aponta para o melhor.

      A **praia no Drive** é o rascunho do **barramento de eventos** dentro do Nereus.

      **O agente mediador.** O primeiro do time a entrar no dia cria a sala; a plataforma provisiona o mediador; os agentes de cada pessoa entram em nome dela, combinam os planos, e o mediador pesa as colisões e junta as atualizações. A metáfora: centuriões na tenda de guerra.

      **Ele começa ouvindo.** Agentes em máquinas diferentes não sabem uns dos outros, então o mediador é o único lugar onde o time inteiro fica observável: primeiro ele grava cada ação como evento (replay, auditoria), depois passa a intervir, e comparamos o antes e o depois.

      **Criar agentes não é de graça.** O mediador precisa de um limite de gasto, e o custo dele entra no pilar de custo.

      O que eu faço hoje por voz (eu falo, o Claude pesa e manda o trabalho para a máquina certa) é um protótipo manual do mediador. Arquivos brutos: 24/10 conversa 01, arquivo 04; arquivos 05 e 107.
- name: the-loop
  act: loop
  message: The full cycle
  diagram: how-i-use-ia/the-loop.svg
  show:
  - all
  screen:
  - '**raw:** each conversation becomes numbered files'
  - '**order:** "send it through Glaucus" becomes a work order'
  - '**agent:** claims the order, works in its own worktree'
  - '**issue + PR:** reviewable code, with CI (continuous integration)'
  - '**handoff:** the next session reads it, not the chat'
  notes: |-
    **raw**: each conversation becomes numbered files on Drive, separating what I said from what the AI said, with the time and the type of contribution.

    **order**: when I say "send it through Glaucus", the refined idea becomes a work order in a file and goes to the beach (the beach slide).

    **agent**: a remote agent watches the beach, claims the order, confirms, and works in a git worktree of its own.

    **issue + PR**: the result arrives as reviewable code, with CI, and the reply goes back to the beach.

    **handoff**: the session ends by writing what was left open; the next one starts by reading that, not the chat. Name under review: maybe "let's move on", like a squad that keeps moving forward.

    Central point: the **memory of the work stays outside the model**.

    Last night at 11:25 pm the **model switched** in the middle of the session and **nothing was lost**.
  pt:
    message: O ciclo completo
    diagram: how-i-use-ia/the-loop.pt.svg
    screen:
    - '**raw:** cada conversa vira arquivos numerados'
    - '**order:** "manda pelo Glauco" vira ordem de serviço'
    - '**agent:** pega a ordem, trabalha numa worktree própria'
    - '**issue + PR:** código revisável, com CI (integração contínua)'
    - '**handoff:** a próxima sessão lê isso, não o chat'
    notes: |-
      **raw**: cada conversa vira arquivos numerados no Drive, separando o que eu disse do que a IA disse, com hora e tipo de contribuição.

      **order**: quando eu digo "manda pelo Glauco", a ideia refinada vira uma ordem de serviço num arquivo e vai para a praia (o slide da praia).

      **agent**: um agente remoto vigia a beach, reivindica a ordem, confirma, trabalha num git worktree só dele.

      **issue + PR**: o resultado chega como código revisável, com CI, e a resposta volta para a beach.

      **handoff**: a sessão termina escrevendo o que ficou aberto; a próxima começa lendo isso, não o chat. Nome em revisão: talvez "vamos avançar", como um esquadrão que segue em frente.

      Ponto central: a **memória do trabalho fica fora do modelo**.

      Ontem às 23h25 o **modelo trocou** no meio da sessão e **nada se perdeu**.
- name: hands-free
  act: loop
  topic: Hands-free
  message: A walk with the dog, hands-free
  accent: hands-free
  screen:
  - '**Wake word:** it answers only to "Claude"'
  - '- Street test: someone asked for directions, it stayed silent'
  - '- Bakery test: many voices, it stayed silent'
  - '**Ideas on the way:** each one lands on Drive as raw data'
  - '- A voice agent in every room of the house'
  - '- The call dropped: record offline, process later'
  - '- The raw data gets a name: Pontos, the father of Nereus'
  - '**New rules:** learned on the walk'
  - '- An audio "got it" before the tools'
  - '- Repeat back before saving (the taxi stand number)'
  - '**The conversation:** is the backlog'
  notes: |-
    It answers only when I start with "Claude"

    Ideas captured while walking

    The taxi number: I said it, it was saved

    No signal outside the building: another idea

    New rule: an audio "got it" before the tools

    **Rule set by the owner**: Claude answers only when the sentence starts with **Claude**; otherwise I may be talking to the dog, a neighbor, the bakery. Today it became the **noisy mode**.

    Timeline about 06:30-07:10. Ideas 189, 190, 191, 192.

    **Taxi stand**: on the walk I just said it; Claude **repeated it back**, I corrected it, and it was saved. (Number kept off the slide.)

    **Ideas from the walk**: offline audio capture, smart home voice agent, face and voice recognition, consent and enrollment flow.

    **Learning**: no audio "got it" before tool calls, so I had to take the phone out.

    Every idea lands in Drive as raw data, with credit.

    **Message**: the conversation is the backlog.

    **Two real tests of the wake word.** On the street a woman asked for directions and Claude stayed quiet; in the bakery, with staff and customers talking, it stayed quiet too. The only limit: the voice client forces a reply, so it said "(stays silent)" instead of nothing.

    **Ideas captured walking:** a voice agent reachable from any room (189), face and voice recognition to tell who speaks (190), consent and enrollment (191), offline capture when the call dropped leaving the building (192), the geolocation of an idea (198).

    **Naming the raw layer:** Mnemosyne first, then Pontos, easier to say: the primordial sea, father of Nereus (194 to 196).

    **The taxi stand number** I always tried to write down: I just said it on the walk. Claude first said it was saved without repeating it; new rule: repeat back before noting (197, 206).
  pt:
    topic: Mãos livres
    message: Passeio com o cachorro, mãos livres
    accent: livres
    screen:
    - '**Palavra de ativação:** só responde a "Claude"'
    - '- Teste na rua: alguém pediu informação, ficou em silêncio'
    - '- Teste na padaria: muitas vozes, ficou em silêncio'
    - '**Ideias no caminho:** cada uma cai no Drive como dado bruto'
    - '- Agente de voz em todo cômodo da casa'
    - '- A ligação caiu: gravar offline, processar depois'
    - '- O bruto ganha nome: Pontos, o pai de Nereus'
    - '**Regras novas:** aprendidas no passeio'
    - '- Um "entendi" em áudio antes das ferramentas'
    - '- Repetir o que entendeu antes de anotar (o número do táxi)'
    - '**A conversa:** é o backlog'
    notes: |-
      Só responde quando a frase começa com "Claude"

      Ideias capturadas andando

      O número do táxi: falei, ficou salvo

      Sem sinal ao sair do prédio: mais uma ideia

      Regra nova: um "entendi" em áudio antes das ferramentas

      **Regra do owner**: o Claude só responde quando a frase começa com **Claude**; senão posso estar falando com o cachorro, um vizinho, a padaria. Hoje virou o **modo barulhento**.

      Linha do tempo por volta de 06:30-07:10. Ideias 189, 190, 191, 192.

      **Ponto de táxi**: no passeio só falei; o Claude **repetiu**, eu corrigi, e ficou salvo. (O número fica fora do slide.)

      **Ideias do passeio**: captura de áudio offline, agente de voz para casa inteligente, reconhecimento de rosto e voz, fluxo de consentimento e cadastro.

      **Aprendizado**: sem um "entendi" em áudio antes das ferramentas, tive que tirar o celular do bolso.

      Toda ideia cai no Drive como dado bruto, com crédito.

      **Mensagem**: a conversa é o backlog.

      **Dois testes reais da palavra de ativação.** Na rua, uma moça pediu informação e o Claude ficou quieto; na padaria, com atendentes e clientes falando, ficou quieto também. O único limite: o cliente de voz força uma resposta, então ele disse "(fica em silêncio)" em vez de nada.

      **Ideias capturadas andando:** agente de voz em qualquer cômodo (189), reconhecimento de rosto e voz para saber quem fala (190), consentimento e cadastro (191), captura offline quando a ligação caiu ao sair do prédio (192), a geolocalização da ideia (198).

      **Nome para o bruto:** primeiro Mnemosyne, depois Pontos, mais fácil de falar: o mar primordial, pai de Nereus (194 a 196).

      **O número da parada de táxi** que eu sempre tentava anotar: no passeio, só falei. O Claude primeiro disse que salvou sem repetir; regra nova: repetir antes de anotar (197, 206).
