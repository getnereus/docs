    notes: |-
      What we want to say: **the golden path guides without becoming a cage.**

      **Platform as a Product, p. 11:** "abstractions should be composable and optional. They should guide without constraining. They should reduce complexity without hiding critical details."

      **A caveat:** the "golden cage", a rigid path imposed from above, breeds shadow platforms, and there is no universal golden path (p. 11).

      **Imposing the path does not solve it:** "mandated usage generates resentment rather than advocacy, and resentment metastasizes into **shadow infrastructure**" ("The platform engineering illusion"), a source independent of Syntasso for the same caveat.

      Source: references/platform-as-a-product.md, references/platform-illusion.md
