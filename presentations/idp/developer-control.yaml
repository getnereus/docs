      **Format:** the Score model (`score.dev/v1b1`, see the [spec reference](https://docs.score.dev/docs/score-specification/score-spec-reference/)). **Catalog is not declaration:** `catalog-info.yaml` says who the app is; `app-spec.yaml` says what it needs.

      Source: references/score.md
