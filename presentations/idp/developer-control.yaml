deck:
  name: idp-developer-control
  title: "Developer Control Plane"
  subtitle: "The catalog, the app declaration and the golden paths: where the developer starts"
  accent: "where the developer starts"
  pt:
    title: "Developer Control Plane"
    subtitle: "O catálogo, a declaração da app e os golden paths: por onde o dev começa"
    accent: "por onde o dev começa"

acts:
  - name: opening
    title: "Opening"
    pt: {title: "Abertura"}
  - name: catalog
    title: "Software Catalog"
    pt: {title: "Catálogo de software"}
  - name: declaration
    title: "App Declaration"
    pt: {title: "Declaração da app"}
  - name: golden-paths
    title: "Golden Paths"
    pt: {title: "Golden paths"}

references:
  - name: backstage-catalog
    title: "Backstage Software Catalog: system model, FAQ and life of an entity"
    author: "Backstage documentation"
    url: "https://backstage.io/docs/features/software-catalog/system-model#ecosystem-modeling"
    about: "The documentation of the Backstage software catalog: the entities (Component, API, Resource, System, Domain, Group), why the catalog does not hold versions, and how a file enters the catalog."
    forUs: "\"We do not recommend trying to represent fine grained versions in the catalog.\" The catalog holds \"the human concept of a thing\"."
    pt:
      about: "A documentação do catálogo de software do Backstage: as entidades (Component, API, Resource, System, Domain, Group), por que o catálogo não guarda versões e como um arquivo entra no catálogo."
      forUs: "\"We do not recommend trying to represent fine grained versions in the catalog.\" O catálogo guarda \"the human concept of a thing\"."
  - name: score
    title: "Score specification reference"
    author: "Score documentation"
    url: "https://docs.score.dev/docs/score-specification/score-spec-reference/"
    about: "A platform- and environment-independent workload spec (apiVersion score.dev/v1b1): the developer describes what the app needs, the platform decides how and where."
    forUs: "Its sections (metadata, containers, service, resources) are the model of the app declaration on these slides; resources are asked for by type, never by cloud service."
    pt:
      about: "Uma especificação de workload independente de plataforma e de ambiente (apiVersion score.dev/v1b1): o dev descreve o que a app precisa, e a plataforma decide como e onde."
      forUs: "As suas seções (metadata, containers, service, resources) são o modelo da declaração da app nestes slides; os recursos são pedidos por tipo, nunca por serviço de nuvem."
  - name: platform-illusion-2026
    title: "The Platform Engineering Illusion"
    author: "David Iyanu Jonathan"
    year: 2026
    url: "https://platformengineering.com/features/the-platform-engineering-illusion-why-most-internal-developer-platforms-fail-before-developers-ever-use-them/"
    about: "An opinion piece: internal developer platforms fail because they are run as tooling initiatives when they are a product discipline."
    forUs: "\"Why would a developer, mid-deadline, exhausted, half paying attention, choose your paved road over the goat trail they already know?\" Its figures are the author's own account and stay off the screen."
    pt:
      about: "Um artigo de opinião: as plataformas internas falham porque são tocadas como iniciativas de ferramentas quando são uma disciplina de produto."
      forUs: "\"Why would a developer, mid-deadline, exhausted, half paying attention, choose your paved road over the goat trail they already know?\" Os números são o relato do próprio autor e ficam fora da tela."
  - name: platform-as-a-product-2025
    title: "Platform as a Product"
    author: "Abby Bangser, Daniel Bryant, Colin Humphreys and Cat Morris"
    year: 2025
    url: "https://www.syntasso.io/platform-as-a-product-oreilly-report"
    about: "An O'Reilly report: a platform is a product, with users, a value proposition, a feedback loop and a focus on adoption, not an infrastructure project with a delivery date."
    forUs: "\"abstractions should be composable and optional. They should guide without constraining.\" (p. 11), and the golden cage: a rigid, top-down golden path breeds shadow platforms. The four authors work for Syntasso, the company behind Kratix."
    pt:
      about: "Um relatório da O'Reilly: plataforma é produto, com usuários, proposta de valor, ciclo de feedback e foco em adoção, não um projeto de infraestrutura com data de entrega."
      forUs: "\"abstractions should be composable and optional. They should guide without constraining.\" (p. 11), e a golden cage: um golden path rígido, imposto de cima, gera shadow platforms. Os quatro autores trabalham na Syntasso, a empresa por trás do Kratix."

slides:
  # ── Opening ─────────────────────────────────────────
  - name: title
    act: opening
    cover: true
    message: "The Developer Control Plane is where the developer starts"
    notes: |-
      What we want to say: **the developer enters the platform here**: the catalog says who the app is, the declaration says what it needs, and the golden path creates both at once.

      **Route of this deck:** the Software Catalog, the App Declaration and the Golden Paths, in the order a developer meets them.
    pt:
      message: "O Developer Control Plane é por onde o dev começa"
      notes: |-
        O que queremos dizer: **o dev entra na plataforma por aqui**: o catálogo diz quem a app é, a declaração diz do que ela precisa, e o golden path cria os dois de uma vez.

        **Roteiro deste deck:** o catálogo de software, a declaração da app e os golden paths, na ordem em que o dev os encontra.

  - name: landscape-dev
    act: opening
    topic: "Capabilities"
    message: "The Developer Control Plane has three pieces: catalog, app declaration and golden paths"
    accent: "three pieces"
    heading: "Developer Control Plane"
    diagram: "../../assets/docs/landscape.svg"
    show: [planes.dev-plane, planes.ind-plane, planes.res-plane, planes.obs-plane, planes.sec-plane]
    reveal: [planes.dev.1, planes.dev.2, planes.dev.3]
    accumulate: true
    source: "platformengineering.org/platform-tooling · planes as parallel layers; the journey order is ours"
    dependsOn: [title]
    notes: |-
      What we want to say: **the developer enters here**: the catalog says who the app is, the declaration says what it needs, and the golden path creates both at once.

      **The three boxes are the three acts of this deck**, one slide of the drawing for each.
    pt:
      topic: "Capacidades"
      message: "O Developer Control Plane tem três peças: catálogo, declaração da app e golden paths"
      accent: "três peças"
      heading: "Developer Control Plane"
      notes: |-
        O que queremos dizer: **o dev entra por aqui**: o catálogo diz quem a app é, a declaração diz do que ela precisa, e o golden path cria os dois de uma vez.

        **As três caixas são os três atos deste deck**, um slide do desenho para cada uma.

  # ── Software Catalog ────────────────────────────────
  - name: detail-catalog
    act: catalog
    topic: "Software Catalog"
    message: "The catalog says what exists and who owns it"
    accent: "who owns it"
    heading: "Software Catalog"
    diagram: "../../assets/docs/landscape.svg"
    dim: [planes.dev-plane, planes.ind-plane, planes.res-plane, planes.obs-plane, planes.sec-plane, planes.dev.2, planes.dev.3]
    show: [planes.dev.1]
    source: "platformengineering.org/platform-tooling · planes as parallel layers; the journey order is ours"
    dependsOn: [landscape-dev]
    notes: |-
      What we want to say: **the first item of the Developer Control Plane is the catalog**: the map of what exists and of who answers for each thing.

      **Unlike the platformengineering.org landscape, the Portal is not in here**: it becomes a client of the platform, like the CLI and the agents. We show that after the planes.
    pt:
      topic: "Catálogo de software"
      message: "O catálogo diz o que existe e quem é dono"
      accent: "quem é dono"
      heading: "Software Catalog"
      notes: |-
        O que queremos dizer: **o primeiro item do Developer Control é o catálogo**: o mapa do que existe e de quem responde por cada coisa.

        **Diferente do landscape do platformengineering.org, o Portal não está aqui dentro**: ele vira um cliente da plataforma, como a CLI e os agentes. Mostramos isso depois dos planes.

  - name: catalog-ownership
    act: catalog
    topic: "Software Catalog"
    message: "The catalog answers what exists and who owns it"
    accent: "who owns it"
    heading: "The catalog answers"
    screen: ["**Question:** what exists?", "**Question:** who owns it?"]
    refs: [backstage-catalog, platform-illusion-2026]
    dependsOn: [detail-catalog]
    notes: |-
      What we want to say: **the catalog answers what exists and who owns it.**

      **The catalog is the register of the organization's software, kept next to the code.** The portal is one way to see it; it comes back after the planes, as a client of the platform.

      **What exists:** the inventory of today's services, APIs, databases and queues.

      **Who owns it:** the question that is worth the most. Every Component, API, Resource and System has an `owner` (the Backstage model). **Without an owner, the catalog becomes a dead list.**

      **It goes back to the tribal knowledge of the first act:** "whom do I ask?" no longer depends on who happens to know, and gets a **written answer that serves the developer and the agent**.

      **An account** from "The platform engineering illusion": a Backstage launched with 43 services in the catalog, 12 of them out of date, and everybody celebrating the launch.

      Source: references/backstage-catalog.md, references/platform-illusion.md
    pt:
      topic: "Catálogo de software"
      message: "O catálogo responde o que existe e quem é dono"
      accent: "quem é dono"
      heading: "O catálogo responde"
      screen: ["**Pergunta:** o que existe?", "**Pergunta:** quem é dono?"]
      notes: |-
        O que queremos dizer: **o catálogo responde o que existe e quem é dono.**

        **O catálogo é o registro do software da organização, mantido junto do código.** O portal é uma das formas de vê-lo; ele volta depois dos planes, como cliente da plataforma.

        **O que existe:** o inventário de serviços, APIs, bancos e filas de hoje.

        **Quem é dono:** a pergunta que mais vale. Todo Component, API, Resource e System tem `owner` (modelo do Backstage). **Sem dono, o catálogo vira lista morta.**

        **Volta ao conhecimento tribal do primeiro ato:** "a quem eu pergunto?" deixa de depender de quem sabe e passa a ter uma **resposta escrita, que serve ao dev e ao agente**.

        **Um relato** de "The platform engineering illusion": um Backstage lançado com 43 serviços no catálogo, 12 deles desatualizados, e todo mundo comemorando o lançamento.

        Fonte: references/backstage-catalog.md, references/platform-illusion.md

  - name: catalog-levels
    act: catalog
    topic: "Software Catalog · two views"
    message: "The catalog sees the software in two ways: through the business and through engineering"
    accent: "two ways"
    heading: "The catalog has two views"
    screen: ["**Business view:** how leadership sees it", "**Engineering view:** how teams build it"]
    refs: [backstage-catalog]
    dependsOn: [catalog-ownership]
    notes: |-
      What we want to say: **the same catalog serves those who talk business and those who build.**

      **Business view:** how product and leadership see the software. **Engineering view:** how the teams build it.

      **The same catalog links the two:** every piece that is built belongs to a business capability. The next two slides open each view.

      Source: references/backstage-catalog.md
    pt:
      topic: "Catálogo de software · duas visões"
      message: "O catálogo enxerga o software de dois jeitos: pelo negócio e pela engenharia"
      accent: "dois jeitos"
      heading: "O catálogo tem duas visões"
      screen: ["**Visão de negócio:** como a liderança o vê", "**Visão de engenharia:** como os times o constroem"]
      notes: |-
        O que queremos dizer: **o mesmo catálogo serve a quem fala de negócio e a quem constrói.**

        **Visão de negócio:** como produto e liderança enxergam o software. **Visão de engenharia:** como os times o constroem.

        **O mesmo catálogo liga as duas:** cada peça construída pertence a uma capacidade de negócio. Os próximos dois slides abrem cada visão.

        Fonte: references/backstage-catalog.md

  - name: catalog-business-view
    act: catalog
    topic: "Software Catalog · business view"
    message: "The business view groups the software by area and by capability"
    accent: "area and by capability"
    heading: "Business view"
    screen: ["**Domain:** a business area", "**System:** a capability with public APIs"]
    refs: [backstage-catalog]
    dependsOn: [catalog-levels]
    notes: |-
      What we want to say: **the business view groups the software by area and by capability.**

      **Domain:** groups Systems that share terminology, model and business purpose, a bounded context.

      **System:** the set of Components and Resources that delivers a capability and exposes one or more public APIs, **hiding the implementation from those who consume it**.

      Source: references/backstage-catalog.md
    pt:
      topic: "Catálogo de software · visão de negócio"
      message: "A visão de negócio agrupa o software por área e por capacidade"
      accent: "área e por capacidade"
      heading: "Visão de negócio"
      screen: ["**Domain:** uma área de negócio", "**System:** uma capacidade com APIs públicas"]
      notes: |-
        O que queremos dizer: **a visão de negócio agrupa o software por área e por capacidade.**

        **Domain:** agrupa Systems que compartilham terminologia, modelo e propósito de negócio, um bounded context.

        **System:** o conjunto de Components e Resources que entrega uma capacidade e expõe uma ou mais APIs públicas, **escondendo a implementação de quem consome**.

        Fonte: references/backstage-catalog.md

  - name: catalog-engineering-view
    act: catalog
    topic: "Software Catalog · engineering view"
    message: "The engineering view shows what is built, how the pieces talk and what they depend on"
    accent: "what is built"
    heading: "Engineering view"
    screen: ["**Component:** what you _build_ and _deploy_", "**API:** the _boundary_ between components", "**Resource:** what it _needs_ at runtime"]
    refs: [backstage-catalog]
    dependsOn: [catalog-business-view]
    notes: |-
      What we want to say: **the engineering view shows what is built**, how the pieces talk and what they depend on.

      **Acronym:** API (Application Programming Interface) is the boundary between Components.

      **Component:** the piece of software: a service, a website, a data pipeline. **API:** the **boundary between Components**, in a machine-readable format. **Resource:** the infrastructure the Component needs **at runtime**: a database, a queue, a bucket.

      **Every Component belongs to a System, which belongs to a Domain**, and that is where the two views meet. The next slides show each entity with a familiar example.

      Source: references/backstage-catalog.md
    pt:
      topic: "Catálogo de software · visão de engenharia"
      message: "A visão de engenharia mostra o que se constrói, como as peças conversam e do que dependem"
      accent: "o que se constrói"
      heading: "Visão de engenharia"
      screen: ["**Component:** o que você _constrói_ e _entrega_", "**API:** a _fronteira_ entre components", "**Resource:** o que ele _precisa_ em runtime"]
      notes: |-
        O que queremos dizer: **a visão de engenharia mostra o que se constrói**, como as peças conversam e do que dependem.

        **Sigla:** API (Application Programming Interface) é a fronteira entre Components.

        **Component:** a peça de software: serviço, site, pipeline de dados. **API:** a **fronteira entre Components**, em formato legível por máquina. **Resource:** a infraestrutura de que o Component precisa **em runtime**: banco, fila, bucket.

        **Cada Component pertence a um System, que pertence a um Domain**, e é aí que as duas visões se encontram. Os próximos slides mostram cada entidade com um exemplo conhecido.

        Fonte: references/backstage-catalog.md

  - name: entity-component
    act: catalog
    topic: "Software Catalog · Component"
    message: "A Component is a piece of software that someone maintains and delivers"
    accent: "maintains and delivers"
    heading: "Component"
    screen: ["**What:** software you build and deploy"]
    refs: [backstage-catalog]
    dependsOn: [catalog-engineering-view]
    notes: |-
      What we want to say: **a Component is the software that a team maintains and delivers**: a service, a website, a library, a data pipeline.

      Source: references/backstage-catalog.md
    pt:
      topic: "Catálogo de software · Component"
      message: "Component é uma peça de software que alguém mantém e entrega"
      accent: "mantém e entrega"
      heading: "Component"
      screen: ["**O quê:** software que você constrói e entrega"]
      notes: |-
        O que queremos dizer: **Component é o software que um time mantém e entrega**: serviço, site, biblioteca, pipeline de dados.

        Fonte: references/backstage-catalog.md

  - name: entity-component-example
    act: catalog
    topic: "Software Catalog · Component example"
    message: "The seat-selection service, from the example catalog of Tailwind Air, is a Component"
    accent: "is a Component"
    screen: ["**Component:** `seat-selection`, a service", "**Does:** shows the free seats, holds the seat a passenger picks"]
    dependsOn: [entity-component]
    notes: |-
      What we want to say: **`seat-selection` is the service that shows the seat map** and books the seat the passenger picks.

      **It comes from the example catalog of the first proof of concept**, which models Tailwind Air, a fictional airline.
    pt:
      topic: "Catálogo de software · exemplo de Component"
      message: "O seat-selection, do catálogo de exemplo da Tailwind Air, é um Component"
      accent: "é um Component"
      screen: ["**Component:** `seat-selection`, um serviço", "**Faz:** mostra os assentos livres, guarda o assento que o passageiro escolhe"]
      notes: |-
        O que queremos dizer: **`seat-selection` é o serviço que mostra o mapa de assentos** e reserva o assento que o passageiro escolhe.

        **Vem do catálogo de exemplo da primeira prova de conceito**, que modela a Tailwind Air, uma companhia aérea fictícia.

  - name: entity-api
    act: catalog
    topic: "Software Catalog · API"
    message: "An API is the contract between Components"
    accent: "the contract"
    heading: "API"
    screen: ["**What:** the contract between components"]
    refs: [backstage-catalog]
    dependsOn: [entity-component]
    notes: |-
      What we want to say: **the API is the contract**; whoever consumes it depends on the contract, not on the implementation.

      **Acronym:** API (Application Programming Interface).

      **It is a machine-readable boundary** (OpenAPI, AsyncAPI, gRPC, GraphQL).

      Source: references/backstage-catalog.md
    pt:
      topic: "Catálogo de software · API"
      message: "API é o contrato entre Components"
      accent: "o contrato"
      heading: "API"
      screen: ["**O quê:** o contrato entre components"]
      notes: |-
        O que queremos dizer: **API é o contrato**; quem consome depende dele, não da implementação.

        **Sigla:** API (Application Programming Interface).

        **É uma fronteira legível por máquina** (OpenAPI, AsyncAPI, gRPC, GraphQL).

        Fonte: references/backstage-catalog.md

  - name: entity-api-example
    act: catalog
    topic: "Software Catalog · API example"
    message: "The web-checkin Component consumes the seats API, provided by the seat-selection Component"
    accent: "consumes the seats API"
    screen: ["**API:** `seats`, a REST API, provided by `seat-selection`", "**Consumed by:** `web-checkin`, a website"]
    dependsOn: [entity-api]
    notes: |-
      What we want to say: **the check-in website `web-checkin` (`type: website`) consumes the `seats` API** (`consumesApis`), which the `seat-selection` microservice (`type: service`) exposes (`providesApis`). The type comes from the `spec.type` field of each Component in the Tailwind Air catalog.

      **`seat-selection` is the Component** (`type: service`), the service that runs; **the API is `seats`**, the contract it provides and `web-checkin` consumes. The name says what the piece does, and the type stays in `spec.type`, which is what the catalog filters by: a Component named `*-api` confuses the service with the contract, and a `*-service` repeats the type.
    pt:
      topic: "Catálogo de software · exemplo de API"
      message: "O Component web-checkin consome a API seats, fornecida pelo Component seat-selection"
      accent: "consome a API seats"
      screen: ["**API:** `seats`, uma API REST, fornecida pelo `seat-selection`", "**Consumida por:** `web-checkin`, um site"]
      notes: |-
        O que queremos dizer: **o site de check-in `web-checkin` (`type: website`) consome a API `seats`** (`consumesApis`), que o microsserviço `seat-selection` (`type: service`) expõe (`providesApis`). O tipo vem do campo `spec.type` de cada Component no catálogo da Tailwind Air.

        **`seat-selection` é o Component** (`type: service`), o serviço que roda; **a API é `seats`**, o contrato que ele fornece e que o `web-checkin` consome. O nome diz o que a peça faz, e o tipo fica no `spec.type`, por onde o catálogo filtra: um Component chamado `*-api` confunde o serviço com o contrato, e um `*-service` repete o tipo.

  - name: entity-resource
    act: catalog
    topic: "Software Catalog · Resource"
    message: "A Resource is the infrastructure a Component needs to run"
    accent: "needs to run"
    heading: "Resource"
    screen: ["**What:** infrastructure needed at runtime"]
    refs: [backstage-catalog]
    dependsOn: [entity-api]
    notes: |-
      What we want to say: **a Resource is the infrastructure the Component needs to run**: a database, a queue, a bucket.

      **A hook for the Resource Plane:** here the Resource is described **by its role** (database); there it becomes a concrete service.

      Source: references/backstage-catalog.md
    pt:
      topic: "Catálogo de software · Resource"
      message: "Resource é a infraestrutura de que o Component precisa para rodar"
      accent: "precisa para rodar"
      heading: "Resource"
      screen: ["**O quê:** infraestrutura necessária em runtime"]
      notes: |-
        O que queremos dizer: **Resource é a infraestrutura de que o Component precisa para rodar**: banco, fila, bucket.

        **Gancho para o Resource Plane:** aqui o Resource é descrito **pelo papel** (database); lá vira um serviço concreto.

        Fonte: references/backstage-catalog.md

  - name: entity-resource-example
    act: catalog
    topic: "Software Catalog · Resource example"
    message: "The seat-selection service depends on the passengers-db database"
    accent: "depends on"
    screen: ["**Resource:** `passengers-db`, a database", "**Used by:** `seat-selection`, owned by the `reservations` system"]
    dependsOn: [entity-resource]
    notes: |-
      What we want to say: **the `seat-selection` microservice (`type: service`) depends on `passengers-db` (`type: database`)**, which holds the reservations and their passengers.
    pt:
      topic: "Catálogo de software · exemplo de Resource"
      message: "O seat-selection depende do banco passengers-db"
      accent: "depende do banco"
      screen: ["**Resource:** `passengers-db`, um banco de dados", "**Usado por:** `seat-selection`, de propriedade do system `reservations`"]
      notes: |-
        O que queremos dizer: **o microsserviço `seat-selection` (`type: service`) depende de `passengers-db` (`type: database`)**, que guarda as reservas e os seus passageiros.

  - name: entity-system
    act: catalog
    topic: "Software Catalog · System"
    message: "A System groups the Components, APIs and Resources that deliver a capability, and hides the rest"
    accent: "hides the rest"
    heading: "System"
    screen: ["**What:** components that deliver a capability"]
    refs: [backstage-catalog]
    dependsOn: [entity-resource]
    notes: |-
      What we want to say: **a System groups the pieces that deliver a capability** and hides what is inside.

      **Those outside see only the public APIs of the System**; what is inside can change without telling anybody.

      **It is a team's unit of ownership.**

      Source: references/backstage-catalog.md
    pt:
      topic: "Catálogo de software · System"
      message: "System junta Components, APIs e Resources que entregam uma capacidade, e esconde o resto"
      accent: "esconde o resto"
      heading: "System"
      screen: ["**O quê:** components que entregam uma capacidade"]
      notes: |-
        O que queremos dizer: **System junta as peças que entregam uma capacidade** e esconde o que há dentro.

        **Quem está fora enxerga só as APIs públicas do System**; o que há dentro pode mudar sem avisar ninguém.

        **É a unidade de ownership de um time.**

        Fonte: references/backstage-catalog.md

  - name: entity-system-example
    act: catalog
    topic: "Software Catalog · System example"
    message: "The seat-map System brings the previous pieces together"
    accent: "brings the previous pieces together"
    screen: ["**System:** `seat-map`", "**Groups:** `web-checkin`, `seat-selection` and `seats`"]
    dependsOn: [entity-system]
    notes: |-
      What we want to say: **the `seat-map` System gathers the `web-checkin` website, the `seat-selection` microservice and the `seats` API between them**, the pieces of the previous slides. A System groups **Components, APIs and Resources**.

      **The `passengers-db` database is a shared Resource:** it belongs to the `reservations` System and is also used by `boarding-pass` and `miles`. `seat-selection` declares the dependency (`dependsOn`) without the database changing owner.
    pt:
      topic: "Catálogo de software · exemplo de System"
      message: "O System seat-map junta as peças anteriores"
      accent: "junta as peças anteriores"
      screen: ["**System:** `seat-map`", "**Agrupa:** `web-checkin`, `seat-selection` e `seats`"]
      notes: |-
        O que queremos dizer: **o System `seat-map` reúne o site `web-checkin`, o microsserviço `seat-selection` e a API `seats` entre eles**, as peças dos slides anteriores. Um System junta **Components, APIs e Resources**.

        **O banco `passengers-db` é um Resource compartilhado:** pertence ao System `reservations` e é usado também por `boarding-pass` e `miles`. O `seat-selection` declara a dependência (`dependsOn`) sem que o banco mude de dono.

  - name: entity-domain
    act: catalog
    topic: "Software Catalog · Domain"
    message: "A Domain groups the Systems of the same business area"
    accent: "same business area"
