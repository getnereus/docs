    notes: |-
      What we want to say: **the app declaration says what the app needs, without saying where or how**, and it starts with the resources, asked for by **type**.

      **The developer asks for a postgres database, and nothing else.** The platform chooses the concrete service, per environment: the same principle as the catalog Resources, described by their role.

