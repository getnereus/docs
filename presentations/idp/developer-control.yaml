  - name: tailwind-dependents
    act: catalog
    topic: "Software Catalog · across the domain"
    message: "A flight delay becomes one event that reaches five subdomains, and the catalog shows who depends on it"
    accent: "who depends on it"
    heading: "Across the Tailwind domain"
    screen: ["**Topic:** `flight-events`, written by `flight-tracker`", "**Readers:** four services, in four other subdomains"]
    refs: [backstage-catalog]
    dependsOn: [tailwind-tree]
    notes: |-
      What we want to say: **the tree shows the path from top to bottom; the catalog also shows what crosses the branches.**

      **A flight delay becomes an event on the `flight-events` topic.** The one who writes to the topic is `flight-tracker`, in `flight-ops`; the readers are in **four other subdomains**: `boarding-pass-issuer` reissues the boarding pass and `bag-tracker` redirects the bags (`airport`), `rebooking-assistant` rebooks the passengers of a cancelled flight onto the next one with free seats (`booking`), `miles-ledger` reverses the miles of a cancelled flight (`loyalty`) and `roster-planner` redoes the crew roster (`crew`).

      **Whoever changes the event needs to know who reads it.** The catalog answers without anybody asking in the chat: in Backstage, the page of `flight-events` lists the four Components. In the Nereus API this arrives when the Components enter the catalog through discovery.

      **The names come from the example catalog of the first proof of concept.**

      Source: references/backstage-catalog.md
    pt:
      topic: "Catálogo de software · através do domínio"
      message: "Um atraso de voo vira um evento que chega a cinco subdomínios, e o catálogo mostra quem depende dele"
      accent: "quem depende dele"
      heading: "Através do domínio Tailwind"
      screen: ["**Tópico:** `flight-events`, escrito pelo `flight-tracker`", "**Leitores:** quatro serviços, em quatro outros subdomínios"]
      notes: |-
        O que queremos dizer: **a árvore mostra o caminho de cima para baixo; o catálogo também mostra o que atravessa os galhos.**

        **Um atraso no voo vira um evento no tópico `flight-events`.** Quem escreve no tópico é o `flight-tracker`, em `flight-ops`; quem lê está em **quatro outros subdomínios**: o `boarding-pass-issuer` reemite o cartão de embarque e o `bag-tracker` redireciona as malas (`airport`), o `rebooking-assistant` remarca os passageiros de um voo cancelado no próximo com assentos livres (`booking`), o `miles-ledger` estorna as milhas de um voo cancelado (`loyalty`) e o `roster-planner` refaz a escala da tripulação (`crew`).

        **Quem muda o evento precisa saber quem o lê.** O catálogo responde sem ninguém perguntar no chat: no Backstage, a página do `flight-events` lista os quatro Components. Na API do Nereus isso chega quando os Components entram no catálogo pela discovery.

        **Os nomes vêm do catálogo de exemplo da primeira prova de conceito.**

        Fonte: references/backstage-catalog.md

