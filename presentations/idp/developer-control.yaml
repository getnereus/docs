  - name: golden-paths
    act: golden-paths
    topic: "Golden Paths · why developers choose it"
    message: "The right way has to be the easiest: that is what makes the developer choose the golden path"
    accent: "the easiest"
    heading: "Why developers choose it"
    screen: ["**What:** the supported path for a recurring task", "**Rule:** the easy way _is_ the right way"]
    refs: [platform-illusion-2026]
    dependsOn: [detail-golden-paths]
    notes: |-
      What we want to say: **the right way has to be the easiest**: it is the ease, not the obligation, that makes the developer follow it.

      **A golden path is the path the platform supports for a recurring task**, like creating a service or asking for a database. When it is the easiest path, following the standard stops being an obligation.

      **The question that decides adoption**, according to "The platform engineering illusion": "Why would a developer, mid-deadline, exhausted, half paying attention, choose your paved road over the goat trail they already know?"

      Source: references/platform-illusion.md
    pt:
      topic: "Golden paths · por que o dev o escolhe"
      message: "O caminho certo precisa ser o mais fácil: é isso que faz o dev escolher o golden path"
      accent: "o mais fácil"
      heading: "Por que o dev o escolhe"
      screen: ["**O quê:** o caminho suportado para uma tarefa recorrente", "**Regra:** o jeito fácil _é_ o jeito certo"]
      notes: |-
        O que queremos dizer: **o caminho certo precisa ser o mais fácil**: é a facilidade, não a obrigação, que faz o dev segui-lo.

        **Golden path é o caminho suportado pela plataforma para uma tarefa recorrente**, como criar um serviço ou pedir um banco. Quando ele é o caminho mais fácil, seguir o padrão deixa de ser obrigação.

        **A pergunta que decide a adoção**, segundo "The platform engineering illusion": "Why would a developer, mid-deadline, exhausted, half paying attention, choose your paved road over the goat trail they already know?"

        Fonte: references/platform-illusion.md

  - name: golden-paths-shape
    act: golden-paths
    topic: "Golden Paths · how it guides"
    message: "The golden path guides without trapping: it is optional and composes with others"
    accent: "guides without trapping"
    heading: "How it guides"
    screen: ["**Shape:** optional and composable", "**Risk:** a golden cage _breeds_ shadow platforms"]
