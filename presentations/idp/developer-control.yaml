        **Uma proposta (ideia, não decidida):** `experimental` é onde o dono provisiona, testa e refina. `production` é validado e **compartilhado**, então outros times podem depender dele. `deprecated` está em descontinuação, e quem depende recebe aviso e prazo.

        **Subir para `production` pode virar gate da plataforma:** dono, observabilidade, custo atribuído e segurança em dia.

