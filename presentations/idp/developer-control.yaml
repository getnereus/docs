  - name: golden-paths-output-example
    act: golden-paths
    topic: "Golden Paths · what it creates, an example"
    message: "The next Nereid is born from the nereid-python template, and one apply registers it in the catalog next to Triton"
    accent: "one apply"
    status: idea
    terminal:
      cwd: "~/git/nereus"
      steps:
        - comment: "The golden path: the edge-cloudflare Nereid from the nereid-python template (a Template of the catalog, an idea)"
          run: "nereus template render nereid-python"
          options: ["--path controllers/edge-cloudflare/", "--param name=edge-cloudflare"]
          output: |-
            ✓ catalog/templates/nereid-python rendered at controllers/edge-cloudflare/ (15 files, catalog/workloads/edge-cloudflare.yaml written)
        - comment: "Register what the repository says it has: the new entry, and Triton already imported"
          run: "nereus catalog apply"
          options: ["--from-file catalog/"]
          output: |-
            ✓ catalog/workloads/edge-cloudflare created (owner: Project/nereids, type: controller)
              catalog/workloads/triton unchanged (owner: Project/triton, type: service)

            Next steps:

              nereus catalog check
    dependsOn: [golden-paths-output]
    notes: |-
      What we want to say: **the template comes first, because it writes the files; the catalog only registers what exists.** The `nereid-python` template renders the next Nereid of the backlog, `edge-cloudflare` (#470, publishing a Reef's endpoint at a hostname), **15 files**, with its catalog entry written next to the code; then one `nereus catalog apply` registers it and leaves Triton, imported earlier the same way, `unchanged`. The command has [its own slide](../../specs/cli/reefs/catalog.html#workload-apply) in the catalog Reef's deck.

      **`template render` is a contract, not built yet; `catalog apply` is built** (owner, 2026-10-30, #559, the catalog Reef: Workload, Package and their types; 2026-11-02, #851, the Template kind): a `Template` is a kind of the catalog that writes files, and creating a repository stays with #279 (the repository Reef); the catalog is a `catalog/` folder in the repository, one file per entry, and the file is the truth, so registering an existing thing is `apply` (ADR 0013, command conventions). A `Workload` (what runs: `controller`, `service`, `web-app`, `static-site`, `worker`, `job`, `function`) replaces Backstage's Component, and a `Package` holds what is published; each names its owner in the tenancy tree, a `Project` that may sit under another one instead of a System and a Domain (#21, Organization and nested Projects).

      **It is Nereus itself in the example**, not a `hello-api`: the catalog's first entries are the platform's own Nereids, Triton, the CLI and the images (dogfooding).
    pt:
      topic: "Golden paths · o que ele cria, um exemplo"
      message: "O próximo Nereid nasce do template nereid-python, e um apply o registra no catálogo ao lado do Triton"
      accent: "um apply"
      notes: |-
        O que queremos dizer: **o template vem primeiro, porque ele escreve os arquivos; o catálogo só registra o que existe.** O template `nereid-python` renderiza o próximo Nereid do backlog, o `edge-cloudflare` (#470, publicar o endpoint de um Reef num hostname), **15 arquivos**, com a entrada do catálogo escrita ao lado do código; depois um `nereus catalog apply` o registra e deixa o Triton, importado antes do mesmo jeito, `unchanged`. O comando tem [o seu próprio slide](../../specs/cli/reefs/catalog.html#workload-apply) no deck do Reef catalog.

        **O `template render` é um contrato, ainda não construído; o `catalog apply` está pronto** (owner, 2026-10-30, #559, o Reef catalog: Workload, Package e seus tipos; 2026-11-02, #851, o kind Template): um `Template` é um kind do catálogo que escreve arquivos, e criar um repositório fica com o #279 (o Reef repository); o catálogo é uma pasta `catalog/` no repositório, um arquivo por entrada, e o arquivo é a verdade, então registrar algo que já existe é `apply` (ADR 0013, convenções de comando). Um `Workload` (o que roda: `controller`, `service`, `web-app`, `static-site`, `worker`, `job`, `function`) substitui o Component do Backstage, e um `Package` guarda o que é publicado; cada um nomeia seu dono na árvore de tenancy, um `Project` que pode ficar debaixo de outro no lugar de System e Domain (#21, Organization e Projects aninhados).

        **O exemplo é o próprio Nereus**, não um `hello-api`: as primeiras entradas do catálogo são os Nereids da plataforma, o Triton, a CLI e as imagens (dogfooding).
