  - name: ip-lifecycle
    act: catalog
    topic: "Software Catalog · lifecycle"
    message: "The lifecycle marks the journey of an Internal Product, from idea to shared product, until it is retired"
    accent: "from idea to shared product"
    heading: "Lifecycle of an Internal Product"
    screen: ["`experimental`: _an idea_ being built", "`production`: validated, _shared_ with the org", "`deprecated`: _being retired_"]
    refs: [backstage-catalog]
    dependsOn: [declare-ownership]
    notes: |-
      What we want to say: **sharing with the organization is a change of state**, and the catalog already has the field for it.

      **Well-known Backstage values:** `experimental`, `production` and `deprecated`, in the `spec.lifecycle` of Component, API, Resource and System (see the [descriptor format](https://backstage.io/docs/features/software-catalog/descriptor-format)). In the Tailwind Air catalog everything is `production`; the example catalog of the platform is `experimental`.

      **A proposal (an idea, not decided):** `experimental` is where the owner provisions, tests and refines. `production` is validated and **shared**, so other teams may depend on it. `deprecated` is being retired, and whoever depends on it gets a warning and a deadline.

      **Moving up to `production` can become a platform gate:** an owner, observability, attributed cost and security up to date.

      Source: references/internal-products.md
