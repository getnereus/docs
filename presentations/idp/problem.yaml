    refs: [platform-as-a-product-2025, platform-illusion-2026]
    dependsOn: [rebuild-platform, empathy-gap]
    notes: |-
      What we want to say: **the platform is a product, and the developer is its customer**.

      **Back to the first slide of the act:** tickets and waits become self-service, and the "how to" that was tribal knowledge becomes a product. The report sums it up: "The model is based on enablement rather than enforcement and self-service rather than ticket queues." (Platform as a Product, p. 3).

      **A product has users,** a value proposition, a feedback loop and a focus on adoption (pp. 3-4, 9-11). It is not an infrastructure project with a delivery date: it has a roadmap and is measured by those who use it.

      **Caveat:** the four authors work for Syntasso, the company behind Kratix.

      **In the same line,** in "The platform engineering illusion": "A technology platform is infrastructure with an API. A developer platform is a product with users", with preferences, workarounds and a memory of every time the tool let them down. And: "every manual step in a "self-service" system is really just a support queue wearing a costume."

      Source: references/platform-as-a-product.md, references/platform-illusion.md
