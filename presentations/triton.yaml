      What we want to say: **from a program in a pod to a part of the platform**. Triton reads `spec`, writes `status`, and the CLI has the reef's commands: `nereus rooms create`, `join`, `follow`, `post`, `peer list` and `session list`. Built by the journey #2067 (the rooms reef: Room and Peer reconciled by triton, on the messaging reef's Topic by contract).

      It meets Amphitrite there: #225 (AI agents on behalf of the platform) and #66 (AI agents as Controllers inside the platform). Triton becomes a declared Agent.

      Source: controllers/triton/README.md, section "What is missing to make it a Nereid".
    pt:
