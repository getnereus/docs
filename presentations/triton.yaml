  # ── Decisions ───────────────────────────────────────
  - name: decide-domain-order
    act: decisions
    topic: "For the owner · 1/2"
    message: "Security comes first, and one action is left for step 1"
    accent: "Security comes first"
    screen: ["**Decided:** one administrator, the owner, logged in by {nereid:keycloak}; outside people later, through {reef:authorization} with {nereid:openfga}", "**Left:** at GoDaddy, DNSSEC off first, then point getnereus.dev to Cloudflare, once"]
    refs: [openfga]
    dependsOn: [step-5-nereid]
    notes: |-
      What we want to say: **decided by the owner on 2026-10-29, security first, and stronger than proposed**: Triton accepts no order until the {reef:authentication} reef is installed and its {nereid:keycloak} Nereid authenticates the user. Only users logged in to Nereus send orders. Storing orders that anyone can forge would only keep the forgery, so memory (step 3) comes after.

      At first a single administrator, the owner. Inviting outside people comes later, through a second reef, {reef:authorization}, with an {nereid:openfga} Nereid: OpenFGA is open source, created by the Auth0/Okta team, inspired by Google Zanzibar, a CNCF project. ADR 0014 (Profiles, bundles of reefs, Nereids and Mandates) already names both, not built yet.

      Still the owner's action: **step 1 waits for the nameservers**; until GoDaddy points to Cloudflare, the zone is not active and the tunnel cannot have a name. Decided on 2026-10-29 too: the zone on Cloudflare now, Azure DNS later as a second Nereid.
    pt:
      message: "Segurança vem primeiro, e falta uma ação para a etapa 1"
      topic: "Para o dono · 1/2"
      accent: "Segurança vem primeiro"
      screen: ["**Decidido:** um administrador, o dono, autenticado pela {nereid:keycloak}; gente de fora depois, pelo {reef:authorization} com a {nereid:openfga}", "**Falta:** na GoDaddy, o DNSSEC desligado primeiro, depois apontar o getnereus.dev para a Cloudflare, uma vez"]
      notes: |-
        O que queremos dizer: **decidido pelo dono em 2026-10-29, segurança primeiro, e mais forte do que o proposto**: o servidor MCP do Tritão não aceita ordem até o reef {reef:authentication} estar instalado e a Nereida {nereid:keycloak} autenticar o usuário. Só quem entrou no Nereus manda ordens. Guardar ordens que qualquer um pode forjar só guardaria a falsificação, então a memória (etapa 3) vem depois.

        No começo um único administrador, o dono. Convidar gente de fora vem depois, por um segundo reef, {reef:authorization}, com uma Nereida {nereid:openfga}: o OpenFGA é open source, criado pelo time do Auth0/Okta, inspirado no Google Zanzibar, um projeto da CNCF. O ADR 0014 (Profiles, pacotes de reefs, Nereidas e Mandates) já cita os dois, ainda não construídos.

        Ainda é ação do dono: **a etapa 1 espera os nameservers**; até a GoDaddy apontar para a Cloudflare, a zona não fica ativa e o túnel não pode ter nome. Também decidido em 2026-10-29: a zona na Cloudflare agora, a Azure DNS depois como segunda Nereida.

