      notes: |-
        O que queremos dizer: **de um programa num pod a uma parte da plataforma**. O Tritão lê o `spec`, escreve o `status`, e o CLI tem os comandos do reef: `nereus rooms create`, `join`, `follow`, `post`, `peer list` e `session list`. Construído pela jornada #2067 (o reef rooms: Room e Peer reconciliados pelo triton, sobre o Topic do reef messaging por contrato).

        Ele encontra a Anfitrite aí: #225 (agentes de IA a serviço da plataforma) e #66 (agentes de IA como Controllers dentro da plataforma). O Tritão vira um Agent declarado.

