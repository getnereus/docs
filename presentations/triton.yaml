        O que queremos dizer: **pronto quando o m15 pede ajuda a outro agente e você lê a conversa inteira depois**.

        Determinístico primeiro, IA só onde é melhor. Toca em #274 (uma decisão respondida emite um evento, e os agentes assinam em vez de perguntar o tempo todo).

        Fonte: controllers/triton/README.md, seção "What is missing to make it a Nereid".

  - name: step-5-nereid
    act: roadmap
    topic: "Step 5 · A Nereid"
    message: "Triton becomes the {nereid:triton} Nereid of the {reef:rooms} reef"
    accent: "Nereid"
    screen: ["**The reef:** `rooms`, its kinds `Room`, `Peer` and `RoomSession` (ADR 0030)", "**NATS:** a Topic of the {reef:messaging} reef per Room, run by the {nereid:nats} Nereid"]
